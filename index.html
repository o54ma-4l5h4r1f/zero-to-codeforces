element).<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nlong long fast(const vector&lt;int&gt; &amp;a) {     // the solution you want to submit: O(n)\n    long long best = a[0], cur = 0;\n    for (int x : a) {\n        cur = max(cur + x, (long long)x);  // continue the old subarray, or start at x\n        best = max(best, cur);\n    }\n    return best;\n}\n\nlong long slow(const vector&lt;int&gt; &amp;a) {     // try every subarray: O(n^2), clearly correct\n    int n = a.size();\n    long long best = a[0];\n    for (int i = 0; i &lt; n; i++) {\n        long long sum = 0;\n        for (int j = i; j &lt; n; j++) {\n            sum += a[j];                   // sum of a[i..j]\n            best = max(best, sum);\n        }\n    }\n    return best;\n}\n\nint main() {\n    mt19937 rng(12345);                    // random generator; same tests on every run\n    for (int test = 1; test &lt;= 1000; test++) {\n        int n = rng() % 6 + 1;             // n from 1 to 6\n        vector&lt;int&gt; a(n);\n        for (int &amp;x : a) x = (int)(rng() % 11) - 5;   // values from -5 to 5\n        long long f = fast(a), s = slow(a);\n        if (f != s) {                      // the first input where they differ\n            cout &lt;&lt; \"DIFFERENT on test \" &lt;&lt; test &lt;&lt; \"\\n\" &lt;&lt; n &lt;&lt; \"\\n\";\n            for (int x : a) cout &lt;&lt; x &lt;&lt; \" \";\n            cout &lt;&lt; \"\\nfast = \" &lt;&lt; f &lt;&lt; \", slow = \" &lt;&lt; s &lt;&lt; \"\\n\";\n            return 0;\n        }\n    }\n    cout &lt;&lt; \"all 1000 tests are equal\\n\";\n}\n<\/code><\/pre>\n    <p>Try it: change <code>best = a[0]<\/code> in <code>fast<\/code> to <code>best = 0<\/code>. The program now prints a small array with only negative numbers. That is the bug: the answer cannot be an empty subarray.<\/p>\n  <\/div>\n<\/section>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>You submit again and again with small random changes. Each wrong submit costs points in a contest.<\/li>\n    <li>You test only the samples. The samples are easy on purpose.<\/li>\n    <li>In a stress test you copy the same wrong idea into <code>slow<\/code>. Write <code>slow<\/code> in a different, simpler way.<\/li>\n    <li>Your random tests are big. Keep n small and the values small, so equal numbers and negative numbers appear often.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/general/debugging-cpp\">USACO Guide: Debugging C++<\/a> — more ways to print and to find a crash.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book. Chapter 5 shows more brute-force code you can use as <code>slow<\/code>.<\/li>\n  <\/ul>\n<\/section>\n","simulation":"<p class=\"idea\">No trick, no formula. Read the rules, then make your program follow them step by step.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The <span class=\"term\" data-t=\"statement\">statement<\/span> describes a process: \"first…, then…, after each step…\".<\/li>\n    <li>The limits are small (n ≤ 100 or n ≤ 1000), so doing every step is fast enough.<\/li>\n    <li>You understand <b>what<\/b> to do after one reading. The only work is to write it carefully.<\/li>\n    <li>Codeforces puts the tag <b>implementation<\/b> on these problems. Another name is <span class=\"term\" data-t=\"simulation\">simulation<\/span>.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — cooking from a recipe<\/h3>\n    <p>A recipe says: \"Put 2 eggs. Add sugar. Mix. Repeat 3 times.\" You do not invent anything. You do each line in the same order.<\/p>\n    <p>The statement is your recipe. Each number in it becomes a <span class=\"term\" data-t=\"variable\">variable<\/span>. Each \"repeat\" becomes a <span class=\"term\" data-t=\"loop\">loop<\/span>. Each \"if\" stays an <code>if<\/code>.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — the tram<\/h3>\n    <p>A tram is empty at the start. At each stop <code>a<\/code> people exit, then <code>b<\/code> people enter. How many seats does the tram need? You need the biggest number of people inside at any moment.<\/p>\n    <p>Write the variables in a table and change them by hand. This is called a <span class=\"term\" data-t=\"trace\">trace<\/span>.<\/p>\n    <table>\n      <tr><th>stop<\/th><th>a (exit)<\/th><th>b (enter)<\/th><th>inside<\/th><th>best<\/th><\/tr>\n      <tr><td>start<\/td><td>–<\/td><td>–<\/td><td>0<\/td><td>0<\/td><\/tr>\n      <tr><td>1<\/td><td>0<\/td><td>3<\/td><td>0 − 0 + 3 = 3<\/td><td>3<\/td><\/tr>\n      <tr><td>2<\/td><td>2<\/td><td>5<\/td><td>3 − 2 + 5 = 6<\/td><td class=\"hi\">6<\/td><\/tr>\n      <tr><td>3<\/td><td>4<\/td><td>2<\/td><td>6 − 4 + 2 = 4<\/td><td>6<\/td><\/tr>\n      <tr><td>4<\/td><td>4<\/td><td>0<\/td><td>4 − 4 + 0 = 0<\/td><td>6<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">The answer is 6. If you can fill this table by hand, you can write the code: one row = one turn of the loop.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — the table becomes a loop<\/h3>\n    <p>Use the same names as the statement (<code>n<\/code>, <code>a<\/code>, <code>b<\/code>). Then you can compare your code with the text line by line.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n;                    // number of stops\n    cin &gt;&gt; n;\n    int inside = 0;           // people in the tram now\n    int best = 0;             // the biggest \"inside\" we saw\n    for (int i = 0; i &lt; n; i++) {\n        int a, b;             // a people exit, b people enter\n        cin &gt;&gt; a &gt;&gt; b;\n        inside -= a;          // first they exit\n        inside += b;          // then they enter\n        best = max(best, inside);\n    }\n    cout &lt;&lt; best &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p>Many problems have <code>t<\/code> <span class=\"term\" data-t=\"test-case\">test cases<\/span> in one input. Put the solution of one case in a function. Then every case starts with fresh variables.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nvoid solve() {                // solves ONE test case\n    int n;\n    cin &gt;&gt; n;\n    long long sum = 0;        // made new for every test case\n    for (int i = 0; i &lt; n; i++) {\n        int x;\n        cin &gt;&gt; x;\n        sum += x;\n    }\n    cout &lt;&lt; sum &lt;&lt; \"\\n\";      // one answer per line\n}\n\nint main() {\n    int t;\n    cin &gt;&gt; t;\n    while (t--) solve();\n}\n<\/code><\/pre>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: you do every step once, so O(number of steps). Check that this number is below about 10^8.<\/p>\n\n<p class=\"tip-box\">Before you submit: run <b>every<\/b> sample from the statement. Compare your output with the expected output letter by letter.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>Wrong output format. <code>YES<\/code> is not <code>Yes<\/code> when the statement asks for exact letters. Do not print extra text like \"Answer:\".<\/li>\n    <li>Wrong order of steps. In the tram, people exit <b>before<\/b> others enter. Follow the order in the statement.<\/li>\n    <li>A variable keeps its old value in the next test case. Create it inside <code>solve()<\/code>.<\/li>\n    <li>You forget the smallest input, the <span class=\"term\" data-t=\"edge-case\">edge case<\/span>. Try n = 1 or n = 2 by hand.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"4A\">Watermelon<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"231A\">Team<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"282A\">Bit++<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"158A\">Next Round<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"116A\">Tram<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"263A\">Beautiful Matrix<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"266B\">Queue at the School<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1352A\">Sum of Round Numbers<\/a><span class=\"r\">800<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/bronze/simulation\">USACO Guide: Simulation<\/a> — short text and more problems of this kind.<\/li>\n    <li><a href=\"https://codeforces.com/group/MWSDmqGsZm/contests\">Assiut newcomers sheets<\/a> — hundreds of very easy problems, sorted by topic.<\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1068\">CSES: Weird Algorithm<\/a> — a classic first simulation. Be careful with <code>long long<\/code>.<\/li>\n  <\/ul>\n<\/section>\n","arrays-strings":"<p class=\"idea\">An array is a row of numbered boxes. A string is a row of boxes with one letter in each.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The input is \"n, then n numbers\". Store them in a <code>vector&lt;int&gt;<\/code>.<\/li>\n    <li>The input is a word or a line of letters. Store it in a <code>string<\/code>.<\/li>\n    <li>You must find the biggest, the smallest, the sum, or the position of something.<\/li>\n    <li>You must look at letters one by one: count them, change them, compare neighbours.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — a street of houses<\/h3>\n    <p>Think of a street with n houses. Each house has a number on the door and one thing inside. The door number is the <span class=\"term\" data-t=\"index\">index<\/span>. The thing inside is the value.<\/p>\n    <p>In C++ the first house has number <b>0<\/b>, not 1. So the last house has number <b>n − 1<\/b>. House number n does not exist.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — the string \"code\"<\/h3>\n    <p>Each box holds one <span class=\"term\" data-t=\"character\">character<\/span>. Inside the computer a character is a small number. The letters <code>'a'<\/code>…<code>'z'<\/code> are 26 numbers in a row. So <code>s[i] - 'a'<\/code> tells you which letter it is: 0 for a, 1 for b, … 25 for z.<\/p>\n    <table>\n      <tr><th>i<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><\/tr>\n      <tr><th>s[i]<\/th><td>'c'<\/td><td>'o'<\/td><td>'d'<\/td><td>'e'<\/td><\/tr>\n      <tr><th>s[i] - 'a'<\/th><td class=\"hi\">2<\/td><td class=\"hi\">14<\/td><td class=\"hi\">3<\/td><td class=\"hi\">4<\/td><\/tr>\n    <\/table>\n    <p class=\"note\"><code>s.size()<\/code> is 4. The last character is <code>s[3]<\/code>. The same trick works for digits: <code>'7' - '0'<\/code> is the number 7.<\/p>\n    <table>\n      <tr><th>I want…<\/th><th>write…<\/th><\/tr>\n      <tr><td>length<\/td><td><code>s.size()<\/code><\/td><\/tr>\n      <tr><td>first / last character<\/td><td><code>s[0]<\/code> / <code>s.back()<\/code><\/td><\/tr>\n      <tr><td>letter → number 0..25<\/td><td><code>c - 'a'<\/code> (small letters), <code>c - 'A'<\/code> (big letters)<\/td><\/tr>\n      <tr><td>digit character → number 0..9<\/td><td><code>c - '0'<\/code><\/td><\/tr>\n      <tr><td>number 0..25 → letter<\/td><td><code>char('a' + k)<\/code><\/td><\/tr>\n      <tr><td>make small / big<\/td><td><code>c = tolower(c);<\/code> / <code>c = toupper(c);<\/code><\/td><\/tr>\n      <tr><td>are two strings equal?<\/td><td><code>s == t<\/code><\/td><\/tr>\n      <tr><td>which comes first in a dictionary?<\/td><td><code>s &lt; t<\/code><\/td><\/tr>\n      <tr><td>join two strings / add one character<\/td><td><code>s + t<\/code> / <code>s += c;<\/code><\/td><\/tr>\n      <tr><td>a piece: start at <code>pos<\/code>, take <code>len<\/code> characters<\/td><td><code>s.substr(pos, len)<\/code><\/td><\/tr>\n      <tr><td>turn it around<\/td><td><code>reverse(s.begin(), s.end());<\/code><\/td><\/tr>\n    <\/table>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — one loop does almost everything<\/h3>\n    <p><b>Array:<\/b> read n numbers. Print the sum, the <span class=\"term\" data-t=\"maximum\">maximum<\/span>, and the position of the maximum (counting from 1).<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n;\n    cin &gt;&gt; n;\n    vector&lt;int&gt; a(n);                 // n boxes: a[0] ... a[n-1]\n    for (int i = 0; i &lt; n; i++) cin &gt;&gt; a[i];\n\n    long long sum = 0;\n    int best = a[0];                  // start with the first value, not with 0\n    int pos = 0;                      // where the maximum is\n    for (int i = 0; i &lt; n; i++) {\n        sum += a[i];\n        if (a[i] &gt; best) {\n            best = a[i];\n            pos = i;\n        }\n    }\n    cout &lt;&lt; sum &lt;&lt; \" \" &lt;&lt; best &lt;&lt; \" \" &lt;&lt; pos + 1 &lt;&lt; \"\\n\";   // +1: people count from 1\n}\n<\/code><\/pre>\n    <p><b>String:<\/b> read a word. Make every letter small. Count how many different letters it has.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    string s;\n    cin &gt;&gt; s;                              // reads one word (stops at a space)\n    vector&lt;bool&gt; seen(26, false);          // seen[0] is for 'a', seen[25] is for 'z'\n    int different = 0;\n    for (int i = 0; i &lt; (int)s.size(); i++) {\n        s[i] = tolower(s[i]);              // 'H' becomes 'h'\n        int k = s[i] - 'a';                // 0..25\n        if (!seen[k]) {\n            seen[k] = true;\n            different++;\n        }\n    }\n    cout &lt;&lt; s &lt;&lt; \" \" &lt;&lt; different &lt;&lt; \"\\n\"; // Hello -&gt; hello 4\n}\n<\/code><\/pre>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: one loop over n boxes is O(n). Fine for n up to 10^6 and more.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>You use <code>a[n]<\/code> or <code>a[i + 1]<\/code> at the last box. It does not exist. The program crashes or prints garbage.<\/li>\n    <li>The statement counts from 1, your code counts from 0. Add 1 when you print a position.<\/li>\n    <li><code>cout &lt;&lt; tolower(c)<\/code> prints a number like 104. Save it first: <code>char d = tolower(c);<\/code> then print <code>d<\/code>.<\/li>\n    <li><code>'5'<\/code> is not <code>5<\/code>. The character <code>'5'<\/code> is the number 53. Use <code>c - '0'<\/code>.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"71A\">Way Too Long Words<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"281A\">Word Capitalization<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"112A\">Petya and Strings<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"266A\">Stones on the Table<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"59A\">Word<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"41A\">Translation<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"110A\">Nearly Lucky Number<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"136A\">Presents<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"339A\">Helpful Maths<\/a><span class=\"r\">800<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/bronze/intro-ds\">USACO Guide: Introduction to Data Structures<\/a> — arrays and vectors with examples.<\/li>\n    <li><a href=\"https://en.cppreference.com/w/cpp/string/basic_string\">cppreference: string<\/a> — the full list of string tools. Use it like a dictionary.<\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1069\">CSES: Repetitions<\/a> — one loop over a string, comparing neighbours.<\/li>\n  <\/ul>\n<\/section>\n","stl-basics":"<p class=\"idea\">C++ gives you ready tools: sort, max, sum, pairs. Learn their names and never write them by hand again.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>You need the numbers in order, or the k biggest, or the k smallest.<\/li>\n    <li>You need the biggest, the smallest or the sum of an array.<\/li>\n    <li>Two values belong together, like a score and the person who has it.<\/li>\n    <li>You are about to write 10 lines for something very common. Stop. There is a tool for it.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — the toolbox<\/h3>\n    <p>A carpenter does not make a new hammer for every nail. He opens the toolbox and takes one.<\/p>\n    <p>The STL is the toolbox of C++. The tools are fast, correct and tested by millions of people. Your own sort will be slower and can have bugs.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — \"I want… → write…\"<\/h3>\n    <p>Here <code>a<\/code> is a <code>vector&lt;int&gt;<\/code>.<\/p>\n    <table>\n      <tr><th>I want…<\/th><th>write…<\/th><\/tr>\n      <tr><td>sort, small → big (<span class=\"term\" data-t=\"ascending\">ascending<\/span>)<\/td><td><code>sort(a.begin(), a.end());<\/code><\/td><\/tr>\n      <tr><td>sort, big → small (<span class=\"term\" data-t=\"descending\">descending<\/span>)<\/td><td><code>sort(a.rbegin(), a.rend());<\/code><br>or <code>sort(a.begin(), a.end(), greater&lt;int&gt;());<\/code><\/td><\/tr>\n      <tr><td>turn the array around<\/td><td><code>reverse(a.begin(), a.end());<\/code><\/td><\/tr>\n      <tr><td>smaller / bigger of two values<\/td><td><code>min(x, y)<\/code> / <code>max(x, y)<\/code><\/td><\/tr>\n      <tr><td>exchange two values<\/td><td><code>swap(x, y);<\/code><\/td><\/tr>\n      <tr><td>smallest / biggest in the array<\/td><td><code>*min_element(a.begin(), a.end())<\/code><br><code>*max_element(a.begin(), a.end())<\/code><\/td><\/tr>\n      <tr><td>sum of the array<\/td><td><code>accumulate(a.begin(), a.end(), 0LL)<\/code><\/td><\/tr>\n      <tr><td>how many times is <code>x<\/code> in the array?<\/td><td><code>count(a.begin(), a.end(), x)<\/code><\/td><\/tr>\n      <tr><td>add a value at the end<\/td><td><code>a.push_back(x);<\/code><\/td><\/tr>\n      <tr><td>look at the last value / remove it<\/td><td><code>a.back()<\/code> / <code>a.pop_back();<\/code><\/td><\/tr>\n      <tr><td>two values in one box<\/td><td><code>pair&lt;int,int&gt; p = {3, 7};<\/code><br><code>p.first<\/code> is 3, <code>p.second<\/code> is 7<\/td><\/tr>\n      <tr><td>an array of pairs<\/td><td><code>vector&lt;pair&lt;int,int&gt;&gt; v;<\/code>   <code>v.push_back({x, y});<\/code><\/td><\/tr>\n    <\/table>\n    <p class=\"note\">The <code>*<\/code> is needed: <code>max_element<\/code> gives the <b>place<\/b> of the biggest value, and <code>*<\/code> opens it. <code>0LL<\/code> makes the sum a <code>long long<\/code>; with plain <code>0<\/code> a big sum can <span class=\"term\" data-t=\"overflow\">overflow<\/span>.<\/p>\n    <p>A <span class=\"term\" data-t=\"pair\">pair<\/span> is sorted by <code>.first<\/code>. If two firsts are equal, the smaller <code>.second<\/code> comes first.<\/p>\n    <table>\n      <tr><th>before sort<\/th><td>{5, 1}<\/td><td>{2, 2}<\/td><td>{5, 0}<\/td><td>{1, 3}<\/td><\/tr>\n      <tr><th>after sort<\/th><td>{1, 3}<\/td><td>{2, 2}<\/td><td class=\"hi\">{5, 0}<\/td><td class=\"hi\">{5, 1}<\/td><\/tr>\n    <\/table>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — the tools in one program<\/h3>\n    <p>Read n scores. Print the smallest, the biggest and the sum. Then print the people from the best score to the worst.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n;\n    cin &gt;&gt; n;\n    vector&lt;int&gt; a(n);\n    for (int i = 0; i &lt; n; i++) cin &gt;&gt; a[i];\n\n    int smallest = *min_element(a.begin(), a.end());\n    int biggest  = *max_element(a.begin(), a.end());\n    long long sum = accumulate(a.begin(), a.end(), 0LL);\n    cout &lt;&lt; smallest &lt;&lt; \" \" &lt;&lt; biggest &lt;&lt; \" \" &lt;&lt; sum &lt;&lt; \"\\n\";\n\n    vector&lt;pair&lt;int,int&gt;&gt; people;            // {score, number of the person}\n    for (int i = 0; i &lt; n; i++) people.push_back({a[i], i + 1});\n    sort(people.rbegin(), people.rend());    // biggest score first\n    for (int i = 0; i &lt; n; i++) cout &lt;&lt; people[i].second &lt;&lt; \" \";\n    cout &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p class=\"note\">Input <code>4<\/code> / <code>30 10 50 20<\/code> prints <code>10 50 110<\/code> and then <code>3 1 4 2<\/code>. Sorting moves the scores, but each pair still remembers its person.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: sort is O(n log n), fine for n = 10^6. The other tools in the table are O(n) or O(1).<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li><code>a.size()<\/code> is <span class=\"term\" data-t=\"unsigned\">unsigned<\/span>: it cannot be negative. For an empty array <code>a.size() - 1<\/code> is a huge number, not −1. Write <code>(int)a.size() - 1<\/code>.<\/li>\n    <li><code>accumulate(…, 0)<\/code> adds in <code>int<\/code>. Write <code>0LL<\/code>.<\/li>\n    <li>You forget the <code>*<\/code> before <code>max_element<\/code>. The code does not compile, with a long error.<\/li>\n    <li><code>a.back()<\/code>, <code>a.pop_back()<\/code> or <code>*max_element<\/code> on an empty array. The program crashes. Check <code>!a.empty()<\/code> first.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"228A\">Is your horseshoe on the other hoof?<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1360B\">Honest Coach<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1353B\">Two Arrays And Swaps<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"405A\">Gravity Flip<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"160A\">Twins<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"337A\">Puzzles<\/a><span class=\"r\">900<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://en.cppreference.com/w/cpp/algorithm\">cppreference: algorithms<\/a> — every tool like <code>sort<\/code> and <code>count<\/code>, with small examples.<\/li>\n    <li><a href=\"https://en.cppreference.com/w/cpp/container\">cppreference: containers<\/a> — <code>vector<\/code>, and later <code>map<\/code>, <code>set<\/code>, <code>queue<\/code>.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book. Chapter 3 is about sorting in C++.<\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1621\">CSES: Distinct Numbers<\/a> — sort, then compare neighbours.<\/li>\n  <\/ul>\n<\/section>\n","basic-math":"<p class=\"idea\">A few small formulas replace a long loop. Learn them once and many 800 problems become one line.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The numbers go up to 10<sup>9<\/sup> or 10<sup>18<\/sup>. A loop is too slow, so there must be a formula.<\/li>\n    <li>The statement talks about <span class=\"term\" data-t=\"even\">even<\/span> and <span class=\"term\" data-t=\"odd\">odd<\/span>, or <span class=\"term\" data-t=\"divisible\">divisible<\/span> numbers, or digits.<\/li>\n    <li>\"How many boxes / buses / steps do you need at least?\" This is division that rounds up.<\/li>\n    <li>\"Find the sum 1 + 2 + … + n\" or \"how many numbers from l to r are…\".<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — the buses<\/h3>\n    <p>10 people go on a trip. One bus takes 4 people. In C++, <code>10 / 4<\/code> is <b>2<\/b>: integer division throws away the rest (<span class=\"term\" data-t=\"round-down\">rounds down<\/span>). But 2 buses leave 2 people on the street.<\/p>\n    <p>You need to <span class=\"term\" data-t=\"round-up\">round up<\/span>: 3 buses. The trick is <code>(10 + 4 - 1) / 4<\/code> = 13 / 4 = <b>3<\/b>. In general: <code>(a + b - 1) / b<\/code>.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — take a number apart<\/h3>\n    <p><code>x % 10<\/code> is the last <span class=\"term\" data-t=\"digit\">digit<\/span>. <code>x / 10<\/code> removes the last digit. Repeat until nothing is left. Example: the sum of the digits of 4072.<\/p>\n    <table>\n      <tr><th>step<\/th><th>x<\/th><th>x % 10 (last digit)<\/th><th>sum<\/th><th>x / 10 (new x)<\/th><\/tr>\n      <tr><td>1<\/td><td>4072<\/td><td class=\"hi\">2<\/td><td>2<\/td><td>407<\/td><\/tr>\n      <tr><td>2<\/td><td>407<\/td><td class=\"hi\">7<\/td><td>9<\/td><td>40<\/td><\/tr>\n      <tr><td>3<\/td><td>40<\/td><td class=\"hi\">0<\/td><td>9<\/td><td>4<\/td><\/tr>\n      <tr><td>4<\/td><td>4<\/td><td class=\"hi\">4<\/td><td>13<\/td><td>0<\/td><\/tr>\n      <tr><td>end<\/td><td>0<\/td><td colspan=\"3\">x is 0 → stop. The sum is 13. The number has 4 digits.<\/td><\/tr>\n    <\/table>\n    <p>The formulas to remember:<\/p>\n    <table>\n      <tr><th>I want…<\/th><th>formula<\/th><th>example<\/th><\/tr>\n      <tr><td>is x even?<\/td><td><code>x % 2 == 0<\/code><\/td><td>8 % 2 = 0 → even<\/td><\/tr>\n      <tr><td>is a divisible by b?<\/td><td><code>a % b == 0<\/code><\/td><td>12 % 4 = 0 → yes<\/td><\/tr>\n      <tr><td>a / b rounded down<\/td><td><code>a / b<\/code><\/td><td>10 / 4 = 2<\/td><\/tr>\n      <tr><td>a / b rounded up<\/td><td><code>(a + b - 1) / b<\/code><\/td><td>(10 + 3) / 4 = 3<\/td><\/tr>\n      <tr><td>1 + 2 + … + n<\/td><td>n · (n + 1) / 2<\/td><td>1 + … + 100 = 5050<\/td><\/tr>\n      <tr><td>1 + 3 + 5 + … (the first n odd numbers)<\/td><td>n · n<\/td><td>1 + 3 + 5 + 7 = 16<\/td><\/tr>\n      <tr><td>a sum where each step adds the same value<\/td><td>(first + last) · count / 2<\/td><td>3 + 5 + 7 + 9 = 12 · 4 / 2 = 24<\/td><\/tr>\n      <tr><td>how many <span class=\"term\" data-t=\"multiple\">multiples<\/span> of k from 1 to n<\/td><td><code>n / k<\/code><\/td><td>multiples of 3 up to 10: 3<\/td><\/tr>\n      <tr><td>how many multiples of k from l to r<\/td><td><code>r / k - (l - 1) / k<\/code><\/td><td>multiples of 3 in 5..10: 3 − 1 = 2<\/td><\/tr>\n      <tr><td>distance between x and y<\/td><td><code>abs(x - y)<\/code><\/td><td>abs(3 − 8) = 5<\/td><\/tr>\n      <tr><td>fewest steps to walk d, a step is at most s<\/td><td><code>(d + s - 1) / s<\/code><\/td><td>d = 23, s = 4 → 6 steps<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">The third sum is called an <span class=\"term\" data-t=\"arithmetic-progression\">arithmetic progression<\/span>. <code>abs<\/code> is the <span class=\"term\" data-t=\"absolute-value\">absolute value<\/span>: the number without its minus sign.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — small helpers<\/h3>\n<pre data-part=\"global\"><code class=\"cpp\">\nlong long ceilDiv(long long a, long long b) {      // a / b rounded up (a &gt;= 0, b &gt; 0)\n    return (a + b - 1) / b;\n}\n\nlong long sumTo(long long n) {                     // 1 + 2 + ... + n\n    return n * (n + 1) / 2;\n}\n\nlong long multiples(long long l, long long r, long long k) {   // in [l..r], l &gt;= 1\n    return r / k - (l - 1) / k;\n}\n<\/code><\/pre>\n    <p>The digits loop from the picture, as a full program:<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    long long x;\n    cin &gt;&gt; x;                  // x &gt;= 1\n    int sum = 0, digits = 0;\n    while (x &gt; 0) {\n        sum += x % 10;         // take the last digit\n        digits++;\n        x /= 10;               // remove the last digit\n    }\n    cout &lt;&lt; sum &lt;&lt; \" \" &lt;&lt; digits &lt;&lt; \"\\n\";    // 4072 -&gt; 13 4\n}\n<\/code><\/pre>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: a formula is O(1). The digits loop is O(number of digits): at most 19 turns for a long long.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li><code>n * (n + 1) / 2<\/code> with <code>int n<\/code> can <span class=\"term\" data-t=\"overflow\">overflow<\/span>. Use <code>long long<\/code> for n near 10<sup>5<\/sup> and above.<\/li>\n    <li><code>%<\/code> with a negative number gives a negative <span class=\"term\" data-t=\"remainder\">remainder<\/span>: <code>-7 % 2<\/code> is <code>-1<\/code>. Test odd with <code>x % 2 != 0<\/code>, not <code>== 1<\/code>.<\/li>\n    <li>You use <code>double<\/code> and <code>ceil(a / b)<\/code>. With big numbers it loses digits. Stay with integers and <code>(a + b - 1) / b<\/code>.<\/li>\n    <li>The digits loop does nothing for x = 0. If 0 is a possible input, handle it alone.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"50A\">Domino piling<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"617A\">Elephant<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"546A\">Soldier and Bananas<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"977A\">Wrong Subtraction<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1328A\">Divisibility Problem<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1335A\">Candies and Two Sisters<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"486A\">Calculating Function<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"318A\">Even Odds<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1A\">Theatre Square<\/a><span class=\"r\">1000<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book. Chapter 1 has the sum formulas and more.<\/li>\n    <li><a href=\"https://codeforces.com/group/MWSDmqGsZm/contests\">Assiut newcomers sheets<\/a> — the \"Math\" sheet has many easy formula problems.<\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1618\">CSES: Trailing Zeros<\/a> — one small idea with division. Try it after the ladder.<\/li>\n  <\/ul>\n<\/section>\n","brute-force":"<p class=\"idea\">When the limits are small, do not look for a clever idea. Try every possibility and check each one.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The limits are small: n ≤ 100, n ≤ 1000, or the answer is at most a few thousand.<\/li>\n    <li>You can list every <span class=\"term\" data-t=\"possibility\">possibility<\/span>: every element, every <span class=\"term\" data-t=\"pair\">pair<\/span>, every value of the answer.<\/li>\n    <li>Checking one possibility is easy: one <code>if<\/code> or one short loop.<\/li>\n    <li>The number of possibilities × the cost of one check is below about 10<sup>8<\/sup>.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — the key ring<\/h3>\n    <p>You have 10 keys and one door. You do not know which key is right. You do not study the keys. You try key 1, key 2, key 3… until the door opens.<\/p>\n    <p>With 10 keys this is the fastest way. With a million keys it is not. So always count the keys first. This way of solving is called <span class=\"term\" data-t=\"brute-force\">brute force<\/span>.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — all pairs for n = 4<\/h3>\n    <p>Task: how many pairs of positions <code>i &lt; j<\/code> have <code>a[i] + a[j] = 7<\/code>? Here <code>a = [2, 5, 3, 4]<\/code>.<\/p>\n    <table>\n      <tr><th>i<\/th><th>j<\/th><th>a[i] + a[j]<\/th><th>= 7 ?<\/th><th>count<\/th><\/tr>\n      <tr><td>0<\/td><td>1<\/td><td>2 + 5 = 7<\/td><td class=\"hi\">yes<\/td><td>1<\/td><\/tr>\n      <tr><td>0<\/td><td>2<\/td><td>2 + 3 = 5<\/td><td>no<\/td><td>1<\/td><\/tr>\n      <tr><td>0<\/td><td>3<\/td><td>2 + 4 = 6<\/td><td>no<\/td><td>1<\/td><\/tr>\n      <tr><td>1<\/td><td>2<\/td><td>5 + 3 = 8<\/td><td>no<\/td><td>1<\/td><\/tr>\n      <tr><td>1<\/td><td>3<\/td><td>5 + 4 = 9<\/td><td>no<\/td><td>1<\/td><\/tr>\n      <tr><td>2<\/td><td>3<\/td><td>3 + 4 = 7<\/td><td class=\"hi\">yes<\/td><td>2<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">4 elements give 6 pairs. In general n elements give n × (n − 1) / 2 pairs. <code>j<\/code> starts at <code>i + 1<\/code>, so each pair is seen once and no element is paired with itself.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — the three shapes<\/h3>\n    <p><b>Shape 1: one loop.<\/b> Look at every element and count or keep the best. You know this from the earlier pages.<\/p>\n    <p><b>Shape 2: two loops over all pairs.<\/b> This is the table above.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n, target;\n    cin &gt;&gt; n &gt;&gt; target;\n    vector&lt;int&gt; a(n);\n    for (int &amp;x : a) cin &gt;&gt; x;\n\n    int count = 0;\n    for (int i = 0; i &lt; n; i++)\n        for (int j = i + 1; j &lt; n; j++)        // j &gt; i: each pair once\n            if (a[i] + a[j] == target) count++;\n    cout &lt;&lt; count &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p><b>Shape 3: try every answer.<\/b> Loop over each <span class=\"term\" data-t=\"candidate\">candidate<\/span> answer from small to big. Stop at the first one that works.<\/p>\n    <p>Example (problem 732A): one shovel costs <code>k<\/code>. You have many 10-coins and one coin of value <code>r<\/code>. Find the smallest number of shovels you can pay for with no change. The total must end in 0 or in <code>r<\/code>.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int k, r;\n    cin &gt;&gt; k &gt;&gt; r;\n    for (int cnt = 1; cnt &lt;= 10; cnt++) {      // 10 shovels always work: 10 * k ends in 0\n        int last = cnt * k % 10;               // last digit of the total price\n        if (last == 0 || last == r) {\n            cout &lt;&lt; cnt &lt;&lt; \"\\n\";               // the first cnt that works is the smallest\n            break;\n        }\n    }\n}\n<\/code><\/pre>\n    <p class=\"note\">Input <code>117 3<\/code> → output <code>9<\/code>, because 9 × 117 = 1053 ends in 3.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: (number of possibilities) × (cost of one check). One loop is O(n), all pairs are O(n^2). Keep it below about 10^8.<\/p>\n\n<p class=\"tip-box\">Brute force has a second job. When you write a faster solution, a slow brute force tells you if it is correct. See \"stress testing\" in <a href=\"#debugging\">How to find your bug<\/a>.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>You do not count the steps first. Two loops with n = 2·10<sup>5<\/sup> are 2·10<sup>10<\/sup> steps: Time limit exceeded.<\/li>\n    <li>The inner loop starts at <code>j = 0<\/code>. Then you count each pair twice, and also pair an element with itself.<\/li>\n    <li>The loop over answers stops too early. Be sure of the biggest answer that can happen, or make the limit bigger.<\/li>\n    <li>You look for a formula for 30 minutes when n ≤ 100. Small limits are a gift: use them.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"791A\">Bear and Big Brother<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"677A\">Vanya and Fence<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"732A\">Buy a Shovel<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1030A\">In Search of an Easy Problem<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"200B\">Drinks<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1154A\">Restoring Three Numbers<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1343A\">Candies<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"122A\">Lucky Division<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"479A\">Expression<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"69A\">Young Physicist<\/a><span class=\"r\">1000<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/bronze/intro-complete\">USACO Guide: Complete Search<\/a> — the same idea with more solved examples.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book, chapter 5 \"Complete search\". Read it again after the recursion page.<\/li>\n    <li><a href=\"https://codeforces.com/group/MWSDmqGsZm/contests\">Assiut newcomers sheets<\/a> — many very easy problems on loops. Good practice for \"try everything\".<\/li>\n  <\/ul>\n<\/section>\n","greedy":"<p class=\"idea\">At every step take the choice that looks best right now, and never go back. Very often this means: sort, then take.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The statement asks for the <span class=\"term\" data-t=\"minimum\">minimum<\/span> or <span class=\"term\" data-t=\"maximum\">maximum<\/span> number of something: coins, moves, items.<\/li>\n    <li>You build the answer step by step, and one <span class=\"term\" data-t=\"choice\">choice<\/span> is clearly the best: the biggest, the smallest, the earliest.<\/li>\n    <li>n is big (up to 2·10<sup>5<\/sup>), so you cannot try all possibilities. A sort and one loop must be enough.<\/li>\n    <li>Taking the best item now does not block a better answer later.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — one hour of homework<\/h3>\n    <p>You have one hour and many tasks. Each task needs some minutes. You want to finish as <b>many<\/b> tasks as you can.<\/p>\n    <p>Do the shortest task first, then the next shortest, and so on. A short task never hurts: it leaves the most time for the others. This is a <span class=\"term\" data-t=\"greedy\">greedy<\/span> rule: \"smallest first\".<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — pay 125 with the fewest bills<\/h3>\n    <p>Problem 996A: the bills are 100, 20, 10, 5 and 1. Take the biggest bill as many times as you can, then the next one.<\/p>\n    <table>\n      <tr><th>bill<\/th><th>left before<\/th><th>how many we take<\/th><th>left after<\/th><th>bills so far<\/th><\/tr>\n      <tr><td>100<\/td><td>125<\/td><td>125 / 100 = 1<\/td><td>25<\/td><td>1<\/td><\/tr>\n      <tr><td>20<\/td><td>25<\/td><td>25 / 20 = 1<\/td><td>5<\/td><td>2<\/td><\/tr>\n      <tr><td>10<\/td><td>5<\/td><td>5 / 10 = 0<\/td><td>5<\/td><td>2<\/td><\/tr>\n      <tr><td>5<\/td><td>5<\/td><td>5 / 5 = 1<\/td><td>0<\/td><td class=\"hi\">3<\/td><\/tr>\n      <tr><td>1<\/td><td>0<\/td><td>0<\/td><td>0<\/td><td>3<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">Answer: 3 bills (100 + 20 + 5). \"Left after\" is just <code>left % bill<\/code>.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — biggest first<\/h3>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n;\n    cin &gt;&gt; n;\n    int bills[5] = {100, 20, 10, 5, 1};    // from big to small\n    int count = 0;\n    for (int b : bills) {\n        count += n / b;                    // take this bill as many times as we can\n        n %= b;                            // what is still left to pay\n    }\n    cout &lt;&lt; count &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p><b>Sort, then take.<\/b> Problem 160A: take the fewest coins so that your sum is <b>strictly more<\/b> than the sum of the coins you leave. Big coins help the most, so sort in <span class=\"term\" data-t=\"descending\">descending<\/span> order and take from the front.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n;\n    cin &gt;&gt; n;\n    vector&lt;int&gt; a(n);\n    int total = 0;\n    for (int &amp;x : a) { cin &gt;&gt; x; total += x; }\n\n    sort(a.begin(), a.end(), greater&lt;int&gt;());   // biggest coin first\n    int mine = 0, taken = 0;\n    for (int x : a) {\n        if (mine &gt; total - mine) break;         // I already have more than the rest\n        mine += x;                              // take the biggest coin that is left\n        taken++;\n    }\n    cout &lt;&lt; taken &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p class=\"note\">Input <code>3<\/code> / <code>2 1 2<\/code> → output <code>2<\/code>: you take 2 + 2 = 4, and 1 is left.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: O(n log n) for the sort, then O(n) for one loop. Fast enough for n = 2·10^5.<\/p>\n\n<section>\n  <h2>Warning: greedy can be wrong<\/h2>\n  <p>Coins are 1, 3 and 4. Pay 6 with the fewest coins.<\/p>\n  <table>\n    <tr><th>Way<\/th><th>Coins<\/th><th>How many<\/th><\/tr>\n    <tr><td>Greedy (biggest first)<\/td><td>4 + 1 + 1<\/td><td>3<\/td><\/tr>\n    <tr><td>Best<\/td><td>3 + 3<\/td><td class=\"hi\">2<\/td><\/tr>\n  <\/table>\n  <p>With bills 100, 20, 10, 5, 1 greedy is right. With coins 1, 3, 4 it is wrong. The code is the same, so you must check the idea before you trust it.<\/p>\n  <h3>How to trust a greedy<\/h3>\n  <ul>\n    <li><b>Try small cases by hand.<\/b> Does your rule give the best answer for every one of them?<\/li>\n    <li><b>Try to break it.<\/b> Look for a <span class=\"term\" data-t=\"counterexample\">counterexample<\/span>, like \"1, 3, 4 and 6\" above. One is enough to kill the idea.<\/li>\n    <li><b>The <span class=\"term\" data-t=\"swap\">swap<\/span> idea:<\/b> take any answer and swap two neighbour choices into your order. If this never makes the answer worse, your order is the best.<\/li>\n    <li><b>Limits help.<\/b> If n ≤ 20, the problem may want brute force. If n = 2·10<sup>5<\/sup> and a simple rule passes your small tests, greedy is likely.<\/li>\n  <\/ul>\n  <p class=\"tip-box\">Not sure? Write a <a href=\"#brute-force\">brute force<\/a> and compare it with your greedy on small random inputs. See \"stress testing\" in <a href=\"#debugging\">How to find your bug<\/a>.<\/p>\n<\/section>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>You trust the first rule you think of and do not test it on small cases.<\/li>\n    <li>You forget to sort, or you sort in the wrong direction (small first when you need big first).<\/li>\n    <li><b>More<\/b> or <b>at least<\/b>? In 160A the sum must be strictly more. <code>&gt;<\/code> and <code>&gt;=<\/code> give different answers.<\/li>\n    <li>The sum of many numbers is in an <code>int<\/code>. Use <code>long long<\/code> when it can pass 2·10<sup>9<\/sup>.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"996A\">Hit the Lottery<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1399A\">Remove Smallest<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1353B\">Two Arrays And Swaps<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"160A\">Twins<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"149A\">Business trip<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"580A\">Kefa and First Steps<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"230A\">Dragons<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"158B\">Taxi<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"492B\">Vanya and Lanterns<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"545D\">Queue<\/a><span class=\"r\">1300<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/bronze/intro-greedy\">USACO Guide: Introduction to Greedy<\/a> — short text, with examples where greedy fails.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book, chapter 6 \"Greedy algorithms\": coins, scheduling, tasks and deadlines.<\/li>\n    <li><a href=\"https://www.youtube.com/@ArabicCompetitiveProgramming\">Arabic videos<\/a> — lessons by Mostafa Saad. Search the channel for \"Greedy\".<\/li>\n    <li><a href=\"https://cses.fi/problemset/\">CSES Problem Set<\/a> — the section \"Sorting and Searching\" has many \"sort, then take\" problems.<\/li>\n  <\/ul>\n<\/section>\n","stl-containers":"<p class=\"idea\">C++ has ready boxes for your data. Pick the right box and a hard problem becomes a few lines.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>\"Did I see this value before?\" or \"how many <span class=\"term\" data-t=\"distinct\">distinct<\/span> values?\" → <code>set<\/code>.<\/li>\n    <li>\"How many times does each name / number appear?\" and the values are big or are strings → <code>map<\/code>.<\/li>\n    <li>You add values and often need the smallest or biggest one → <code>priority_queue<\/code> or <code>multiset<\/code>.<\/li>\n    <li>Brackets, \"undo\", or \"the last thing that is still open\" → <code>stack<\/code>.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — four things from real life<\/h3>\n    <p>A <span class=\"term\" data-t=\"stack\">stack<\/span> is a pile of plates. You put a plate on top. You take a plate from the top. Last in, first out.<\/p>\n    <p>A <span class=\"term\" data-t=\"queue\">queue<\/span> is a line in a shop. New people stand at the back. The person at the front leaves first. First in, first out.<\/p>\n    <p>A <code>set<\/code> is a guest list. Each name is there one time only, and the list stays in order. A <code>map<\/code> is a phone book. You give a name (the <span class=\"term\" data-t=\"key\">key<\/span>) and you get a number (the value).<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — which box do I need?<\/h3>\n    <table>\n      <tr><th>I need…<\/th><th>use…<\/th><th>main operations<\/th><th>cost of one<\/th><\/tr>\n      <tr><td>unique values, always sorted<\/td><td><code>set&lt;int&gt;<\/code><\/td><td><code>insert(x)<\/code>, <code>count(x)<\/code>, <code>erase(x)<\/code>, <code>*s.begin()<\/code>, <code>s.lower_bound(x)<\/code><\/td><td>O(log n)<\/td><\/tr>\n      <tr><td>sorted values, <span class=\"term\" data-t=\"duplicate\">duplicates<\/span> allowed<\/td><td><code>multiset&lt;int&gt;<\/code><\/td><td>same as set; erase <b>one<\/b> copy: <code>s.erase(s.find(x))<\/code><\/td><td>O(log n)<\/td><\/tr>\n      <tr><td>key → value (a counter, a phone book)<\/td><td><code>map&lt;string,int&gt;<\/code><\/td><td><code>m[x]++<\/code>, <code>m.count(x)<\/code>, loop in key order<\/td><td>O(log n)<\/td><\/tr>\n      <tr><td>last in, first out<\/td><td><code>stack&lt;int&gt;<\/code><\/td><td><code>push(x)<\/code>, <code>top()<\/code>, <code>pop()<\/code><\/td><td>O(1)<\/td><\/tr>\n      <tr><td>first in, first out<\/td><td><code>queue&lt;int&gt;<\/code><\/td><td><code>push(x)<\/code>, <code>front()<\/code>, <code>pop()<\/code><\/td><td>O(1)<\/td><\/tr>\n      <tr><td>add and remove at both ends<\/td><td><code>deque&lt;int&gt;<\/code><\/td><td><code>push_back<\/code>, <code>push_front<\/code>, <code>pop_back<\/code>, <code>pop_front<\/code>, <code>d[i]<\/code><\/td><td>O(1)<\/td><\/tr>\n      <tr><td>always get the biggest value<\/td><td><code>priority_queue&lt;int&gt;<\/code><\/td><td><code>push(x)<\/code>, <code>top()<\/code> = max, <code>pop()<\/code><\/td><td>O(log n)<\/td><\/tr>\n    <\/table>\n    <p class=\"note\"><code>unordered_map<\/code> looks faster, but on Codeforces special tests can make it very slow (people hack it). Prefer <code>map<\/code>.<\/p>\n    <p>How a stack checks brackets in <code>([]{})<\/code>. An opening bracket goes on the stack. A closing bracket must match the top.<\/p>\n    <table>\n      <tr><th>read<\/th><td>(<\/td><td>[<\/td><td>]<\/td><td>{<\/td><td>}<\/td><td>)<\/td><td>end<\/td><\/tr>\n      <tr><th>action<\/th><td>push<\/td><td>push<\/td><td>top is [ → pop<\/td><td>push<\/td><td>top is { → pop<\/td><td>top is ( → pop<\/td><td><\/td><\/tr>\n      <tr><th>stack after<\/th><td>(<\/td><td>( [<\/td><td>(<\/td><td>( {<\/td><td>(<\/td><td>empty<\/td><td class=\"hi\">empty → YES<\/td><\/tr>\n    <\/table>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — brackets with a stack, then short examples<\/h3>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    string s;\n    cin &gt;&gt; s;                              // for example ([]{})\n    stack&lt;char&gt; st;\n    bool good = true;\n    for (char c : s) {\n        if (c == '(' || c == '[' || c == '{') {\n            st.push(c);                    // opening bracket: remember it\n        } else {\n            if (st.empty()) { good = false; break; }   // nothing to close\n            char open = st.top();\n            st.pop();\n            if (c == ')' &amp;&amp; open != '(') good = false;\n            if (c == ']' &amp;&amp; open != '[') good = false;\n            if (c == '}' &amp;&amp; open != '{') good = false;\n        }\n    }\n    if (!st.empty()) good = false;         // some bracket was never closed\n    cout &lt;&lt; (good ? \"YES\" : \"NO\") &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p><code>set<\/code>: unique and sorted.<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nset&lt;int&gt; s;\ns.insert(5); s.insert(2); s.insert(5);     // s = {2, 5}, the second 5 is ignored\nif (s.count(5)) cout &lt;&lt; \"5 is inside\\n\";\ncout &lt;&lt; s.size() &lt;&lt; \"\\n\";                  // 2 = number of distinct values\ncout &lt;&lt; *s.begin() &lt;&lt; \"\\n\";                // 2 = the smallest value\nauto it = s.lower_bound(3);                // first value &gt;= 3\nif (it != s.end()) cout &lt;&lt; *it &lt;&lt; \"\\n\";    // 5\n<\/code><\/pre>\n    <p><code>map<\/code>: count words, then print them in order.<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nmap&lt;string, int&gt; cnt;\nstring w;\nwhile (cin &gt;&gt; w) cnt[w]++;                 // a new key starts at 0\nfor (auto [word, times] : cnt)             // keys come in sorted order\n    cout &lt;&lt; word &lt;&lt; \" \" &lt;&lt; times &lt;&lt; \"\\n\";\n<\/code><\/pre>\n    <p><code>priority_queue<\/code>: the biggest on top, or the smallest on top.<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\npriority_queue&lt;int&gt; big;                               // max on top\npriority_queue&lt;int, vector&lt;int&gt;, greater&lt;int&gt;&gt; small;  // min on top\nfor (int x : {4, 9, 1}) { big.push(x); small.push(x); }\ncout &lt;&lt; big.top() &lt;&lt; \" \" &lt;&lt; small.top() &lt;&lt; \"\\n\";       // 9 1\nbig.pop();                                             // removes the 9\n<\/code><\/pre>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: set, map, multiset, priority_queue: O(log n) per operation. stack, queue, deque: O(1). So n operations cost O(n log n) or O(n).<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li><code>m[x]<\/code> <b>creates<\/b> the key <code>x<\/code> with value 0 if it is missing. To only check, use <code>m.count(x)<\/code>.<\/li>\n    <li>In a <code>multiset<\/code>, <code>s.erase(x)<\/code> removes <b>all<\/b> copies of <code>x<\/code>. For one copy write <code>s.erase(s.find(x))<\/code>.<\/li>\n    <li><code>top()<\/code>, <code>front()<\/code> or <code>pop()<\/code> on an empty container crashes. Check <code>!st.empty()<\/code> first.<\/li>\n    <li><code>lower_bound(s.begin(), s.end(), x)<\/code> on a set is slow, O(n). Use the member: <code>s.lower_bound(x)<\/code>.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"443A\">Anton and Letters<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"469A\">I Wanna Be the Guy<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1325B\">CopyCopyCopyCopyCopy<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1374C\">Move Brackets<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"4C\">Registration system<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"26B\">Regular Bracket Sequence<\/a><span class=\"r\">1400<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://en.cppreference.com/w/cpp/container\">cppreference: containers<\/a> — the full list of every container and its functions.<\/li>\n    <li><a href=\"https://usaco.guide/bronze/intro-sets\">USACO Guide: Sets and Maps<\/a> — short text with examples.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book, chapter 4 \"Data structures\".<\/li>\n  <\/ul>\n<\/section>\n","sorting":"<p class=\"idea\">Put the values in order first. In a sorted array, close values stand next to each other, and many problems become easy.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The order of the input does not matter: you choose a group, or pairs, or \"any k elements\".<\/li>\n    <li>The statement asks for the smallest difference, or for equal elements.<\/li>\n    <li>A <span class=\"term\" data-t=\"greedy\">greedy<\/span> idea: \"take the smallest first\" or \"take the biggest first\".<\/li>\n    <li>You want to use binary search or two pointers. Both need a <span class=\"term\" data-t=\"sorted\">sorted<\/span> array.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — students in a line<\/h3>\n    <p>Find the two students with the closest heights. If they stand in a random order, you must compare every student with every other student. That is slow.<\/p>\n    <p>Now ask them to stand in a line by height. The two closest students are now <span class=\"term\" data-t=\"adjacent\">adjacent<\/span>. You only look at neighbours.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — smallest difference between two elements<\/h3>\n    <table>\n      <tr><th>before<\/th><td>8<\/td><td>1<\/td><td>9<\/td><td>4<\/td><td>13<\/td><\/tr>\n      <tr><th>after sort<\/th><td>1<\/td><td>4<\/td><td class=\"hi\">8<\/td><td class=\"hi\">9<\/td><td>13<\/td><\/tr>\n    <\/table>\n    <table>\n      <tr><th>neighbours<\/th><td>1, 4<\/td><td>4, 8<\/td><td>8, 9<\/td><td>9, 13<\/td><\/tr>\n      <tr><th>difference<\/th><td>3<\/td><td>4<\/td><td class=\"hi\">1<\/td><td>4<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">Before sorting: 10 pairs to check. After sorting: only 4 neighbours. For n = 200 000 that is 2·10<sup>10<\/sup> pairs against 200 000 neighbours.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — sort, then one easy loop<\/h3>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n;\n    cin &gt;&gt; n;                               // n &gt;= 2\n    vector&lt;int&gt; a(n);\n    for (auto &amp;x : a) cin &gt;&gt; x;\n    sort(a.begin(), a.end());               // small -&gt; big\n    int best = a[1] - a[0];\n    for (int i = 1; i &lt; n; i++)             // look only at neighbours\n        best = min(best, a[i] - a[i - 1]);\n    cout &lt;&lt; best &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p>Other orders. A <code>pair<\/code> is sorted by <code>first<\/code>, then by <code>second<\/code>. Use it to remember the old position.<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nsort(a.begin(), a.end(), greater&lt;int&gt;());      // big -&gt; small\nvector&lt;pair&lt;int, int&gt;&gt; p(n);\nfor (int i = 0; i &lt; n; i++) p[i] = {a[i], i};  // (value, old index)\nsort(p.begin(), p.end());                      // by value; same value: by index\n// p[0].second = where the smallest value was in a\n<\/code><\/pre>\n    <p>Your own order: write a <span class=\"term\" data-t=\"comparator\">comparator<\/span>. It returns <code>true<\/code> when <code>x<\/code> must come <b>before<\/b> <code>y<\/code>.<\/p>\n<pre data-part=\"global\"><code class=\"cpp\">\nstruct Student { string name; int score; };\n\nbool before(const Student &amp;x, const Student &amp;y) {\n    if (x.score != y.score) return x.score &gt; y.score;  // bigger score first\n    return x.name &lt; y.name;                            // same score: by name\n}\n// in main:  sort(v.begin(), v.end(), before);\n<\/code><\/pre>\n    <p>The same thing as a short lambda, written inside <code>sort<\/code>:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\n// sort numbers by their last digit; same last digit: smaller number first\nsort(a.begin(), a.end(), [](int x, int y) {\n    if (x % 10 != y % 10) return x % 10 &lt; y % 10;\n    return x &lt; y;\n});\n<\/code><\/pre>\n    <p class=\"tip-box\">After sorting, equal values are neighbours. So \"are there two equal elements?\" is just: is <code>a[i] == a[i - 1]<\/code> for some <code>i<\/code>?<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: sort is O(n log n). For n = 200 000 that is about 4 million steps: very fast.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>A comparator with <code>&lt;=<\/code> or <code>&gt;=<\/code>. It must be strict: <code>&lt;<\/code> or <code>&gt;<\/code>. For two equal elements it must return <code>false<\/code>. If not, the program can crash.<\/li>\n    <li>Sorting loses the old positions. If the answer needs them, sort pairs <code>(value, index)<\/code>.<\/li>\n    <li>Sorting when the order matters. If the problem talks about a <span class=\"term\" data-t=\"subarray\">subarray<\/span> or \"the next element\", you usually cannot sort.<\/li>\n    <li>An array that starts from index 1: write <code>sort(a + 1, a + n + 1)<\/code>, not <code>sort(a, a + n)<\/code>.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"1360B\">Honest Coach<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"405A\">Gravity Flip<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"337A\">Puzzles<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"545D\">Queue<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"451B\">Sort the Array<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a href=\"https://cses.fi/problemset/\">CSES: Movie Festival<\/a><span class=\"r\">CSES<\/span> — find it in the \"Sorting and Searching\" list. Sort by end time.<\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/silver/sorting-custom\">USACO Guide: Custom Comparators<\/a> — more examples of your own sort order.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book, chapter 3 \"Sorting\".<\/li>\n    <li><a href=\"https://cses.fi/problemset/\">CSES Problem Set<\/a> — the section \"Sorting and Searching\" has many classic tasks.<\/li>\n  <\/ul>\n<\/section>\n","counting":"<p class=\"idea\">Count how many times each value appears. Then answer from the counts, not from the long array.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>\"How many times…\", \"the most common…\", \"appears exactly once\", \"all letters are used\".<\/li>\n    <li>Only the <span class=\"term\" data-t=\"frequency\">frequency<\/span> of each value matters, not its position.<\/li>\n    <li>\"Count the <span class=\"term\" data-t=\"pair\">pairs<\/span> (i, j) with i &lt; j and …\" and n is up to 200 000. You cannot try all pairs.<\/li>\n    <li>The values are small (letters, numbers up to 10<sup>6<\/sup>) → array. The values are big (up to 10<sup>9<\/sup>) → <code>map<\/code>.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — counting votes<\/h3>\n    <p>People vote for a class leader. You do not keep the papers in a long line. You make one row for each name on the board. For each paper you add one mark to its row.<\/p>\n    <p>At the end you read the board. Who has the most marks? Who has zero? The board answers fast.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — count the letters of \"banana\"<\/h3>\n    <p>One box for each letter. Letter <code>c<\/code> goes to box <code>c - 'a'<\/code>: 'a' → 0, 'b' → 1, … 'n' → 13.<\/p>\n    <table>\n      <tr><th>read<\/th><th>cnt['a']<\/th><th>cnt['b']<\/th><th>cnt['n']<\/th><\/tr>\n      <tr><td>start<\/td><td>0<\/td><td>0<\/td><td>0<\/td><\/tr>\n      <tr><td>b<\/td><td>0<\/td><td class=\"hi\">1<\/td><td>0<\/td><\/tr>\n      <tr><td>a<\/td><td class=\"hi\">1<\/td><td>1<\/td><td>0<\/td><\/tr>\n      <tr><td>n<\/td><td>1<\/td><td>1<\/td><td class=\"hi\">1<\/td><\/tr>\n      <tr><td>a<\/td><td class=\"hi\">2<\/td><td>1<\/td><td>1<\/td><\/tr>\n      <tr><td>n<\/td><td>2<\/td><td>1<\/td><td class=\"hi\">2<\/td><\/tr>\n      <tr><td>a<\/td><td class=\"hi\">3<\/td><td>1<\/td><td>2<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">Now it is easy: 3 distinct letters, the most common is 'a', and 'b' appears exactly once.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — small values: array, big values: map<\/h3>\n<pre data-part=\"main\"><code class=\"cpp\">\nstring s;\ncin &gt;&gt; s;\nint cnt[26] = {0};                     // one box for each letter a..z\nfor (char c : s) cnt[c - 'a']++;\nint kinds = 0;\nfor (int i = 0; i &lt; 26; i++)\n    if (cnt[i] &gt; 0) kinds++;           // number of distinct letters\n<\/code><\/pre>\n    <p><b>Counting pairs.<\/b> Task: how many pairs i &lt; j have <code>a[i] == a[j]<\/code>? Walk from left to right. For each element ask: \"how many <b>earlier<\/b> elements are equal to me?\" The map knows.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n;\n    cin &gt;&gt; n;\n    map&lt;int, int&gt; cnt;                 // cnt[x] = how many x we saw before\n    long long pairs = 0;               // can be about n*n/2 -&gt; long long\n    for (int j = 0; j &lt; n; j++) {\n        int x;\n        cin &gt;&gt; x;\n        pairs += cnt[x];               // every earlier x makes a pair with this one\n        cnt[x]++;                      // now this one is \"earlier\" too\n    }\n    cout &lt;&lt; pairs &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p>Another way to the same answer: <code>k<\/code> equal items make <code>k · (k − 1) / 2<\/code> pairs. Add this for every value.<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nlong long pairs = 0;\nfor (auto [value, k] : cnt)\n    pairs += 1LL * k * (k - 1) / 2;    // 1LL makes the product long long\n<\/code><\/pre>\n    <p class=\"tip-box\">Trick: move everything with <code>i<\/code> to one side. \"Count pairs with <code>a[j] − a[i] = j − i<\/code>\" is the same as <code>a[j] − j = a[i] − i<\/code>. So make <code>b[i] = a[i] − i<\/code> and count pairs of equal values in <code>b<\/code>.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: O(n) with an array, O(n log n) with a map. Both are fine for n = 200 000.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>The number of pairs in an <code>int<\/code>. With n = 200 000 it can be 2·10<sup>10<\/sup>. Use <code>long long<\/code>.<\/li>\n    <li>An array <code>cnt[x]<\/code> when x can be 10<sup>9<\/sup>. That is too much memory. Use a <code>map<\/code>.<\/li>\n    <li>Many <span class=\"term\" data-t=\"test-case\">test cases<\/span>: you forget to clear the counts, or you clear a huge array in every test (too slow). Clear only the part you used.<\/li>\n    <li>Writing <code>cnt[c]<\/code> for a letter when the array has 26 boxes. Write <code>cnt[c - 'a']<\/code>.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"236A\">Boy or Girl<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"520A\">Pangram<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1454B\">Unique Bid Auction<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1335C\">Two Teams Composing<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1520D\">Same Differences<\/a><span class=\"r\">1200<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"#stl-containers\">map, set, stack, queue<\/a> — the page about <code>map<\/code>, if it is new for you.<\/li>\n    <li><a href=\"https://usaco.guide/bronze/intro-sets\">USACO Guide: Sets and Maps<\/a> — counting with maps, with examples.<\/li>\n    <li><a href=\"https://codeforces.com/group/MWSDmqGsZm/contests\">Assiut newcomers sheets<\/a> — many easy counting problems on arrays and strings.<\/li>\n  <\/ul>\n<\/section>\n","prefix-sums":"<p class=\"idea\">Add the numbers once and save every running sum. After that, the sum of any part of the array is one subtraction.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>Many <span class=\"term\" data-t=\"query\">queries<\/span>: \"what is the sum from position l to position r?\"<\/li>\n    <li>\"How many good positions are there between l and r?\" Put 1 on good positions, 0 on others. Now it is a sum.<\/li>\n    <li>The array does not change between the queries.<\/li>\n    <li>n and the number of queries are both up to 200 000. A loop for every query is too slow.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — the bank balance<\/h3>\n    <p>Every day you get or spend some money. The bank writes your balance after each day. This is a <span class=\"term\" data-t=\"running-sum\">running sum<\/span>.<\/p>\n    <p>How much did you get from Monday to Friday? You do not add five days again. You take the balance after Friday minus the balance before Monday.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — pre[i] = sum of the first i elements<\/h3>\n    <p>The array <code>a<\/code> has indexes 0 … n−1. The array <code>pre<\/code> has one more box. <code>pre[0] = 0<\/code> because the sum of zero elements is 0.<\/p>\n    <table>\n      <tr><th>i<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr>\n      <tr><th>a[i]<\/th><td>3<\/td><td class=\"hi\">1<\/td><td class=\"hi\">4<\/td><td class=\"hi\">1<\/td><td>5<\/td><td>–<\/td><\/tr>\n      <tr><th>pre[i]<\/th><td>0<\/td><td class=\"hi\">3<\/td><td>4<\/td><td>8<\/td><td class=\"hi\">9<\/td><td>14<\/td><\/tr>\n    <\/table>\n    <p>Each box is the box before it plus one element: <code>pre[i + 1] = pre[i] + a[i]<\/code>.<\/p>\n    <p><b>One query:<\/b> the sum of <code>a[1..3]<\/code> = 1 + 4 + 1 = 6.<\/p>\n    <table>\n      <tr><th>what<\/th><th>value<\/th><th>meaning<\/th><\/tr>\n      <tr><td>pre[r + 1] = pre[4]<\/td><td>9<\/td><td>sum of a[0..3]<\/td><\/tr>\n      <tr><td>pre[l] = pre[1]<\/td><td>3<\/td><td>sum of a[0..0], the part we do not want<\/td><\/tr>\n      <tr><td>pre[4] − pre[1]<\/td><td class=\"hi\">6<\/td><td>sum of a[1..3]<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">The rule: sum of <code>a[l..r]<\/code> = <code>pre[r + 1] − pre[l]<\/code>. Take everything up to r, then remove everything before l.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — build once, answer each query in one step<\/h3>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n, q;\n    cin &gt;&gt; n &gt;&gt; q;\n    vector&lt;long long&gt; a(n), pre(n + 1, 0);       // sums get big -&gt; long long\n    for (int i = 0; i &lt; n; i++) {\n        cin &gt;&gt; a[i];\n        pre[i + 1] = pre[i] + a[i];              // sum of the first i + 1 elements\n    }\n    while (q--) {\n        int l, r;\n        cin &gt;&gt; l &gt;&gt; r;                           // the input counts from 1\n        l--; r--;                                // now they are indexes from 0\n        cout &lt;&lt; pre[r + 1] - pre[l] &lt;&lt; \"\\n\";     // sum of a[l..r]\n    }\n}\n<\/code><\/pre>\n    <p class=\"tip-box\">It also works for counting. \"How many <code>i<\/code> in [l, r] have <code>s[i] == s[i + 1]<\/code>?\" Make <code>a[i] = 1<\/code> when this is true, else 0. Then ask for a sum.<\/p>\n    <p class=\"note\"><b>A grid (2D).<\/b> <code>pre[i][j]<\/code> = sum of the first i rows and first j columns: <code>pre[i][j] = a[i−1][j−1] + pre[i−1][j] + pre[i][j−1] − pre[i−1][j−1]<\/code>. Sum of rows r1..r2 and columns c1..c2 = <code>pre[r2+1][c2+1] − pre[r1][c2+1] − pre[r2+1][c1] + pre[r1][c1]<\/code>.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2>Difference array<\/h2>\n  <p>This is the same idea, but backwards. Now the task says: \"add <code>v<\/code> to every element from l to r\", many times. At the end you print the array.<\/p>\n  <div class=\"way\">\n    <h3><b>Example<\/b> — 5 zeros, add 2 to [1, 3], then add 3 to [2, 4]<\/h3>\n    <p>Do not touch every element of the <span class=\"term\" data-t=\"range\">range<\/span>. Write only two marks in a <span class=\"term\" data-t=\"difference-array\">difference array<\/span> <code>d<\/code>: \"the change starts here\" (<code>d[l] += v<\/code>) and \"the change stops here\" (<code>d[r + 1] −= v<\/code>).<\/p>\n    <table>\n      <tr><th>i<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><\/tr>\n      <tr><th>d after \"add 2 to [1, 3]\"<\/th><td>0<\/td><td class=\"hi\">+2<\/td><td>0<\/td><td>0<\/td><td class=\"hi\">−2<\/td><td>0<\/td><\/tr>\n      <tr><th>d after \"add 3 to [2, 4]\"<\/th><td>0<\/td><td>+2<\/td><td class=\"hi\">+3<\/td><td>0<\/td><td>−2<\/td><td class=\"hi\">−3<\/td><\/tr>\n      <tr><th>running sum of d = the array<\/th><td>0<\/td><td>2<\/td><td>5<\/td><td>5<\/td><td>3<\/td><td>–<\/td><\/tr>\n    <\/table>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n, q;\n    cin &gt;&gt; n &gt;&gt; q;                               // the array starts with n zeros\n    vector&lt;long long&gt; d(n + 1, 0);               // one extra box for d[r + 1]\n    while (q--) {\n        int l, r;\n        long long v;\n        cin &gt;&gt; l &gt;&gt; r &gt;&gt; v;                      // indexes from 0, add v to a[l..r]\n        d[l] += v;                               // the change starts at l\n        d[r + 1] -= v;                           // the change stops after r\n    }\n    long long cur = 0;\n    for (int i = 0; i &lt; n; i++) {\n        cur += d[i];                             // running sum of d\n        cout &lt;&lt; cur &lt;&lt; \" \";                      // this is a[i]\n    }\n    cout &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: O(n) to build, then O(1) for each query. Difference array: O(1) for each change, O(n) once at the end.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>Off by one. Choose one rule and never mix: here <code>pre<\/code> has n + 1 boxes and the answer is <code>pre[r + 1] − pre[l]<\/code>.<\/li>\n    <li>The sums in an <code>int<\/code>. 200 000 numbers of 10<sup>9<\/sup> give 2·10<sup>14<\/sup>. Use <code>long long<\/code>.<\/li>\n    <li>The input counts positions from 1 and your array counts from 0. Subtract 1 from l and r first.<\/li>\n    <li>The array changes between queries. Then prefix sums are not enough. (You need a stronger tool, see <a href=\"#what-next\">After 1600<\/a>.)<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"1807D\">Odd Queries<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"313B\">Ilya and Queries<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"363B\">Fence<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"368B\">Sereja and Suffixes<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"433B\">Kuriyama Mirai's Stones<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"295A\">Greg and Array<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"816B\">Karen and Coffee<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"276C\">Little Girl and Maximum Sum<\/a><span class=\"r\">1500<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://cses.fi/problemset/task/1646\">CSES: Static Range Sum Queries<\/a> — exactly the first program on this page. Submit it there.<\/li>\n    <li><a href=\"https://usaco.guide/silver/prefix-sums\">USACO Guide: Prefix Sums<\/a> — clear text, with the 2D picture.<\/li>\n    <li><a href=\"https://www.youtube.com/@ArabicCompetitiveProgramming\">Arabic videos<\/a> — search the channel for \"prefix sum\" (lessons by Mostafa Saad).<\/li>\n  <\/ul>\n<\/section>\n","two-pointers":"<p class=\"idea\">Use two indexes that only move forward. Together they make at most 2n steps, so one pass replaces a slow double loop.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>\"Find the longest (or shortest) <span class=\"term\" data-t=\"subarray\">subarray<\/span> with …\": sum ≤ S, at most k <span class=\"term\" data-t=\"distinct\">distinct<\/span> values, max − min ≤ d.<\/li>\n    <li>The array is sorted (or you can sort it) and you look for a pair, for example with sum X.<\/li>\n    <li>You have two sorted lists and you walk through both at the same time.<\/li>\n    <li>n is up to 200 000, so trying every (l, r) is too slow.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — a window on the array<\/h3>\n    <p>Put a window on the array. You see only the elements from <code>l<\/code> to <code>r<\/code>. This is a <span class=\"term\" data-t=\"sliding-window\">sliding window<\/span>.<\/p>\n    <p>Move the right side one step: a new element comes in. If the window is now \"too much\", move the left side until it is fine again. The two sides never go back.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — longest subarray with sum ≤ 7<\/h3>\n    <table>\n      <tr><th>i<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><\/tr>\n      <tr><th>a[i]<\/th><td>4<\/td><td class=\"hi\">2<\/td><td class=\"hi\">1<\/td><td class=\"hi\">3<\/td><td class=\"hi\">1<\/td><td>1<\/td><td>5<\/td><\/tr>\n    <\/table>\n    <table>\n      <tr><th>r<\/th><th>a[r] comes in<\/th><th>sum<\/th><th>too big? move l<\/th><th>l<\/th><th>sum now<\/th><th>length r − l + 1<\/th><\/tr>\n      <tr><td>0<\/td><td>4<\/td><td>4<\/td><td>no<\/td><td>0<\/td><td>4<\/td><td>1<\/td><\/tr>\n      <tr><td>1<\/td><td>2<\/td><td>6<\/td><td>no<\/td><td>0<\/td><td>6<\/td><td>2<\/td><\/tr>\n      <tr><td>2<\/td><td>1<\/td><td>7<\/td><td>no<\/td><td>0<\/td><td>7<\/td><td>3<\/td><\/tr>\n      <tr><td>3<\/td><td>3<\/td><td>10<\/td><td>yes: remove 4<\/td><td>1<\/td><td>6<\/td><td>3<\/td><\/tr>\n      <tr><td>4<\/td><td>1<\/td><td>7<\/td><td>no<\/td><td>1<\/td><td>7<\/td><td class=\"hi\">4<\/td><\/tr>\n      <tr><td>5<\/td><td>1<\/td><td>8<\/td><td>yes: remove 2<\/td><td>2<\/td><td>6<\/td><td>4<\/td><\/tr>\n      <tr><td>6<\/td><td>5<\/td><td>11<\/td><td>yes: remove 1, then 3<\/td><td>4<\/td><td>7<\/td><td>3<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">Answer: 4 (the elements 2, 1, 3, 1). Look at the columns <code>r<\/code> and <code>l<\/code>: both only grow. That is why it is fast.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — the sliding window<\/h3>\n    <p>Task: n books, book i needs <code>a[i]<\/code> minutes. You have <code>t<\/code> minutes. You read books that stand next to each other. How many books can you read?<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n;\n    long long t;\n    cin &gt;&gt; n &gt;&gt; t;\n    vector&lt;long long&gt; a(n);\n    for (auto &amp;x : a) cin &gt;&gt; x;\n    long long sum = 0;                     // sum of the window a[l..r]\n    int best = 0, l = 0;\n    for (int r = 0; r &lt; n; r++) {\n        sum += a[r];                       // a[r] comes into the window\n        while (sum &gt; t) {                  // too much: make the window smaller\n            sum -= a[l];\n            l++;\n        }\n        best = max(best, r - l + 1);       // the window is fine now\n    }\n    cout &lt;&lt; best &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p><b>Second form: two ends.<\/b> In a <span class=\"term\" data-t=\"sorted\">sorted<\/span> array, find two elements with sum <code>x<\/code>. Start at both ends and walk inward.<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nint i = 0, j = n - 1;                      // a is sorted, small -&gt; big\nwhile (i &lt; j) {\n    if (a[i] + a[j] == x) break;           // found the pair\n    if (a[i] + a[j] &lt; x) i++;              // sum too small: take a bigger left\n    else j--;                              // sum too big: take a smaller right\n}\n// i &lt; j here means: a[i] + a[j] == x.  i == j means: no such pair.\n<\/code><\/pre>\n    <p><b>Third form: two lists.<\/b> To <span class=\"term\" data-t=\"merge\">merge<\/span> two sorted lists, keep one <span class=\"term\" data-t=\"pointer\">pointer<\/span> in each list. Take the smaller of the two front elements and move that pointer.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: O(n). The inner <code>while<\/code> looks slow, but <code>l<\/code> moves at most n times in total. (Plus O(n log n) if you sort first.)<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>Using it when a bigger window is not always \"worse\". With negative numbers the sum can go down again. The window idea then gives wrong answers.<\/li>\n    <li>Moving <code>l<\/code> back to 0 for every <code>r<\/code>. Then it is a double loop again, O(n<sup>2<\/sup>).<\/li>\n    <li>The two-ends form on an array that is not sorted.<\/li>\n    <li>You sort, but the task needs the old positions. Sort pairs (value, index), see <a href=\"#sorting\">Sorting<\/a>.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"1690D\">Black and White Stripe<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1669F\">Eating Candies
