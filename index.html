<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1133C\">Balanced Team<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1692E\">Binary Deque<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1538C\">Number of Pairs<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"279B\">Books<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"602B\">Approximating a Constant Range<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"701C\">They Are Everywhere<\/a><span class=\"r\">1500<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://codeforces.com/edu/course/2\">Codeforces EDU<\/a> — free course, open \"Two Pointers Method\". Video, text and many problems.<\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1640\">CSES: Sum of Two Values<\/a> — the two-ends form. Remember to keep the old positions.<\/li>\n    <li><a href=\"https://usaco.guide/silver/two-pointers\">USACO Guide: Two Pointers<\/a> — short text with solved examples.<\/li>\n  <\/ul>\n<\/section>\n","binary-search":"<p class=\"idea\">Cut the search area in half again and again. You find the answer in about 30 steps, even inside a billion numbers.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The array is <span class=\"term\" data-t=\"sorted\">sorted<\/span> and you must find a value or a position.<\/li>\n    <li>The statement asks for the <b>minimum<\/b> or <b>maximum<\/b> value that still works.<\/li>\n    <li>If a value <code>x<\/code> works, then every bigger value also works (or every smaller one). This is called <span class=\"term\" data-t=\"monotonic\">monotonic<\/span>.<\/li>\n    <li>The answer can be up to 10<sup>9<\/sup> or 10<sup>18<\/sup>, so you cannot try every value.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — the guessing game<\/h3>\n    <p>I think of a number from 1 to 100. After each guess I say \"too small\" or \"too big\".<\/p>\n    <p>A bad player says 1, 2, 3, 4… A good player says <b>50<\/b>. \"Too big.\" Now only 1–49 is left. Then <b>25<\/b>. Each guess throws away half of the numbers. 100 → 50 → 25 → 12 → 6 → 3 → 1. Only 7 guesses.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — find the first number ≥ 7<\/h3>\n    <p>Ask one yes/no question for every position: \"is <code>a[i] ≥ 7<\/code>?\" In a sorted array the answers look like <b>no no no yes yes yes<\/b>. We look for the <b>first yes<\/b>.<\/p>\n    <table>\n      <tr><th>i<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><\/tr>\n      <tr><th>a[i]<\/th><td>1<\/td><td>3<\/td><td>4<\/td><td>7<\/td><td>8<\/td><td>9<\/td><td>12<\/td><\/tr>\n      <tr><th>a[i] ≥ 7 ?<\/th><td>no<\/td><td>no<\/td><td>no<\/td><td class=\"hi\">yes<\/td><td>yes<\/td><td>yes<\/td><td>yes<\/td><\/tr>\n    <\/table>\n    <table>\n      <tr><th>step<\/th><th>lo (a \"no\")<\/th><th>hi (a \"yes\")<\/th><th>mid<\/th><th>a[mid] ≥ 7 ?<\/th><th>what we do<\/th><\/tr>\n      <tr><td>1<\/td><td>-1<\/td><td>7<\/td><td>3<\/td><td>yes<\/td><td>hi = 3<\/td><\/tr>\n      <tr><td>2<\/td><td>-1<\/td><td>3<\/td><td>1<\/td><td>no<\/td><td>lo = 1<\/td><\/tr>\n      <tr><td>3<\/td><td>1<\/td><td>3<\/td><td>2<\/td><td>no<\/td><td>lo = 2<\/td><\/tr>\n      <tr><td>end<\/td><td>2<\/td><td class=\"hi\">3<\/td><td colspan=\"3\">lo and hi are neighbours → answer is hi = 3<\/td><\/tr>\n    <\/table>\n    <p class=\"note\"><code>lo<\/code> always stands on a \"no\". <code>hi<\/code> always stands on a \"yes\". They walk toward each other until they touch.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — one template for everything<\/h3>\n    <p>Write a function <code>ok(x)<\/code> that answers the yes/no question. The loop never changes.<\/p>\n<pre data-part=\"global\"><code class=\"cpp\">\nbool ok(long long x);          // you write this: no no no YES YES YES\n\nlong long firstYes(long long lo, long long hi) {\n    // lo = a value where ok is false (or one step before the range)\n    // hi = a value where ok is true  (or one step after the range)\n    while (hi - lo &gt; 1) {\n        long long mid = lo + (hi - lo) / 2;   // the middle, safe from overflow\n        if (ok(mid)) hi = mid;                // mid is a yes -&gt; answer is mid or left of it\n        else         lo = mid;                // mid is a no  -&gt; answer is right of it\n    }\n    return hi;                                // the first yes\n}\n<\/code><\/pre>\n    <p>For a sorted <code>vector<\/code>, C++ already has it:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nint i = lower_bound(a.begin(), a.end(), x) - a.begin();  // first index with a[i] &gt;= x\nint j = upper_bound(a.begin(), a.end(), x) - a.begin();  // first index with a[i] &gt;  x\n// j - i = how many times x is in the array\n<\/code><\/pre>\n  <\/div>\n<\/section>\n\n<section>\n  <h2>Binary search on the answer<\/h2>\n  <p>This is the trick that solves many 1200–1600 problems. You do not search in an array. You search in the <b>answers<\/b>.<\/p>\n  <div class=\"way\">\n    <h3><b>Example<\/b> — n machines, machine i makes one item every t[i] seconds. What is the smallest time to make k items?<\/h3>\n    <p>Hard question: \"what is the best time?\" Easy question: \"is time <code>T<\/code> enough?\" Just count: in time T machine i makes <code>T / t[i]<\/code> items.<\/p>\n    <p>If T is enough, then T+1 is also enough → <b>no no no yes yes yes<\/b> → find the first yes.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint n; long long k;\nvector&lt;long long&gt; t;\n\nbool ok(long long T) {                 // can we make k items in T seconds?\n    long long made = 0;\n    for (int i = 0; i &lt; n; i++) {\n        made += T / t[i];\n        if (made &gt;= k) return true;    // stop early, so \"made\" never overflows\n    }\n    return false;\n}\n\nint main() {\n    cin &gt;&gt; n &gt;&gt; k;\n    t.resize(n);\n    for (auto &amp;x : t) cin &gt;&gt; x;\n    long long lo = 0;                                     // 0 seconds: not enough\n    long long hi = *min_element(t.begin(), t.end()) * k;  // fastest machine alone: enough\n    while (hi - lo &gt; 1) {\n        long long mid = lo + (hi - lo) / 2;\n        if (ok(mid)) hi = mid; else lo = mid;\n    }\n    cout &lt;&lt; hi &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n  <\/div>\n  <p class=\"tip-box\">Looking for the <b>last yes<\/b> (pattern yes yes yes no no no)? Keep <code>lo<\/code> on a yes and <code>hi<\/code> on a no, swap the two lines inside the <code>if<\/code>, and return <code>lo<\/code>.<\/p>\n<\/section>\n\n<p class=\"complexity\">Speed: O(log n) steps. For answers up to 10^18 that is about 60 steps. Total = 60 × (cost of ok).<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>The array is not sorted. Binary search on an unsorted array gives a wrong answer.<\/li>\n    <li><code>ok<\/code> is not monotonic. Check it: can a \"yes\" come before a \"no\"? Then this tool does not fit.<\/li>\n    <li><code>(lo + hi) / 2<\/code> can <span class=\"term\" data-t=\"overflow\">overflow<\/span>. Write <code>lo + (hi - lo) / 2<\/code> and use <code>long long<\/code>.<\/li>\n    <li>Wrong start: <code>lo<\/code> must really be a \"no\" and <code>hi<\/code> must really be a \"yes\". If you are not sure, make <code>hi<\/code> bigger.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"706B\">Interesting drink<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"474B\">Worms<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1352C\">K-th Not Divisible by n<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1201C\">Maximum Median<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1324D\">Pair of Topics<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"702C\">Cellular Network<\/a><span class=\"r\">1500<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://codeforces.com/edu/course/2\">Codeforces EDU<\/a> — free course, open \"Binary Search\". Video, text and many problems.<\/li>\n    <li><a href=\"https://usaco.guide/silver/binary-search\">USACO Guide: Binary Search<\/a> — clear text with pictures.<\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1620\">CSES: Factory Machines<\/a> — the machines example above. Submit your code there.<\/li>\n  <\/ul>\n<\/section>\n","number-theory":"<p class=\"idea\">Four small tools for whole numbers: GCD, a prime test, the list of divisors, and the sieve. All are short and you can learn them by heart.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The words <span class=\"term\" data-t=\"divisible\">divisible<\/span>, <span class=\"term\" data-t=\"divisor\">divisor<\/span>, <span class=\"term\" data-t=\"multiple\">multiple<\/span>, <span class=\"term\" data-t=\"prime\">prime<\/span>, \"common divisor\" are in the statement.<\/li>\n    <li>\"The biggest number that divides all of them\" → <span class=\"term\" data-t=\"gcd\">GCD<\/span>. \"The smallest number divisible by all of them\" → <span class=\"term\" data-t=\"lcm\">LCM<\/span>.<\/li>\n    <li>One number up to 10<sup>12<\/sup> or 10<sup>9<\/sup> → a loop up to its <span class=\"term\" data-t=\"square-root\">square root<\/span>.<\/li>\n    <li>Many numbers up to 10<sup>6<\/sup> or 10<sup>7<\/sup>, and you ask \"is it prime?\" for each → the <span class=\"term\" data-t=\"sieve\">sieve<\/span>.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — cutting a rectangle into squares (GCD)<\/h3>\n    <p>You have a paper of 30 × 18. You want to cut it into equal squares, as big as possible, with no paper left.<\/p>\n    <p>Cut one 18 × 18 square. A 18 × 12 piece is left. Cut one 12 × 12 square. A 12 × 6 piece is left. It is exactly two 6 × 6 squares. So the answer is 6 = gcd(30, 18).<\/p>\n    <table>\n      <tr><th>a<\/th><th>b<\/th><th>a % b<\/th><th>next step<\/th><\/tr>\n      <tr><td>30<\/td><td>18<\/td><td>12<\/td><td>gcd(18, 12)<\/td><\/tr>\n      <tr><td>18<\/td><td>12<\/td><td>6<\/td><td>gcd(12, 6)<\/td><\/tr>\n      <tr><td>12<\/td><td>6<\/td><td>0<\/td><td>gcd(6, 0)<\/td><\/tr>\n      <tr><td class=\"hi\">6<\/td><td>0<\/td><td colspan=\"2\">b is 0 → the answer is a = 6<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">This is Euclid's <span class=\"term\" data-t=\"algorithm\">algorithm<\/span>: replace (a, b) by (b, a % b) until b is 0. It needs very few steps, even for 10<sup>18<\/sup>.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — the sieve: cross out multiples, 2 to 30<\/h3>\n    <p>Write all numbers. Take the first number that is not crossed out: it is prime. Cross out its multiples. Repeat.<\/p>\n    <table>\n      <tr><td><\/td><td class=\"hi\">2<\/td><td class=\"hi\">3<\/td><td><s>4<\/s><\/td><td class=\"hi\">5<\/td><td><s>6<\/s><\/td><td class=\"hi\">7<\/td><td><s>8<\/s><\/td><td><s>9<\/s><\/td><td><s>10<\/s><\/td><\/tr>\n      <tr><td class=\"hi\">11<\/td><td><s>12<\/s><\/td><td class=\"hi\">13<\/td><td><s>14<\/s><\/td><td><s>15<\/s><\/td><td><s>16<\/s><\/td><td class=\"hi\">17<\/td><td><s>18<\/s><\/td><td class=\"hi\">19<\/td><td><s>20<\/s><\/td><\/tr>\n      <tr><td><s>21<\/s><\/td><td><s>22<\/s><\/td><td class=\"hi\">23<\/td><td><s>24<\/s><\/td><td><s>25<\/s><\/td><td><s>26<\/s><\/td><td><s>27<\/s><\/td><td><s>28<\/s><\/td><td class=\"hi\">29<\/td><td><s>30<\/s><\/td><\/tr>\n    <\/table>\n    <table>\n      <tr><th>prime p<\/th><th>start at p · p<\/th><th>new numbers crossed out<\/th><\/tr>\n      <tr><td>2<\/td><td>4<\/td><td>4, 6, 8, 10, … , 30 (all even numbers)<\/td><\/tr>\n      <tr><td>3<\/td><td>9<\/td><td>9, 15, 21, 27<\/td><\/tr>\n      <tr><td>5<\/td><td>25<\/td><td>25<\/td><\/tr>\n      <tr><td>7<\/td><td>49<\/td><td>49 &gt; 30 → stop. All numbers still open are prime.<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">Why start at p · p? The smaller multiples (2p, 3p, …) are already crossed out by smaller primes.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — the four tools<\/h3>\n    <p><b>GCD and LCM.<\/b> C++ has <code>gcd(a, b)<\/code> (C++17) and the older <code>__gcd(a, b)<\/code>. For LCM divide first, then multiply, so the number stays small.<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nlong long a = 30, b = 18;\nlong long g = gcd(a, b);               // 6\nlong long l = a / g * b;               // lcm = 90. Divide first, then multiply\n<\/code><\/pre>\n    <p><b>Prime test and divisors.<\/b> Divisors come in pairs: if <code>i<\/code> divides n, then <code>n / i<\/code> also divides n. One of the two is ≤ sqrt(n). So the loop stops at <code>i * i &lt;= n<\/code>.<\/p>\n<pre data-part=\"global\"><code class=\"cpp\">\nbool isPrime(long long n) {\n    if (n &lt; 2) return false;               // 0 and 1 are not prime\n    for (long long i = 2; i * i &lt;= n; i++)\n        if (n % i == 0) return false;      // found a divisor\n    return true;\n}\n\nvector&lt;long long&gt; divisors(long long n) {\n    vector&lt;long long&gt; small, big;\n    for (long long i = 1; i * i &lt;= n; i++) {\n        if (n % i == 0) {\n            small.push_back(i);                    // the small one of the pair\n            if (i != n / i) big.push_back(n / i);  // the big one (not twice for 6 * 6)\n        }\n    }\n    small.insert(small.end(), big.rbegin(), big.rend());   // all, small -&gt; big\n    return small;\n}\n\n// prime factorisation: 60 -&gt; 2 2 3 5\nvector&lt;long long&gt; factorise(long long n) {\n    vector&lt;long long&gt; primes;\n    for (long long i = 2; i * i &lt;= n; i++) {\n        while (n % i == 0) {               // take i out as many times as we can\n            primes.push_back(i);\n            n /= i;\n        }\n    }\n    if (n &gt; 1) primes.push_back(n);        // what is left is one big prime\n    return primes;\n}\n<\/code><\/pre>\n    <p><b>Sieve.<\/b> Use it when you need \"is x prime?\" for many x. This program prints all primes up to n.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n;\n    cin &gt;&gt; n;                                       // n up to about 10^7\n    vector&lt;bool&gt; isPrime(n + 1, true);\n    isPrime[0] = false;\n    if (n &gt;= 1) isPrime[1] = false;\n    for (long long p = 2; p * p &lt;= n; p++) {\n        if (!isPrime[p]) continue;                  // p is crossed out, skip it\n        for (long long x = p * p; x &lt;= n; x += p)\n            isPrime[x] = false;                     // cross out the multiples of p\n    }\n    for (int x = 2; x &lt;= n; x++)\n        if (isPrime[x]) cout &lt;&lt; x &lt;&lt; \" \";\n    cout &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: gcd O(log n). Prime test, divisors and factorisation O(sqrt n): fine for one n up to 10^12. Sieve: about O(n log log n), fine for n = 10^7.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li><code>i * i<\/code> with <code>int i<\/code> can <span class=\"term\" data-t=\"overflow\">overflow<\/span> when n is near 2·10<sup>9<\/sup> or bigger. Make <code>i<\/code> a <code>long long<\/code>.<\/li>\n    <li>Saying that 1 is prime. It is not. The smallest prime is 2.<\/li>\n    <li>LCM as <code>a * b / g<\/code>. The product can overflow. Write <code>a / g * b<\/code>.<\/li>\n    <li>A loop to sqrt(n) for each of 10<sup>5<\/sup> big numbers. That is too slow. Build one sieve first.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"26A\">Almost Prime<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1475A\">Odd Divisor<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1742D\">Coprime<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"230B\">T-primes<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1294C\">Product of Three Numbers<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1203C\">Common Divisors<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"271B\">Prime Matrix<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"762A\">k-th divisor<\/a><span class=\"r\">1400<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/gold/divisibility\">USACO Guide: Divisibility<\/a> — GCD, LCM, divisors and factorisation with examples.<\/li>\n    <li><a href=\"https://cp-algorithms.com/algebra/sieve-of-eratosthenes.html\">cp-algorithms: Sieve of Eratosthenes<\/a> — the sieve in more detail.<\/li>\n    <li><a href=\"https://www.youtube.com/@ArabicCompetitiveProgramming\">Arabic videos<\/a> — search the channel for \"number theory\" (lessons by Mostafa Saad).<\/li>\n  <\/ul>\n<\/section>\n","modular":"<p class=\"idea\">When the answer is too big for any type, keep only its remainder. Take the remainder after every step, and the numbers stay small.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>\"Print the answer <span class=\"term\" data-t=\"modulo\">modulo<\/span> 10<sup>9<\/sup> + 7\" (or 998244353).<\/li>\n    <li>You count the number of ways, and it grows very fast.<\/li>\n    <li>You need a<sup>b<\/sup> with a big b, like b = 10<sup>18<\/sup> → fast <span class=\"term\" data-t=\"power\">power<\/span>.<\/li>\n    <li>\"The last digit of …\" is the same thing: modulo 10.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — the clock<\/h3>\n    <p>It is 10 o'clock. What time is it after 5 hours? Not 15. The clock says 3, because (10 + 5) % 12 = 3. A clock keeps only the <span class=\"term\" data-t=\"remainder\">remainder<\/span>.<\/p>\n    <p>You can add hours one by one, or all together. The clock shows the same time. So you may take the remainder at any moment, and the final remainder does not change.<\/p>\n    <p class=\"note\">Why does the judge ask for it? The real answer can have thousands of digits. The remainder by 10<sup>9<\/sup> + 7 fits in an <code>int<\/code>, and it still shows that your method is right.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — the rules, then 3<sup>13<\/sup> in 4 steps<\/h3>\n    <table>\n      <tr><th>you want<\/th><th>write<\/th><th>why<\/th><\/tr>\n      <tr><td>a + b<\/td><td><code>(a + b) % m<\/code><\/td><td>safe when a and b are already below m<\/td><\/tr>\n      <tr><td>a · b<\/td><td><code>a * b % m<\/code> with <code>long long<\/code><\/td><td>the product is up to 10<sup>18<\/sup>, too big for <code>int<\/code><\/td><\/tr>\n      <tr><td>a − b<\/td><td><code>((a - b) % m + m) % m<\/code><\/td><td>in C++ the result of <code>%<\/code> can be negative<\/td><\/tr>\n      <tr><td>a / b<\/td><td class=\"hi\">not allowed<\/td><td>normal division gives a wrong answer<\/td><\/tr>\n    <\/table>\n    <p><b>Fast power.<\/b> 3<sup>13<\/sup> needs 12 multiplications if you go one by one. But 13 = 8 + 4 + 1 (13 is 1101 in <span class=\"term\" data-t=\"binary\">binary<\/span>), so 3<sup>13<\/sup> = 3<sup>8<\/sup> · 3<sup>4<\/sup> · 3<sup>1<\/sup>. And you get 3<sup>2<\/sup>, 3<sup>4<\/sup>, 3<sup>8<\/sup> by squaring again and again.<\/p>\n    <table>\n      <tr><th>step<\/th><th>b<\/th><th>b is odd?<\/th><th>result<\/th><th>a (then a = a · a)<\/th><\/tr>\n      <tr><td>start<\/td><td>13<\/td><td><\/td><td>1<\/td><td>3 = 3<sup>1<\/sup><\/td><\/tr>\n      <tr><td>1<\/td><td>13<\/td><td>yes → result · a<\/td><td>1 · 3 = 3<\/td><td>9 = 3<sup>2<\/sup><\/td><\/tr>\n      <tr><td>2<\/td><td>6<\/td><td>no<\/td><td>3<\/td><td>81 = 3<sup>4<\/sup><\/td><\/tr>\n      <tr><td>3<\/td><td>3<\/td><td>yes → result · a<\/td><td>3 · 81 = 243<\/td><td>6561 = 3<sup>8<\/sup><\/td><\/tr>\n      <tr><td>4<\/td><td>1<\/td><td>yes → result · a<\/td><td class=\"hi\">243 · 6561 = 1594323<\/td><td>–<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">After each step <code>b = b / 2<\/code>. When b is 0 we stop. For b = 10<sup>18<\/sup> that is only about 60 steps. In real code every multiplication is followed by <code>% m<\/code>.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — power(a, b, m)<\/h3>\n<pre data-part=\"global\"><code class=\"cpp\">\nlong long power(long long a, long long b, long long m) {   // a^b % m\n    long long result = 1 % m;              // 1 % m, so it is also right for m = 1\n    a %= m;                                // make a small first\n    while (b &gt; 0) {\n        if (b % 2 == 1)                    // this power of a is needed\n            result = result * a % m;\n        a = a * a % m;                     // a, a^2, a^4, a^8, ...\n        b /= 2;\n    }\n    return result;\n}\n<\/code><\/pre>\n    <p>A complete program: for each test print a<sup>b<\/sup> modulo 10<sup>9<\/sup> + 7.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nconst long long MOD = 1000000007;          // 10^9 + 7, a prime\n\nlong long power(long long a, long long b, long long m) {\n    long long result = 1 % m;\n    a %= m;\n    while (b &gt; 0) {\n        if (b % 2 == 1) result = result * a % m;\n        a = a * a % m;\n        b /= 2;\n    }\n    return result;\n}\n\nint main() {\n    int t;\n    cin &gt;&gt; t;\n    while (t--) {\n        long long a, b;\n        cin &gt;&gt; a &gt;&gt; b;\n        cout &lt;&lt; power(a, b, MOD) &lt;&lt; \"\\n\";\n    }\n}\n<\/code><\/pre>\n    <p class=\"tip-box\">Division: you cannot write <code>(a / b) % m<\/code>. You multiply by the <span class=\"term\" data-t=\"modular-inverse\">modular inverse<\/span> of b. For a prime m it is <code>power(b, m - 2, m)<\/code>. See <a href=\"#combinatorics\">Counting with nCr<\/a>.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: +, −, × with mod are O(1). Fast power is O(log b): about 60 steps for b = 10^18.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>Taking the mod only at the end. The number <span class=\"term\" data-t=\"overflow\">overflows<\/span> long before. Take it after <b>every<\/b> + and ×.<\/li>\n    <li>Multiplying two <code>int<\/code> values: <code>a * b % m<\/code> overflows before the <code>%<\/code>. Use <code>long long<\/code>, or write <code>1LL * a * b % m<\/code>.<\/li>\n    <li>A negative result after subtraction. Write <code>((a - b) % m + m) % m<\/code>.<\/li>\n    <li>Comparing numbers after the mod. A bigger real number can have a smaller remainder. Never take min or max of remainders.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"1328A\">Divisibility Problem<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"913A\">Modular Exponentiation<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"742A\">Arpa’s hard exam and Mehrdad’s naive cheat<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1594B\">Special Numbers<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1514B\">AND 0, Sum Big<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1178C\">Tiles<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1513B\">AND Sequences<\/a><span class=\"r\">1400<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://cses.fi/problemset/task/1095\">CSES: Exponentiation<\/a> — exactly the program on this page. Submit it there.<\/li>\n    <li><a href=\"https://cp-algorithms.com/algebra/binary-exp.html\">cp-algorithms: Binary Exponentiation<\/a> — fast power in more detail.<\/li>\n    <li><a href=\"https://usaco.guide/gold/modular\">USACO Guide: Modular Arithmetic<\/a> — the rules again, and the modular inverse.<\/li>\n  <\/ul>\n<\/section>\n","bits":"<p class=\"idea\">Inside the computer every number is a row of 0s and 1s. You can read and change each of them with very fast operators.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The statement uses AND, OR, <span class=\"term\" data-t=\"xor\">XOR<\/span> (written <code>&amp;<\/code>, <code>|<\/code>, <code>^<\/code> or ⊕).<\/li>\n    <li>Powers of two: 1, 2, 4, 8, … or \"double it\", \"divide by 2\".<\/li>\n    <li>n ≤ 20 and you must choose some of the items → try every <span class=\"term\" data-t=\"subset\">subset<\/span> with a <span class=\"term\" data-t=\"mask\">mask<\/span>.<\/li>\n    <li>\"Every value appears twice, but one appears once\" → XOR of everything.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — a row of light switches<\/h3>\n    <p>Think of a row of switches. Each one is on (1) or off (0). The first switch from the right is worth 1, the next 2, then 4, then 8. The number is the sum of the switches that are on.<\/p>\n    <p>The operators AND, OR and XOR look at each switch position alone. Nothing is carried to the next position, so they are simple and fast.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — 13 in <span class=\"term\" data-t=\"binary\">binary<\/span>, and the operators<\/h3>\n    <table>\n      <tr><th>bit number k<\/th><td>3<\/td><td>2<\/td><td>1<\/td><td>0<\/td><\/tr>\n      <tr><th>worth 2<sup>k<\/sup><\/th><td>8<\/td><td>4<\/td><td>2<\/td><td>1<\/td><\/tr>\n      <tr><th>13<\/th><td class=\"hi\">1<\/td><td class=\"hi\">1<\/td><td>0<\/td><td class=\"hi\">1<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">13 = 8 + 4 + 1, so 13 is 1101. Each digit is one <span class=\"term\" data-t=\"bit\">bit<\/span>. Bits are counted from the right, from 0.<\/p>\n    <table>\n      <tr><th>operator<\/th><th>rule for one bit<\/th><th>a = 12 = 1100, b = 10 = 1010<\/th><\/tr>\n      <tr><td><code>a &amp; b<\/code> (AND)<\/td><td>1 if <b>both<\/b> are 1<\/td><td>1000 = 8<\/td><\/tr>\n      <tr><td><code>a | b<\/code> (OR)<\/td><td>1 if <b>at least one<\/b> is 1<\/td><td>1110 = 14<\/td><\/tr>\n      <tr><td><code>a ^ b<\/code> (XOR)<\/td><td>1 if they are <b>different<\/b><\/td><td>0110 = 6<\/td><\/tr>\n      <tr><td><code>~a<\/code> (NOT)<\/td><td>flips every bit<\/td><td>all 32 bits flip, so <code>~12<\/code> is −13<\/td><\/tr>\n      <tr><td><code>a &lt;&lt; 1<\/code><\/td><td>move all bits left = multiply by 2<\/td><td>11000 = 24<\/td><\/tr>\n      <tr><td><code>a &gt;&gt; 1<\/code><\/td><td>move all bits right = divide by 2<\/td><td>110 = 6<\/td><\/tr>\n    <\/table>\n    <p class=\"tip-box\">XOR facts: <code>a ^ a = 0<\/code>, <code>a ^ 0 = a<\/code>, and the order does not matter. So if you XOR a list, equal values cancel in pairs.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — the tricks, then all subsets<\/h3>\n<pre data-part=\"main\"><code class=\"cpp\">\nint x = 13;                                // 1101\nbool on = (x &gt;&gt; 2) &amp; 1;                    // is bit 2 on?        -&gt; true\nint a = x | (1 &lt;&lt; 1);                      // set bit 1           -&gt; 1111 = 15\nint b = x &amp; ~(1 &lt;&lt; 0);                     // clear bit 0         -&gt; 1100 = 12\nint c = x ^ (1 &lt;&lt; 3);                      // flip bit 3          -&gt; 0101 = 5\nint ones = __builtin_popcount(x);          // how many 1 bits     -&gt; 3\nbool pow2 = x &gt; 0 &amp;&amp; (x &amp; (x - 1)) == 0;   // is x a power of two? -&gt; false\nlong long big = 1LL &lt;&lt; 40;                 // for k &gt;= 31 you need 1LL\n<\/code><\/pre>\n    <p class=\"note\">For a <code>long long<\/code> use <code>__builtin_popcountll(x)<\/code>.<\/p>\n    <p><b>A subset as a mask.<\/b> You have n items. A number from 0 to 2<sup>n<\/sup> − 1 is one choice: bit <code>i<\/code> is 1 → item <code>i<\/code> is taken. Example with n = 3: mask 5 = 101 means \"take items 0 and 2\".<\/p>\n    <p>Task: how many subsets of the array have sum exactly <code>x<\/code>? (n ≤ 20)<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n;\n    long long x;\n    cin &gt;&gt; n &gt;&gt; x;                              // n &lt;= 20\n    vector&lt;long long&gt; a(n);\n    for (auto &amp;v : a) cin &gt;&gt; v;\n    int ways = 0;\n    for (int mask = 0; mask &lt; (1 &lt;&lt; n); mask++) {   // every subset, one by one\n        long long sum = 0;\n        for (int i = 0; i &lt; n; i++)\n            if ((mask &gt;&gt; i) &amp; 1) sum += a[i];       // item i is in this subset\n        if (sum == x) ways++;\n    }\n    cout &lt;&lt; ways &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p class=\"note\">The same job can be done with <a href=\"#recursion\">recursion<\/a> (\"take it or skip it\"). The mask loop is shorter to write.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: every operator is O(1). All subsets: O(2^n · n). Fine for n ≤ 20 (about 20 million steps), too slow for n = 30.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li><span class=\"term\" data-t=\"precedence\">Operator precedence<\/span>: <code>x &amp; 1 == 0<\/code> means <code>x &amp; (1 == 0)<\/code>. Always use brackets: <code>(x &amp; 1) == 0<\/code>.<\/li>\n    <li><code>1 &lt;&lt; k<\/code> with k ≥ 31 <span class=\"term\" data-t=\"overflow\">overflows<\/span>, because 1 is an <code>int<\/code>. Write <code>1LL &lt;&lt; k<\/code>.<\/li>\n    <li><code>^<\/code> is XOR, not power. <code>2 ^ 3<\/code> is 1, not 8. For 2<sup>k<\/sup> write <code>1 &lt;&lt; k<\/code>.<\/li>\n    <li><code>&amp;&amp;<\/code> and <code>&amp;<\/code> are different. <code>&amp;&amp;<\/code> is for conditions (true/false). <code>&amp;<\/code> works on the bits.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"1527A\">And Then There Were K<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1559A\">Mocha and Math<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"579A\">Raising Bacteria<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"467B\">Fedor and New Game<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1420B\">Rock and Lever<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1097B\">Petr and a Combination Lock<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1669H\">Maximal AND<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"550B\">Preparing Olympiad<\/a><span class=\"r\">1400<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book, chapter 10 \"Bit manipulation\".<\/li>\n    <li><a href=\"https://usaco.guide/silver/intro-bitwise\">USACO Guide: Intro to Bitwise Operators<\/a> — the operators with solved problems.<\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1623\">CSES: Apple Division<\/a> — a classic \"try every subset\" task with n ≤ 20.<\/li>\n  <\/ul>\n<\/section>\n","constructive":"<p class=\"idea\">You do not search for the best answer. You must build one answer that follows the rules. Find a simple pattern and print it.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>\"If there are several answers, print <b>any<\/b> of them.\"<\/li>\n    <li>\"Find an array / a <span class=\"term\" data-t=\"permutation\">permutation<\/span> / a string such that …\"<\/li>\n    <li>\"… or print −1 (or NO) if it is impossible.\"<\/li>\n    <li>The limits are big, but the task has no real data to work on, often only one number n.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — tiling a floor<\/h3>\n    <p>A worker covers a big floor with tiles. He does not think about each tile alone. He finds a small <span class=\"term\" data-t=\"pattern\">pattern<\/span> that works, and he repeats it over the whole floor.<\/p>\n    <p>A <span class=\"term\" data-t=\"constructive\">constructive<\/span> problem is the same. The judge accepts any <span class=\"term\" data-t=\"valid\">valid<\/span> answer, so choose the one that is the easiest to describe.<\/p>\n    <p><b>How to find the pattern:<\/b><\/p>\n    <ol>\n      <li>Solve the tiny cases by hand: n = 1, 2, 3, 4, 5, 6. Write the answers in a table.<\/li>\n      <li>Try simple shapes first: sorted, reversed, shifted by one, <span class=\"term\" data-t=\"alternating\">alternating<\/span> (small, big, small, big), all equal.<\/li>\n      <li>Find when it is impossible. Look at <span class=\"term\" data-t=\"parity\">parity<\/span> and sums: something that never changes (an <span class=\"term\" data-t=\"invariant\">invariant<\/span>).<\/li>\n      <li>Test your pattern with a small checker before you submit (see the code below).<\/li>\n    <\/ol>\n    <p class=\"note\">Example for step 3: \"split the numbers 1..n into two groups with equal sums\". The total is n · (n + 1) / 2. If the total is odd, no split exists. Print NO at once.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — a permutation where no number stays at home<\/h3>\n    <p>Task: for a given n ≥ 2 print a permutation <code>p<\/code> of 1..n with <code>p[i] ≠ i<\/code> for every position i (positions from 1).<\/p>\n    <table>\n      <tr><th>n<\/th><th>an answer found by hand<\/th><th>what we see<\/th><\/tr>\n      <tr><td>2<\/td><td>2 1<\/td><td>the only one<\/td><\/tr>\n      <tr><td>3<\/td><td>2 3 1<\/td><td>everybody moves one step<\/td><\/tr>\n      <tr><td>4<\/td><td>2 3 4 1<\/td><td>the same idea works<\/td><\/tr>\n      <tr><td>5<\/td><td>2 3 4 5 1<\/td><td>again<\/td><\/tr>\n      <tr><td>6<\/td><td>2 3 4 5 6 1<\/td><td class=\"hi\">pattern: 2, 3, …, n, 1<\/td><\/tr>\n    <\/table>\n    <p>Now check the pattern for every n, not only for the table. Position i (for i &lt; n) holds i + 1, which is not i. Position n holds 1, which is not n because n ≥ 2. Every number is used once. So it is always valid.<\/p>\n    <p class=\"note\">This pattern is a <span class=\"term\" data-t=\"shift\">shift<\/span> by one. It is one of the most useful shapes in constructive problems.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — print the pattern<\/h3>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int t;\n    cin &gt;&gt; t;\n    while (t--) {\n        int n;\n        cin &gt;&gt; n;                                  // n &gt;= 2\n        for (int i = 2; i &lt;= n; i++) cout &lt;&lt; i &lt;&lt; \" \";   // positions 1..n-1 get 2..n\n        cout &lt;&lt; 1 &lt;&lt; \"\\n\";                         // position n gets 1\n    }\n}\n<\/code><\/pre>\n    <p><b>A checker.<\/b> Write a small function that tests the rules of the statement. Run it on your own computer for every n from 1 to 50. If it says \"false\" for some n, you found a bug before the judge did. More about this in <a href=\"#debugging\">How to find your bug<\/a>.<\/p>\n<pre data-part=\"global\"><code class=\"cpp\">\nbool isValid(vector&lt;int&gt; p) {              // p[0] is position 1, p[1] is position 2, ...\n    int n = p.size();\n    vector&lt;bool&gt; seen(n + 1, false);\n    for (int i = 0; i &lt; n; i++) {\n        if (p[i] &lt; 1 || p[i] &gt; n) return false;    // not a number from 1..n\n        if (seen[p[i]]) return false;              // used twice: not a permutation\n        seen[p[i]] = true;\n        if (p[i] == i + 1) return false;           // this number stays at home\n    }\n    return true;\n}\n<\/code><\/pre>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: usually O(n), you only print the answer. The hard part is the idea, not the running time.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>Forgetting the small cases. A pattern that works for n ≥ 4 can fail for n = 1, 2 or 3. Check each <span class=\"term\" data-t=\"edge-case\">edge case<\/span> by hand.<\/li>\n    <li>Forgetting the impossible case, or printing −1 when an answer exists.<\/li>\n    <li>Thinking your output must be equal to the sample output. It does not. Any valid answer is accepted.<\/li>\n    <li>Looking for a clever method for too long. First write tiny cases on paper. The pattern often shows itself.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"1454A\">Special Permutation<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1343B\">Balanced Array<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1391A\">Suborrays<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1367B\">Even Array<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1348A\">Phoenix and Balance<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1691B\">Shoe Shuffling<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1352B\">Same Parity Summands<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1335D\">Anti-Sudoku<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1348B\">Phoenix and Beauty<\/a><span class=\"r\">1400<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://codeforces.com/problemset\">Codeforces problem set<\/a> — choose the tag \"constructive algorithms\" and rating 800–1200. Many small problems are the best teacher here.<\/li>\n    <li><a href=\"https://codeforces.com/group/MWSDmqGsZm/contests\">Assiut newcomers sheets<\/a> — easy problems where you look for a pattern.<\/li>\n    <li><a href=\"#debugging\">How to find your bug<\/a> — how to compare your answer with a brute force.<\/li>\n  <\/ul>\n<\/section>\n","recursion":"<p class=\"idea\">A function that calls itself on a smaller problem. With it you can try every choice: take or skip, this order or that order.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li><b>n is very small<\/b>: n ≤ 20 means \"try all <span class=\"term\" data-t=\"subset\">subsets<\/span>\" (2<sup>20<\/sup> ≈ 10<sup>6<\/sup>). n ≤ 10 means \"try all orders\" (10! ≈ 3.6 · 10<sup>6<\/sup>).<\/li>\n    <li>For every item you make a choice: take it or skip it, plus or minus, group A or group B.<\/li>\n    <li>The statement says \"print all…\" or \"count all ways…\" and the numbers are tiny.<\/li>\n    <li>The problem contains a smaller copy of itself, like n! = n × (n−1)!.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — the line of people<\/h3>\n    <p>You stand in a long line. You want to know your position, but you cannot see the front.<\/p>\n    <p>You ask the person in front of you: \"What is your position?\" He does not know, so he asks the next person. This goes on until the first person. She says \"I am 1\". This is the <span class=\"term\" data-t=\"base-case\">base case<\/span>: no more questions.<\/p>\n    <p>Now the answers come back: 2, 3, 4… Each person adds 1 to the answer he gets. Every <span class=\"term\" data-t=\"recursion\">recursion<\/span> has these two parts: a <b>base case<\/b> that stops, and a <b>step<\/b> that asks a smaller question.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — all subsets of {1, 2, 3}<\/h3>\n    <p>Look at the numbers one by one. For each number choose: <b>take<\/b> it (go left) or <b>skip<\/b> it (go right). After 3 choices you reach the bottom. Each bottom point is one subset.<\/p>\n    <svg viewBox=\"0 0 640 250\" width=\"640\" role=\"img\" aria-label=\"Call tree: for each of 1, 2, 3 go left to take it or right to skip it. The 8 leaves are the 8 subsets.\">\n      <line x1=\"320\" y1=\"32\" x2=\"160\" y2=\"76\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/>\n      <line x1=\"320\" y1=\"32\" x2=\"480\" y2=\"76\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n      <line x1=\"160\" y1=\"100\" x2=\"80\" y2=\"144\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/>\n      <line x1=\"160\" y1=\"100\" x2=\"240\" y2=\"144\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n      <line x1=\"480\" y1=\"100\" x2=\"400\" y2=\"144\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/>\n      <line x1=\"480\" y1=\"100\" x2=\"560\" y2=\"144\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n      <line x1=\"80\" y1=\"168\" x2=\"40\" y2=\"212\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/>\n      <line x1=\"80\" y1=\"168\" x2=\"120\" y2=\"212\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n      <line x1=\"240\" y1=\"168\" x2=\"200\" y2=\"212\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/>\n      <line x1=\"240\" y1=\"168\" x2=\"280\" y2=\"212\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n      <line x1=\"400\" y1=\"168\" x2=\"360\" y2=\"212\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/>\n      <line x1=\"400\" y1=\"168\" x2=\"440\" y2=\"212\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n      <line x1=\"560\" y1=\"168\" x2=\"520\" y2=\"212\" stroke=\"var(--accent)\" stroke-width=\"1.5\"/>\n      <line x1=\"560\" y1=\"168\" x2=\"600\" y2=\"212\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 3\"/>\n      <text x=\"320\" y=\"28\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">{ }<\/text>\n      <text x=\"160\" y=\"96\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">{1}<\/text>\n      <text x=\"480\" y=\"96\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">{ }<\/text>\n      <text x=\"80\" y=\"164\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">{1,2}<\/text>\n      <text x=\"240\" y=\"164\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">{1}<\/text>\n      <text x=\"400\" y=\"164\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">{2}<\/text>\n      <text x=\"560\" y=\"164\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">{ }<\/text>\n      <text x=\"40\" y=\"232\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--ok)\" font-weight=\"bold\">{1,2,3}<\/text>\n      <text x=\"120\" y=\"232\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--ok)\" font-weight=\"bold\">{1,2}<\/text>\n      <text x=\"200\" y=\"232\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--ok)\" font-weight=\"bold\">{1,3}<\/text>\n      <text x=\"280\" y=\"232\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--ok)\" font-weight=\"bold\">{1}<\/text>\n      <text x=\"360\" y=\"232\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--ok)\" font-weight=\"bold\">{2,3}<\/text>\n      <text x=\"440\" y=\"232\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--ok)\" font-weight=\"bold\">{2}<\/text>\n      <text x=\"520\" y=\"232\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--ok)\" font-weight=\"bold\">{3}<\/text>\n      <text x=\"600\" y=\"232\" text-anchor=\"middle\" font-size=\"13\" fill=\"var(--ok)\" font-weight=\"bold\">{ }<\/text>\n      <text x=\"4\" y=\"58\" font-size=\"12\" fill=\"var(--muted)\">1 ?<\/text>\n      <text x=\"4\" y=\"126\" font-size=\"12\" fill=\"var(--muted)\">2 ?<\/text>\n      <text x=\"4\" y=\"194\" font-size=\"12\" fill=\"var(--muted)\">3 ?<\/text>\n      <text x=\"636\" y=\"16\" text-anchor=\"end\" font-size=\"12\" fill=\"var(--accent)\">solid line = take<\/text>\n      <text x=\"636\" y=\"32\" text-anchor=\"end\" font-size=\"12\" fill=\"var(--muted)\">dashed line = skip<\/text>\n    <\/svg>\n    <p class=\"note\">This drawing is the <span class=\"term\" data-t=\"call-tree\">call tree<\/span>. 3 choices → 2 × 2 × 2 = 8 subsets. With n numbers the bottom has 2<sup>n<\/sup> points.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — take or skip<\/h3>\n    <p>Count the subsets with sum exactly <code>target<\/code>. The function <code>go(i, sum)<\/code> means: \"numbers 0..i−1 are decided, their sum is <code>sum<\/code>\".<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint n;\nlong long target;\nvector&lt;long long&gt; a;\nint ways = 0;\n\nvoid go(int i, long long sum) {\n    if (i == n) {                  // base case: every number is decided\n        if (sum == target) ways++;\n        return;\n    }\n    go(i + 1, sum + a[i]);         // choice 1: take a[i]\n    go(i + 1, sum);                // choice 2: skip a[i]\n}\n\nint main() {\n    cin &gt;&gt; n &gt;&gt; target;\n    a.resize(n);\n    for (auto &amp;x : a) cin &gt;&gt; x;\n    go(0, 0);\n    cout &lt;&lt; ways &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p class=\"note\">Input <code>3 3<\/code> and <code>1 2 3<\/code> prints 2: the subsets {1, 2} and {3}.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2>Backtracking: try, go deeper, undo<\/h2>\n  <p>Sometimes you need the chosen items themselves, not only their sum. Keep them in one <code>vector<\/code>. Add an item, go deeper, then <b>remove it<\/b> before the next choice. This is <span class=\"term\" data-t=\"backtracking\">backtracking<\/span>.<\/p>\n<pre data-part=\"global\"><code class=\"cpp\">\nint n;\nvector&lt;int&gt; a, chosen;\n\nvoid go(int i) {\n    if (i == n) {                        // base case: print this subset\n        for (int x : chosen) cout &lt;&lt; x &lt;&lt; \" \";\n        cout &lt;&lt; \"\\n\";\n        return;\n    }\n    chosen.push_back(a[i]);              // try: take a[i]\n    go(i + 1);                           // go deeper\n    chosen.pop_back();                   // undo\n    go(i + 1);                           // now try without a[i]\n}\n<\/code><\/pre>\n  <p>Two short forms without recursion. Subsets: a loop over <a href=\"#bits\">bit masks<\/a>. Orders: <code>next_permutation<\/code> (sort first!).<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nfor (int mask = 0; mask &lt; (1 &lt;&lt; n); mask++) {     // every subset\n    long long sum = 0;\n    for (int i = 0; i &lt; n; i++)\n        if (mask &gt;&gt; i &amp; 1) sum += a[i];          // bit i is 1 -&gt; a[i] is taken\n}\nsort(p.begin(), p.end());\ndo { /* use the order p */ } while (next_permutation(p.begin(), p.end()));\n<\/code><\/pre>\n  <p class=\"tip-box\">Stop early when a branch cannot win. Example: the sum is already bigger than the target and all numbers are positive → <code>return<\/code>. This makes backtracking much faster.<\/p>\n<\/section>\n\n<p class=\"complexity\">Speed: subsets O(2^n) → fine for n ≤ 20. Orders O(n!) → fine for n ≤ 10. Always check n before you start.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>No base case, or a base case that is never reached. The function calls itself forever and the program crashes.<\/li>\n    <li>The next call is not smaller: you write <code>go(i)<\/code> and not <code>go(i + 1)<\/code>.<\/li>\n    <li>You forget to undo. After <code>push_back<\/code> and the call, you must <code>pop_back<\/code>.<\/li>\n    <li>n is too big. For n = 40, 2<sup>40<\/sup> is about 10<sup>12<\/sup>: too slow. Look for <a href=\"#dp\">DP<\/a> or <a href=\"#greedy\">greedy<\/a>.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"1829D\">Gold Rush<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"727A\">Transformation: from A to B<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"535B\">Tavas and SaDDas<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1097B\">Petr and a Combination Lock<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"96B\">Lucky Numbers (easy)<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"550B\">Preparing Olympiad<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1385D\">a-Good String<\/a><span class=\"r\">1500<\/span><\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1623\">CSES: Apple Division<\/a><span class=\"r\">CSES<\/span> — n ≤ 20: each apple goes to group A or group B.<\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1622\">CSES: Creating Strings<\/a><span class=\"r\">CSES<\/span> — print all orders of the letters.<\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1624\">CSES: Chessboard and Queens<\/a><span class=\"r\">CSES<\/span> — classic backtracking: put a queen, go deeper, remove it.<\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/bronze/complete-rec\">USACO Guide: Complete Search with Recursion<\/a> — subsets and permutations, step by step.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book, chapter 5 \"Complete search\".<\/li>\n    <li><a href=\"https://www.youtube.com/@ArabicCompetitiveProgramming\">Arabic videos<\/a> — lessons by Mostafa Saad. Search the channel for \"recursion\" and \"backtracking\".<\/li>\n  <\/ul>\n<\/section>\n","dp":"<p class=\"idea\">Solve the small problems first and write down their answers. Build each bigger answer from the answers you already have.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The statement asks to <b>count the ways<\/b> (often \"modulo 10<sup>9<\/sup>+7\"), or for the <b>minimum / maximum<\/b> over many choices.<\/li>\n    <li>You make choices one after another, and each choice changes what you can do next.<\/li>\n    <li><a href=\"#greedy\">Greedy<\/a> fails on a small example, and <a href=\"#recursion\">trying everything<\/a> is too slow (n is 1000 or 10<sup>5<\/sup>).<\/li>\n    <li>The answer for n is easy if you already know the answers for smaller n.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — climbing stairs<\/h3>\n    <p>You climb stairs. Each move is 1 step or 2 steps up. In how many ways can you reach step n?<\/p>\n    <p>Think about your <b>last move<\/b>. You come to step n from step n−1 or from step n−2. So <code>ways(n) = ways(n−1) + ways(n−2)<\/code>.<\/p>\n    <p>Now walk up and write the answer on every step with chalk. For a new step you only read the two numbers below it. You never count again. This is <span class=\"term\" data-t=\"dynamic-programming\">dynamic programming<\/span> (DP).<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — fill the table from left to right<\/h3>\n    <p>Stairs: <code>dp[i]<\/code> = number of ways to reach step i. Each cell = the sum of the two cells before it.<\/p>\n    <table>\n      <tr><th>i<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><\/tr>\n      <tr><th>dp[i]<\/th><td>1<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>8<\/td><td class=\"hi\">13<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">dp[6] = dp[5] + dp[4] = 8 + 5 = 13. dp[0] = 1: there is one way to stay on the floor (do nothing).<\/p>\n    <p>Min coins: coins are 1, 3 and 4. <code>dp[x]<\/code> = the smallest number of coins with sum x. Try each coin as the <b>last coin<\/b>: <code>dp[x] = 1 + min(dp[x−1], dp[x−3], dp[x−4])<\/code>.<\/p>\n    <table>\n      <tr><th>x<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>6<\/td><\/tr>\n      <tr><th>dp[x]<\/th><td>0<\/td><td>1<\/td><td>2<\/td><td>1<\/td><td>1<\/td><td>2<\/td><td class=\"hi\">2<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">dp[6] = 1 + min(dp[5], dp[3], dp[2]) = 1 + min(2, 1, 2) = 2, that is 3 + 3. Greedy takes 4 first and gets 4 + 1 + 1 = 3 coins. DP checks every last coin, so it is never wrong.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — stairs<\/h3>\n    <p>The answer grows very fast, so problems ask for it <span class=\"term\" data-t=\"modulo\">modulo<\/span> 10<sup>9<\/sup>+7.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nconst int MOD = 1000000007;\n\nint main() {\n    int n;\n    cin &gt;&gt; n;\n    vector&lt;long long&gt; dp(n + 2);\n    dp[0] = 1;                                   // base cases\n    dp[1] = 1;\n    for (int i = 2; i &lt;= n; i++)\n        dp[i] = (dp[i - 1] + dp[i - 2]) % MOD;   // last move: 1 step or 2 steps\n    cout &lt;&lt; dp[n] &lt;&lt; \"\\n\";                       // the answer is on step n\n}\n<\/code><\/pre>\n  <\/div>\n<\/section>\n\n<section>\n  <h2>The recipe: 4 questions<\/h2>\n  <p>Answer these on paper <b>before<\/b> you write code. Every DP problem is these four answers.<\/p>\n  <table>\n    <tr><th>Question<\/th><th>Stairs<\/th><th>Min coins<\/th><\/tr>\n    <tr><td>1. What does <code>dp[i]<\/code> mean, in words? (the <span class=\"term\" data-t=\"state\">state<\/span>)<\/td><td>ways to reach step i<\/td><td>fewest coins with sum x<\/td><\/tr>\n    <tr><td>2. The formula from smaller answers? (the <span class=\"term\" data-t=\"transition\">transition<\/span>)<\/td><td>dp[i] = dp[i−1] + dp[i−2]<\/td><td>dp[x] = 1 + min(dp[x−c])<\/td><\/tr>\n    <tr><td>3. The <span class=\"term\" data-t=\"base-case\">base cases<\/span>?<\/td><td>dp[0] = dp[1] = 1<\/td><td>dp[0] = 0, others = ∞<\/td><\/tr>\n    <tr><td>4. The order of filling? Where is the answer?<\/td><td>i from 2 up; answer dp[n]<\/td><td>x from 1 up; answer dp[sum]<\/td><\/tr>\n  <\/table>\n  <p class=\"tip-box\">Stuck on question 2? Ask: \"What was the <b>last<\/b> choice?\" Last move, last coin, last item. Each possible last choice gives one smaller <span class=\"term\" data-t=\"subproblem\">subproblem<\/span>.<\/p>\n\n  <div class=\"way\">\n    <h3><b>Second example<\/b> — 0/1 knapsack<\/h3>\n    <p>n items, item i has weight <code>w<\/code> and value <code>v<\/code>. The bag holds weight W. Each item is used at most once. Find the best total value. This is the <span class=\"term\" data-t=\"knapsack\">knapsack<\/span> problem.<\/p>\n    <p><code>dp[c]<\/code> = the best value with total weight ≤ c, using the items seen so far. For a new item: skip it (dp[c] stays) or take it (<code>dp[c − w] + v<\/code>).<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n, W;\n    cin &gt;&gt; n &gt;&gt; W;\n    vector&lt;long long&gt; dp(W + 1, 0);          // no items yet: value 0\n    for (int i = 0; i &lt; n; i++) {\n        int w;\n        long long v;\n        cin &gt;&gt; w &gt;&gt; v;\n        for (int c = W; c &gt;= w; c--)          // backwards: use each item once\n            dp[c] = max(dp[c], dp[c - w] + v);\n    }\n    cout &lt;&lt; dp[W] &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p class=\"note\">Why backwards? Going down, <code>dp[c − w]<\/code> is still the old value, without this item. Going up, you can take the same item two times.<\/p>\n  <\/div>\n\n  <h3>Classic patterns<\/h3>\n  <table>\n    <tr><th>Pattern<\/th><th>dp means<\/th><th>Formula<\/th><\/tr>\n    <tr><td>Count ways (stairs)<\/td><td>dp[i] = ways to reach i<\/td><td>dp[i] = dp[i−1] + dp[i−2]<\/td><\/tr>\n    <tr><td>Min coins<\/td><td>dp[x] = fewest coins for sum x<\/td><td>dp[x] = 1 + min(dp[x−c]) over coins c<\/td><\/tr>\n    <tr><td>Take or skip (no two <span class=\"term\" data-t=\"adjacent\">adjacent<\/span>)<\/td><td>dp[i] = best sum in the first i items<\/td><td>dp[i] = max(dp[i−1], dp[i−2] + a[i])<\/td><\/tr>\n    <tr><td>Paths in a grid (right / down)<\/td><td>dp[i][j] = ways to reach cell (i, j)<\/td><td>dp[i][j] = dp[i−1][j] + dp[i][j−1]<\/td><\/tr>\n    <tr><td>Knapsack<\/td><td>dp[c] = best value with weight ≤ c<\/td><td>dp[c] = max(dp[c], dp[c−w] + v), c backwards<\/td><\/tr>\n    <tr><td>LIS, O(n²) (longest increasing <span class=\"term\" data-t=\"subsequence\">subsequence<\/span>)<\/td><td>dp[i] = longest one that ends at i<\/td><td>dp[i] = 1 + max(dp[j]) for j &lt; i, a[j] &lt; a[i]<\/td><\/tr>\n    <tr><td>LCS (longest common subsequence)<\/td><td>dp[i][j] = answer for first i of s, first j of t<\/td><td>same letters: dp[i−1][j−1] + 1; else max(dp[i−1][j], dp[i][j−1])<\/td><\/tr>\n  <\/table>\n  <p><b>Two styles.<\/b> Bottom-up: fill the table with loops, small to big, like the code above. Top-down: write the recursion and store each answer the first time you compute it (<span class=\"term\" data-t=\"memoisation\">memoisation<\/span>). Both give the same answer; use the one that is easier for you.<\/p>\n<\/section>\n\n<p class=\"complexity\">Speed: (number of states) × (work for one state). Stairs O(n). Min coins O(sum × coins). Knapsack O(n × W). LIS O(n²).<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>You start coding before you can say in words what <code>dp[i]<\/code> means. Write that sentence first.<\/li>\n    <li>Wrong or missing base case, or reading outside the array: <code>dp[i − 2]<\/code> when i = 1.<\/li>\n    <li>Wrong order: you use a cell that is not filled yet. In 0/1 knapsack the weight loop must go backwards.<\/li>\n    <li>Forgetting <code>% MOD<\/code> or using <code>int<\/code> for big sums. For \"minimum\", start with a big value, not 0.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"580A\">Kefa and First Steps<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a href=\"https://atcoder.jp/contests/dp/tasks/dp_a\">AtCoder DP A: Frog 1<\/a><span class=\"r\">AtCoder<\/span> — the stairs idea with a cost. Then do B (Frog 2) and C (Vacation).<\/li>\n    <li><a class=\"cf\" data-p=\"1472C\">Long Jumps<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"327A\">Flipping Game<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"189A\">Cut Ribbon<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a href=\"https://atcoder.jp/contests/dp/tasks/dp_d\">AtCoder DP D: Knapsack 1<\/a><span class=\"r\">AtCoder<\/span> — the knapsack code above.<\/li>\n    <li><a class=\"cf\" data-p=\"698A\">Vacations<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1195C\">Basketball Exercise<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"455A\">Boredom<\/a><span class=\"r\">1500<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"431C\">k-Tree<\/a><span class=\"r\">1600<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://atcoder.jp/contests/dp/tasks\">AtCoder Educational DP Contest<\/a> — 26 classic problems, A to Z. Solve A–F first. The best DP training.<\/li>\n    <li><a href=\"https://cses.fi/problemset/\">CSES Problem Set<\/a> — the \"Dynamic Programming\" section. Start with Dice Combinations and Minimizing Coins.<\/li>\n    <li><a href=\"https://usaco.guide/gold/intro-dp\">USACO Guide: Introduction to DP<\/a> — clear text with solved examples.<\/li>\n    <li><a href=\"https://www.youtube.com/@ArabicCompetitiveProgramming\">Arabic videos<\/a> — a full DP playlist by Mostafa Saad.<\/li>\n  <\/ul>\n<\/section>\n","graphs-bfs-dfs":"<p class=\"idea\">A graph is points joined by lines. DFS and BFS are two ways to walk over it and visit every point once.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The statement has cities and roads, friends, or computers and cables: things and <b>links between pairs<\/b>.<\/li>\n    <li>\"Can you reach B from A?\" or \"How many groups are there?\" → DFS or BFS.<\/li>\n    <li>\"The <b>minimum number of moves<\/b>\" and every move costs the same → BFS.<\/li>\n    <li>A <span class=\"term\" data-t=\"grid\">grid<\/span> (maze) with walls where you move up, down, left, right. A grid is also a graph.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — a maze and a rumour<\/h3>\n    <p>A <span class=\"term\" data-t=\"graph\">graph<\/span> has <span class=\"term\" data-t=\"vertex\">vertices<\/span> (the points) and <span class=\"term\" data-t=\"edge\">edges<\/span> (the lines). Two vertices joined by an edge are <span class=\"term\" data-t=\"neighbour\">neighbours<\/span>.<\/p>\n    <p><b>DFS<\/b> is one person in a maze. You walk forward as far as you can. You mark every room you enter. At a dead end you go back one room and try another door.<\/p>\n    <p><b>BFS<\/b> is a rumour. Today you know it. Tomorrow all your friends know it. The next day their friends know it. It moves <b>level by level<\/b>, so it reaches each person by the shortest way.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — BFS from vertex 1<\/h3>\n    <svg viewBox=\"0 0 480 180\" width=\"480\" role=\"img\" aria-label=\"Graph with 6 vertices and edges 1-2, 1-3, 2-4, 3-5, 4-5, 5-6. Distances from vertex 1 are 0, 1, 1, 2, 2, 3.\">\n      <g stroke=\"var(--line)\" stroke-width=\"2\">\n        <line x1=\"60\" y1=\"90\" x2=\"180\" y2=\"40\"/><line x1=\"60\" y1=\"90\" x2=\"180\" y2=\"140\"/>\n        <line x1=\"180\" y1=\"40\" x2=\"300\" y2=\"40\"/><line x1=\"180\" y1=\"140\" x2=\"300\" y2=\"140\"/>\n        <line x1=\"300\" y1=\"40\" x2=\"300\" y2=\"140\"/><line x1=\"300\" y1=\"140\" x2=\"420\" y2=\"140\"/>\n      <\/g>\n      <g fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.5\">\n        <circle cx=\"60\" cy=\"90\" r=\"16\" stroke=\"var(--accent)\" stroke-width=\"3\"/>\n        <circle cx=\"180\" cy=\"40\" r=\"16\"/><circle cx=\"180\" cy=\"140\" r=\"16\"/>\n        <circle cx=\"300\" cy=\"40\" r=\"16\"/><circle cx=\"300\" cy=\"140\" r=\"16\"/><circle cx=\"420\" cy=\"140\" r=\"16\"/>\n      <\/g>\n      <g fill=\"currentColor\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">\n        <text x=\"60\" y=\"95\">1<\/text><text x=\"180\" y=\"45\">2<\/text><text x=\"180\" y=\"145\">3<\/text>\n        <text x=\"300\" y=\"45\">4<\/text><text x=\"300\" y=\"145\">5<\/text><text x=\"420\" y=\"145\">6<\/text>\n      <\/g>\n      <g fill=\"var(--muted)\" font-size=\"12\" text-anchor=\"middle\">\n        <text x=\"60\" y=\"126\">dist 0<\/text><text x=\"180\" y=\"16\">dist 1<\/text><text x=\"180\" y=\"174\">dist 1<\/text>\n        <text x=\"300\" y=\"16\">dist 2<\/text><text x=\"300\" y=\"174\">dist 2<\/text><text x=\"420\" y=\"174\">dist 3<\/text>\n      <\/g>\n    <\/svg>\n    <p>BFS keeps a <span class=\"term\" data-t=\"queue\">queue<\/span>. Take the front vertex. Every neighbour with no distance yet gets <code>dist + 1<\/code> and goes to the back of the queue.<\/p>\n    <table>\n      <tr><th>take<\/th><th>new neighbours<\/th><th>queue after<\/th><th>dist[1..6]<\/th><\/tr>\n      <tr><td>start<\/td><td>—<\/td><td>1<\/td><td>0 · · · · ·<\/td><\/tr>\n      <tr><td>1<\/td><td>2, 3<\/td><td>2 3<\/td><td>0 1 1 · · ·<\/td><\/tr>\n      <tr><td>2<\/td><td>4<\/td><td>3 4<\/td><td>0 1 1 2 · ·<\/td><\/tr>\n      <tr><td>3<\/td><td>5<\/td><td>4 5<\/td><td>0 1 1 2 2 ·<\/td><\/tr>\n      <tr><td>4<\/td><td>none (2 and 5 are seen)<\/td><td>5<\/td><td>0 1 1 2 2 ·<\/td><\/tr>\n      <tr><td>5<\/td><td>6<\/td><td>6<\/td><td>0 1 1 2 2 3<\/td><\/tr>\n      <tr><td>6<\/td><td>none<\/td><td>empty → stop<\/td><td class=\"hi\">0 1 1 2 2 3<\/td><\/tr>\n    <\/table>\n    <p class=\"note\"><code>dist[v]<\/code> = the smallest number of edges from the start to v. DFS from 1 visits in a different order: 1 → 2 → 4 → 5 → 3, back to 5, then 6.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — read, DFS, BFS<\/h3>\n    <p>Store the graph as an <span class=\"term\" data-t=\"adjacency-list\">adjacency list<\/span>: <code>g[v]<\/code> is the list of neighbours of v. The program prints the number of <span class=\"term\" data-t=\"connected-component\">connected components<\/span> (groups), then the distances from vertex 1.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint n, m;\nvector&lt;vector&lt;int&gt;&gt; g;       // g[v] = neighbours of v\nvector&lt;bool&gt; visited;\n\nvoid dfs(int v) {\n    visited[v] = true;                    // mark first, then go deeper\n    for (int to : g[v])\n        if (!visited[to]) dfs(to);\n}\n\nvector&lt;int&gt; bfs(int start) {\n    vector&lt;int&gt; dist(n + 1, -1);          // -1 = not reached yet\n    queue&lt;int&gt; q;\n    dist[start] = 0;\n    q.push(start);\n    while (!q.empty()) {\n        int v = q.front();\n        q.pop();\n        for (int to : g[v]) {\n            if (dist[to] != -1) continue; // already seen\n            dist[to] = dist[v] + 1;\n            q.push(to);\n        }\n    }\n    return dist;\n}\n\nint main() {\n    cin &gt;&gt; n &gt;&gt; m;                        // n vertices (1..n), m edges\n    g.assign(n + 1, vector&lt;int&gt;());\n    visited.assign(n + 1, false);\n    for (int i = 0; i &lt; m; i++) {\n        int a, b;\n        cin &gt;&gt; a &gt;&gt; b;\n        g[a].push_back(b);\n        g[b].push_back(a);                // the edge works in both directions\n    }\n    int components = 0;\n    for (int v = 1; v &lt;= n; v++)\n        if (!visited[v]) {                // a vertex nobody reached: a new group\n            components++;\n            dfs(v);\n        }\n    cout &lt;&lt; components &lt;&lt; \"\\n\";\n    vector&lt;int&gt; dist = bfs(1);\n    for (int v = 1; v &lt;= n; v++) cout &lt;&lt; dist[v] &lt;&lt; \" \";\n    cout &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p class=\"note\">This is an <span class=\"term\" data-t=\"undirected\">undirected<\/span> graph. If the statement says <span class=\"term\" data-t=\"directed\">directed<\/span> (one-way roads), write only <code>g[a].push_back(b)<\/code>.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2>A grid is also a graph<\/h2>\n  <p>Each free cell is a vertex. Its neighbours are the 4 cells next to it. Do not build <code>g<\/code>. Use two small arrays for the 4 directions. Inside the BFS loop, for the cell <code>(x, y)<\/code> you took from the queue:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nint dx[4] = {1, -1, 0, 0}, dy[4] = {0, 0, 1, -1};\nfor (int d = 0; d &lt; 4; d++) {\n    int nx = x + dx[d], ny = y + dy[d];\n    if (nx &lt; 0 || nx &gt;= n || ny &lt; 0 || ny &gt;= m) continue;      // outside the grid\n    if (grid[nx][ny] == '#' || dist[nx][ny] != -1) continue;  // wall, or seen\n    dist[nx][ny] = dist[x][y] + 1;\n    q.push({nx, ny});                                         // queue&lt;pair&lt;int,int&gt;&gt;\n}\n<\/code><\/pre>\n<\/section>\n\n<p class=\"complexity\">Speed: O(n + m) for both DFS and BFS. Each vertex and each edge is used once. A grid: O(rows × columns).<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>No <span class=\"term\" data-t=\"visited\">visited<\/span> mark. In a graph with a <span class=\"term\" data-t=\"cycle\">cycle<\/span> you then walk in a circle forever.<\/li>\n    <li>You add the edge in one direction only, or the size is <code>g(n)<\/code> while vertices are 1..n. Use <code>n + 1<\/code>.<\/li>\n    <li>Many <span class=\"term\" data-t=\"test-case\">test cases<\/span>: you forget to clear <code>g<\/code> and <code>visited<\/code> before each one.<\/li>\n    <li>Very deep recursion: a DFS on a chain of 10<sup>6<\/sup> vertices can crash on some judges. If you see a strange runtime error, use BFS.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"500A\">New Year Transportation<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1020B\">Badge<\/a><span class=\"r\">1000<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1829E\">The Lakes<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1192\">CSES: Counting Rooms<\/a><span class=\"r\">CSES<\/span> — count the components of a grid.<\/li>\n    <li><a class=\"cf\" data-p=\"217A\">Ice Skating<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"893C\">Rumor<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"520B\">Two Buttons<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1193\">CSES: Labyrinth<\/a><span class=\"r\">CSES<\/span> — BFS on a grid, and you must print the path.<\/li>\n    <li><a class=\"cf\" data-p=\"977E\">Cyclic Components<\/a><span class=\"r\">1500<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"580C\">Kefa and Park<\/a><span class=\"r\">1500<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"377A\">Maze<\/a><span class=\"r\">1600<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/silver/graph-traversal\">USACO Guide: Graph Traversal<\/a> — DFS and BFS with pictures and solved problems.<\/li>\n    <li><a href=\"https://cses.fi/problemset/\">CSES Problem Set<\/a> — the \"Graph Algorithms\" section. The first five problems are pure DFS and BFS.<\/li>\n    <li><a href=\"https://cp-algorithms.com/graph/breadth-first-search.html\">cp-algorithms: BFS<\/a> — short reference, also shows how to print the path.<\/li>\n    <li><a href=\"https://www.youtube.com/@ArabicCompetitiveProgramming\">Arabic videos<\/a> — graph lessons by Mostafa Saad.<\/li>\n  <\/ul>\n<\/section>\n","dijkstra":"<p class=\"idea\">The shortest path when every edge has a length. Always fix the closest vertex that is not fixed yet.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>Roads have a length, a time or a price: each edge has a <span class=\"term\" data-t=\"weight\">weight<\/span>.<\/li>\n    <li>The statement asks for the <b>minimum total cost<\/b> or the <span class=\"term\" data-t=\"shortest-path\">shortest path<\/span> from one vertex.<\/li>\n    <li>All weights are ≥ 0. (No negative numbers on edges.)<\/li>\n    <li>n and m are up to about 10<sup>5<\/sup> or 2 · 10<sup>5<\/sup>.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — the GPS<\/h3>\n    <p>A GPS knows the time of every road. At the start it knows one thing for sure: your own city is at distance 0.<\/p>\n    <p>Then it repeats one step. Take the <b>closest city that is not fixed yet<\/b>. Its distance is now final, because every other way to it goes through a city that is farther. Look at its roads: maybe they give a shorter way to its neighbours. If yes, write the smaller number.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — from vertex 1<\/h3>\n    <svg viewBox=\"0 0 490 200\" width=\"490\" role=\"img\" aria-label=\"Weighted graph with 5 vertices. Edges: 1-2 weight 4, 1-3 weight 1, 3-2 weight 2, 2-4 weight 5, 3-4 weight 8, 4-5 weight 3. The shortest path from 1 to 5 is 1, 3, 2, 4, 5 with length 11.\">\n      <g stroke=\"var(--line)\" stroke-width=\"2\">\n        <line x1=\"50\" y1=\"100\" x2=\"180\" y2=\"40\"/><line x1=\"180\" y1=\"160\" x2=\"320\" y2=\"100\"/>\n      <\/g>\n      <g stroke=\"var(--accent)\" stroke-width=\"3\">\n        <line x1=\"50\" y1=\"100\" x2=\"180\" y2=\"160\"/><line x1=\"180\" y1=\"160\" x2=\"180\" y2=\"40\"/>\n        <line x1=\"180\" y1=\"40\" x2=\"320\" y2=\"100\"/><line x1=\"320\" y1=\"100\" x2=\"440\" y2=\"100\"/>\n      <\/g>\n      <g fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.5\">\n        <circle cx=\"50\" cy=\"100\" r=\"16\"/><circle cx=\"180\" cy=\"40\" r=\"16\"/><circle cx=\"180\" cy=\"160\" r=\"16\"/>\n        <circle cx=\"320\" cy=\"100\" r=\"16\"/><circle cx=\"440\" cy=\"100\" r=\"16\"/>\n      <\/g>\n      <g fill=\"currentColor\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">\n        <text x=\"50\" y=\"105\">1<\/text><text x=\"180\" y=\"45\">2<\/text><text x=\"180\" y=\"165\">3<\/text>\n        <text x=\"320\" y=\"105\">4<\/text><text x=\"440\" y=\"105\">5<\/text>\n      <\/g>\n      <g fill=\"currentColor\" font-size=\"13\" text-anchor=\"middle\">\n        <text x=\"106\" y=\"60\">4<\/text><text x=\"106\" y=\"148\">1<\/text><text x=\"168\" y=\"105\">2<\/text>\n        <text x=\"258\" y=\"60\">5<\/text><text x=\"258\" y=\"148\">8<\/text><text x=\"380\" y=\"92\">3<\/text>\n      <\/g>\n    <\/svg>\n    <p>The <span class=\"term\" data-t=\"priority-queue\">priority queue<\/span> holds pairs (distance, vertex). It always gives the pair with the smallest distance.<\/p>\n    <table>\n      <tr><th>take (d, v)<\/th><th>what happens<\/th><th>dist[1..5]<\/th><th>queue after<\/th><\/tr>\n      <tr><td>start<\/td><td>dist[1] = 0<\/td><td>0 ∞ ∞ ∞ ∞<\/td><td>(0,1)<\/td><\/tr>\n      <tr><td>(0,1)<\/td><td>2 gets 0+4 = 4, 3 gets 0+1 = 1<\/td><td>0 4 1 ∞ ∞<\/td><td>(1,3) (4,2)<\/td><\/tr>\n      <tr><td>(1,3)<\/td><td>2 gets 1+2 = 3 (better than 4), 4 gets 1+8 = 9<\/td><td>0 3 1 9 ∞<\/td><td>(3,2) (4,2) (9,4)<\/td><\/tr>\n      <tr><td>(3,2)<\/td><td>4 gets 3+5 = 8 (better than 9)<\/td><td>0 3 1 8 ∞<\/td><td>(4,2) (8,4) (9,4)<\/td><\/tr>\n      <tr><td>(4,2)<\/td><td>4 &gt; dist[2] = 3 → old pair, skip<\/td><td>0 3 1 8 ∞<\/td><td>(8,4) (9,4)<\/td><\/tr>\n      <tr><td>(8,4)<\/td><td>5 gets 8+3 = 11<\/td><td>0 3 1 8 11<\/td><td>(9,4) (11,5)<\/td><\/tr>\n      <tr><td>(9,4)<\/td><td>9 &gt; dist[4] = 8 → old pair, skip<\/td><td>0 3 1 8 11<\/td><td>(11,5)<\/td><\/tr>\n      <tr><td>(11,5)<\/td><td>no better way → queue empty, stop<\/td><td class=\"hi\">0 3 1 8 11<\/td><td>empty<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">The direct road 1–2 costs 4, but 1 → 3 → 2 costs only 3. The thick lines show the shortest path to 5: 1 → 3 → 2 → 4 → 5 = 11.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — distance and the path<\/h3>\n    <p>This program solves the classic problem \"Dijkstra?\" (20C): print the shortest path from 1 to n, or −1. To print a path, remember for each vertex <b>where you came from<\/b>: <code>parent[to] = v<\/code>. At the end walk back from n to 1.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nconst long long INF = 1e18;                      // \"no path yet\"\n\nint main() {\n    int n, m;\n    cin &gt;&gt; n &gt;&gt; m;\n    vector&lt;vector&lt;pair&lt;int, long long&gt;&gt;&gt; g(n + 1);   // {neighbour, weight}\n    for (int i = 0; i &lt; m; i++) {\n        int a, b;\n        long long w;\n        cin &gt;&gt; a &gt;&gt; b &gt;&gt; w;\n        g[a].push_back({b, w});\n        g[b].push_back({a, w});\n    }\n\n    vector&lt;long long&gt; dist(n + 1, INF);\n    vector&lt;int&gt; parent(n + 1, 0);\n    // pairs {distance, vertex}; \"greater\" puts the SMALLEST distance on top\n    priority_queue&lt;pair&lt;long long, int&gt;, vector&lt;pair&lt;long long, int&gt;&gt;,\n                   greater&lt;pair&lt;long long, int&gt;&gt;&gt; pq;\n    dist[1] = 0;\n    pq.push({0, 1});\n    while (!pq.empty()) {\n        long long d = pq.top().first;\n        int v = pq.top().second;\n        pq.pop();\n        if (d &gt; dist[v]) continue;               // old pair: v has a better distance now\n        for (auto edge : g[v]) {\n            int to = edge.first;\n            long long w = edge.second;\n            if (dist[v] + w &lt; dist[to]) {        // a shorter way to \"to\", through v\n                dist[to] = dist[v] + w;\n                parent[to] = v;\n                pq.push({dist[to], to});\n            }\n        }\n    }\n\n    if (dist[n] == INF) {                        // n is not reachable\n        cout &lt;&lt; -1 &lt;&lt; \"\\n\";\n        return 0;\n    }\n    vector&lt;int&gt; path;\n    for (int v = n; v != 0; v = parent[v]) path.push_back(v);   // n, ..., 1\n    reverse(path.begin(), path.end());\n    for (int v : path) cout &lt;&lt; v &lt;&lt; \" \";\n    cout &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p class=\"note\">Why <code>if (d &gt; dist[v]) continue;<\/code>? When a distance gets better, you push a new pair. The old pair stays in the queue. This line throws old pairs away. Without it the code can be very slow.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"tip-box\"><b>Which tool?<\/b> No weights (every edge costs 1) → <a href=\"#graphs-bfs-dfs\">BFS<\/a>, it is simpler and faster. Weights ≥ 0 → Dijkstra. Negative weights → Dijkstra is wrong; you need Bellman-Ford (see <a href=\"#what-next\">After 1600<\/a>).<\/p>\n\n<p class=\"complexity\">Speed: O((n + m) log n). Fine for n and m up to a few 10^5.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li><code>dist<\/code> is <code>int<\/code>. A path can be 10<sup>5<\/sup> edges × 10<sup>9<\/sup> = 10<sup>14<\/sup>. Use <code>long long<\/code> and INF = 10<sup>18<\/sup>.<\/li>\n    <li>No <code>greater&lt;…&gt;<\/code>. Then the queue gives the <b>biggest<\/b> distance first: the answer can still be right, but it is far too slow.<\/li>\n    <li>The pair is in the wrong order. Put the distance <b>first<\/b>: pairs are compared by the first number.<\/li>\n    <li>You forget the line <code>if (d &gt; dist[v]) continue;<\/code> → time limit exceeded on big tests.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a href=\"https://cses.fi/problemset/task/1671\">CSES: Shortest Routes I<\/a><span class=\"r\">CSES<\/span> — start here. Pure Dijkstra on a directed graph: print all distances.<\/li>\n    <li><a class=\"cf\" data-p=\"198B\">Jumping on Walls<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"601A\">The Two Routes<\/a><span class=\"r\">1600<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1915G\">Bicycles<\/a><span class=\"r\">1800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"20C\">Dijkstra?<\/a><span class=\"r\">1900<\/span><\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1195\">CSES: Flight Discount<\/a><span class=\"r\">CSES<\/span> — harder: run Dijkstra two times, from the start and from the end.<\/li>\n  <\/ol>\n  <p class=\"note\">\"Dijkstra?\" is the direct exercise for this page. Its rating is high only because you must print the path. The first two Codeforces problems need only BFS: use them to check that you pick the right tool. Pure Dijkstra problems are rare below 1700, so CSES is the best place to train.<\/p>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/gold/shortest-paths\">USACO Guide: Shortest Paths<\/a> — Dijkstra with a clear animation and problems.<\/li>\n    <li><a href=\"https://cp-algorithms.com/graph/dijkstra_sparse.html\">cp-algorithms: Dijkstra<\/a> — reference text with the same priority queue code.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book, chapter 13 \"Shortest paths\" (also Bellman-Ford).<\/li>\n    <li><a href=\"https://www.youtube.com/@ArabicCompetitiveProgramming\">Arabic videos<\/a> — shortest path lessons by Mostafa Saad.<\/li>\n  <\/ul>\n<\/section>\n","trees":"<p class=\"idea\">A tree is a
