connected graph with no cycle. One DFS from the root answers most tree questions.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>\"n vertices and <b>n − 1 edges<\/b>\", and the graph is <span class=\"term\" data-t=\"connected\">connected<\/span>.<\/li>\n    <li>\"There is <b>exactly one path<\/b> between every two vertices.\"<\/li>\n    <li>\"The <span class=\"term\" data-t=\"parent\">parent<\/span> of vertex i is p<sub>i<\/sub>\", or a boss and workers, or folders inside folders.<\/li>\n    <li>Words like <span class=\"term\" data-t=\"root\">root<\/span>, <span class=\"term\" data-t=\"leaf\">leaf<\/span>, <span class=\"term\" data-t=\"subtree\">subtree<\/span>.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — a company<\/h3>\n    <p>A company has one director. This is the <b>root<\/b>. Every other person has exactly one boss: the <b>parent<\/b>. The people directly under you are your <span class=\"term\" data-t=\"child\">children<\/span>. A person with no workers is a <b>leaf<\/b>.<\/p>\n    <p>Your <span class=\"term\" data-t=\"depth\">depth<\/span> is the number of bosses above you. Your <b>subtree<\/b> is you and everybody under you. A <span class=\"term\" data-t=\"tree\">tree<\/span> has no <span class=\"term\" data-t=\"cycle\">cycle<\/span>: nobody is the boss of their own boss.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — depth and subtree size<\/h3>\n    <svg viewBox=\"0 0 520 290\" width=\"520\" role=\"img\" aria-label=\"Rooted tree with 7 vertices. Root 1 has children 2 and 3. Vertex 2 has children 4 and 5. Vertex 3 has child 6. Vertex 6 has child 7. Each vertex shows its depth d and its subtree size s.\">\n      <g stroke=\"var(--line)\" stroke-width=\"2\">\n        <line x1=\"250\" y1=\"34\" x2=\"140\" y2=\"104\"/><line x1=\"250\" y1=\"34\" x2=\"360\" y2=\"104\"/>\n        <line x1=\"140\" y1=\"104\" x2=\"80\" y2=\"174\"/><line x1=\"140\" y1=\"104\" x2=\"200\" y2=\"174\"/>\n        <line x1=\"360\" y1=\"104\" x2=\"360\" y2=\"174\"/><line x1=\"360\" y1=\"174\" x2=\"360\" y2=\"244\"/>\n      <\/g>\n      <g fill=\"var(--surface)\" stroke=\"currentColor\" stroke-width=\"1.5\">\n        <circle cx=\"250\" cy=\"34\" r=\"16\" stroke=\"var(--accent)\" stroke-width=\"3\"/>\n        <circle cx=\"140\" cy=\"104\" r=\"16\"/><circle cx=\"360\" cy=\"104\" r=\"16\"/>\n        <circle cx=\"80\" cy=\"174\" r=\"16\"/><circle cx=\"200\" cy=\"174\" r=\"16\"/><circle cx=\"360\" cy=\"174\" r=\"16\"/>\n        <circle cx=\"360\" cy=\"244\" r=\"16\"/>\n      <\/g>\n      <g fill=\"currentColor\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\">\n        <text x=\"250\" y=\"39\">1<\/text><text x=\"140\" y=\"109\">2<\/text><text x=\"360\" y=\"109\">3<\/text>\n        <text x=\"80\" y=\"179\">4<\/text><text x=\"200\" y=\"179\">5<\/text><text x=\"360\" y=\"179\">6<\/text><text x=\"360\" y=\"249\">7<\/text>\n      <\/g>\n      <g fill=\"var(--muted)\" font-size=\"12\">\n        <text x=\"274\" y=\"38\">root · d=0 s=7<\/text>\n        <text x=\"118\" y=\"108\" text-anchor=\"end\">d=1 s=3<\/text><text x=\"384\" y=\"108\">d=1 s=3<\/text>\n        <text x=\"80\" y=\"210\" text-anchor=\"middle\">leaf · d=2 s=1<\/text><text x=\"200\" y=\"210\" text-anchor=\"middle\">leaf · d=2 s=1<\/text>\n        <text x=\"384\" y=\"178\">d=2 s=2<\/text><text x=\"384\" y=\"248\">leaf · d=3 s=1<\/text>\n      <\/g>\n    <\/svg>\n    <p><b>d<\/b> = depth, <b>s<\/b> = size of the subtree. Two directions of information:<\/p>\n    <table>\n      <tr><th>Value<\/th><th>Direction<\/th><th>Rule<\/th><th>Example<\/th><\/tr>\n      <tr><td>depth<\/td><td>goes <b>down<\/b>: parent → child<\/td><td>depth[child] = depth[parent] + 1<\/td><td>depth[7] = depth[6] + 1 = 3<\/td><\/tr>\n      <tr><td>size<\/td><td>comes <b>up<\/b>: children → parent<\/td><td>size[v] = 1 + sizes of all children<\/td><td>size[2] = 1 + 1 + 1 = 3<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">Set \"down\" values <b>before<\/b> the call to the child. Collect \"up\" values <b>after<\/b> the call returns.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — one DFS<\/h3>\n    <p>The input is n, then n − 1 edges. The root is vertex 1. A tree has no cycle, so you need no visited array: just do not walk back to the parent.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nvector&lt;vector&lt;int&gt;&gt; g;\nvector&lt;int&gt; depth, sz;\n\nvoid dfs(int v, int parent) {\n    sz[v] = 1;                           // v itself\n    for (int to : g[v]) {\n        if (to == parent) continue;      // do not go back up\n        depth[to] = depth[v] + 1;        // going down: before the call\n        dfs(to, v);\n        sz[v] += sz[to];                 // coming up: after the call\n    }\n}\n\nint main() {\n    int n;\n    cin &gt;&gt; n;\n    g.assign(n + 1, vector&lt;int&gt;());\n    depth.assign(n + 1, 0);\n    sz.assign(n + 1, 0);\n    for (int i = 0; i &lt; n - 1; i++) {    // a tree has n - 1 edges\n        int a, b;\n        cin &gt;&gt; a &gt;&gt; b;\n        g[a].push_back(b);\n        g[b].push_back(a);\n    }\n    dfs(1, 0);                           // the root has no parent: use 0\n    for (int v = 1; v &lt;= n; v++)\n        cout &lt;&lt; v &lt;&lt; \": depth \" &lt;&lt; depth[v] &lt;&lt; \", size \" &lt;&lt; sz[v] &lt;&lt; \"\\n\";\n}\n<\/code><\/pre>\n    <p>The other input form gives the parent of each vertex 2..n. Then you add edges from parent to child only, and the <code>if (to == parent)<\/code> line is not needed:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nfor (int v = 2; v &lt;= n; v++) {\n    int p;\n    cin &gt;&gt; p;                 // p is the parent of v\n    g[p].push_back(v);        // g[p] = children of p\n}\n<\/code><\/pre>\n    <p class=\"note\">A vertex v is a leaf when it has no children: <code>sz[v] == 1<\/code>.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"tip-box\"><b>Diameter<\/b> = the longest path in the tree. Run <a href=\"#graphs-bfs-dfs\">BFS<\/a> from any vertex and take the farthest vertex <code>a<\/code>. Run BFS again from <code>a<\/code> and take the farthest vertex <code>b<\/code>. The <span class=\"term\" data-t=\"diameter\">diameter<\/span> is the path from a to b, and its length is <code>dist[b]<\/code>.<\/p>\n\n<p class=\"complexity\">Speed: O(n). The DFS enters every vertex once.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>You read n edges. A tree has <b>n − 1<\/b> edges.<\/li>\n    <li>You forget <code>if (to == parent) continue;<\/code> → the DFS jumps between two vertices forever.<\/li>\n    <li>You think the root is always 1, or that the edge \"a b\" means a is the parent. Read the statement.<\/li>\n    <li>You use <code>sz[v]<\/code> before the calls to the children are finished. \"Up\" values are ready only after the loop.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"115A\">Party<\/a><span class=\"r\">900<\/span><\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1674\">CSES: Subordinates<\/a><span class=\"r\">CSES<\/span> — subtree sizes from a parent array. The code above, almost unchanged.<\/li>\n    <li><a class=\"cf\" data-p=\"913B\">Christmas Spruce<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1843D\">Apple Tree<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1676G\">White-Black Balanced Subtrees<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1131\">CSES: Tree Diameter<\/a><span class=\"r\">CSES<\/span> — the two-BFS trick.<\/li>\n    <li><a class=\"cf\" data-p=\"1143C\">Queen<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"580C\">Kefa and Park<\/a><span class=\"r\">1500<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1336A\">Linova and Kingdom<\/a><span class=\"r\">1600<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/silver/intro-tree\">USACO Guide: Introduction to Tree Algorithms<\/a> — subtree sizes, depth and diameter with pictures.<\/li>\n    <li><a href=\"https://cses.fi/problemset/\">CSES Problem Set<\/a> — the \"Tree Algorithms\" section. The first four problems fit this page.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book, chapter 14 \"Tree algorithms\".<\/li>\n  <\/ul>\n<\/section>\n","dsu":"<p class=\"idea\">Keep items in groups. Two fast operations: \"which group is x in?\" and \"join these two groups into one\".<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>Things are joined step by step: roads are built, friends are added, groups <span class=\"term\" data-t=\"merge\">merge<\/span>. Nothing is ever removed.<\/li>\n    <li>The question is \"are a and b in the same group?\" or \"how many groups are there now?\"<\/li>\n    <li>You must count the <span class=\"term\" data-t=\"connected-component\">connected components<\/span> of a graph, or find the size of each one.<\/li>\n    <li>You must know if a new <span class=\"term\" data-t=\"edge\">edge<\/span> makes a <span class=\"term\" data-t=\"cycle\">cycle<\/span>.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — companies and bosses<\/h3>\n    <p>There are n small companies. Each company has one person, and this person is the boss. Sometimes two companies join. Then the boss of the smaller company gets a new boss: the boss of the bigger company.<\/p>\n    <p>\"Are Ali and Sara in the same company?\" Ask Ali: \"who is your boss?\" Then ask that boss, and go up until you reach the top boss. Do the same for Sara. Same top boss → same company. The top boss is the <span class=\"term\" data-t=\"leader\">leader<\/span> of the group.<\/p>\n    <p><code>find(x)<\/code> = the top boss of x. <code>unite(a, b)<\/code> = join the two companies.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — the parent array for 5 items<\/h3>\n    <p><code>parent[x]<\/code> is the boss of x. A leader is its own boss: <code>parent[x] == x<\/code>. At the start everybody is alone.<\/p>\n    <table>\n      <tr><th>operation<\/th><th>parent[1]<\/th><th>parent[2]<\/th><th>parent[3]<\/th><th>parent[4]<\/th><th>parent[5]<\/th><th>groups<\/th><\/tr>\n      <tr><td>start<\/td><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>{1} {2} {3} {4} {5}<\/td><\/tr>\n      <tr><td>unite(1, 2)<\/td><td>1<\/td><td class=\"hi\">1<\/td><td>3<\/td><td>4<\/td><td>5<\/td><td>{1,2} {3} {4} {5}<\/td><\/tr>\n      <tr><td>unite(3, 4)<\/td><td>1<\/td><td>1<\/td><td>3<\/td><td class=\"hi\">3<\/td><td>5<\/td><td>{1,2} {3,4} {5}<\/td><\/tr>\n      <tr><td>unite(2, 4)<\/td><td>1<\/td><td>1<\/td><td class=\"hi\">1<\/td><td>3<\/td><td>5<\/td><td>{1,2,3,4} {5}<\/td><\/tr>\n      <tr><td>find(4)<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td class=\"hi\">1<\/td><td>5<\/td><td>answer 1<\/td><\/tr>\n      <tr><td>unite(1, 4)<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>1<\/td><td>5<\/td><td>same leader → nothing to do<\/td><\/tr>\n    <\/table>\n    <p><code>unite(2, 4)<\/code> does not join 2 and 4. It joins their leaders: 1 and 3. So leader 3 gets the boss 1.<\/p>\n    <p class=\"note\"><span class=\"term\" data-t=\"path-compression\">Path compression<\/span>: <code>find(4)<\/code> walks 4 → 3 → 1. On the way back it sets <code>parent[4] = 1<\/code>. Next time the walk is one step. This small trick makes DSU very fast.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — a small struct you can reuse<\/h3>\n<pre data-part=\"global\"><code class=\"cpp\">\nstruct DSU {\n    vector&lt;int&gt; parent, sz;                 // sz[leader] = size of its group\n    DSU(int n) : parent(n + 1), sz(n + 1, 1) {\n        for (int i = 0; i &lt;= n; i++) parent[i] = i;   // everybody is alone\n    }\n    int find(int x) {                       // the leader of x\n        if (parent[x] == x) return x;\n        return parent[x] = find(parent[x]); // path compression\n    }\n    bool unite(int a, int b) {              // false = they were already together\n        a = find(a); b = find(b);\n        if (a == b) return false;\n        if (sz[a] &lt; sz[b]) swap(a, b);      // a is the bigger group\n        parent[b] = a;                      // small group goes under the big one\n        sz[a] += sz[b];\n        return true;\n    }\n};\n<\/code><\/pre>\n    <p>A full program. Input: n cities, m roads, then q questions \"can you go from a to b?\".<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nstruct DSU {                                // the same struct as above\n    vector&lt;int&gt; parent, sz;\n    DSU(int n) : parent(n + 1), sz(n + 1, 1) {\n        for (int i = 0; i &lt;= n; i++) parent[i] = i;\n    }\n    int find(int x) { return parent[x] == x ? x : parent[x] = find(parent[x]); }\n    bool unite(int a, int b) {\n        a = find(a); b = find(b);\n        if (a == b) return false;\n        if (sz[a] &lt; sz[b]) swap(a, b);\n        parent[b] = a; sz[a] += sz[b];\n        return true;\n    }\n};\n\nint main() {\n    int n, m;\n    cin &gt;&gt; n &gt;&gt; m;\n    DSU d(n);\n    int groups = n;                         // n cities, all alone\n    for (int i = 0; i &lt; m; i++) {\n        int a, b;\n        cin &gt;&gt; a &gt;&gt; b;\n        if (d.unite(a, b)) groups--;        // a real merge: one group less\n    }\n    cout &lt;&lt; groups &lt;&lt; \"\\n\";                 // number of connected components\n    int q;\n    cin &gt;&gt; q;\n    while (q--) {\n        int a, b;\n        cin &gt;&gt; a &gt;&gt; b;\n        cout &lt;&lt; (d.find(a) == d.find(b) ? \"YES\" : \"NO\") &lt;&lt; \"\\n\";\n    }\n}\n<\/code><\/pre>\n    <p class=\"tip-box\">Cycle check: if <code>unite(a, b)<\/code> returns <code>false<\/code>, then a and b were already connected. So the new edge a–b closes a cycle. The size of the group of x is <code>d.sz[d.find(x)]<\/code>.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: almost O(1) for each find and unite. 10<sup>6<\/sup> operations are no problem.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>Comparing <code>parent[a] == parent[b]<\/code>. The parent is not always the leader. Compare <code>find(a) == find(b)<\/code>.<\/li>\n    <li>Writing <code>parent[a] = b<\/code> in unite. You must join the leaders: <code>parent[find(b)] = find(a)<\/code>.<\/li>\n    <li>Reading <code>sz[x]<\/code> for any x. The size is correct only at the leader: <code>sz[find(x)]<\/code>.<\/li>\n    <li>Edges are removed in the problem. DSU cannot split a group. Try to read the operations from the end, so each removal becomes an add.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"217A\">Ice Skating<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1249B2\">Books Exchange (hard version)<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1167C\">News Distribution<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"277A\">Learning Languages<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"771A\">Bear and Friendship Condition<\/a><span class=\"r\">1500<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"977E\">Cyclic Components<\/a><span class=\"r\">1500<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"722C\">Destroying Array<\/a><span class=\"r\">1600<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"25D\">Roads not only in Berland<\/a><span class=\"r\">1900<\/span><\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1676\">CSES: Road Construction<\/a><span class=\"r\">CSES<\/span> — after each new road print the number of groups and the biggest size.<\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://codeforces.com/edu/course/2\">Codeforces EDU<\/a> — free course, open \"Disjoint Sets Union\". Video, text and problems.<\/li>\n    <li><a href=\"https://usaco.guide/\">USACO Guide<\/a> — Gold section, \"Disjoint Set Union\". Clear text with pictures.<\/li>\n    <li><a href=\"#graphs-bfs-dfs\">Graphs: BFS and DFS<\/a> — another way to count components when all edges are known at the start.<\/li>\n    <li><a href=\"#what-next\">After 1600<\/a> — DSU is the heart of Kruskal's algorithm (the cheapest set of roads that connects all cities).<\/li>\n  <\/ul>\n<\/section>\n","toposort":"<p class=\"idea\">Some tasks must come before others. Topological sort puts all tasks in one line so that every rule is respected.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>Rules like \"a must be done before b\": courses with a <span class=\"term\" data-t=\"prerequisite\">prerequisite<\/span>, tasks that depend on other tasks.<\/li>\n    <li>You must print a correct order, or say that no order exists.<\/li>\n    <li>The graph is <span class=\"term\" data-t=\"directed\">directed<\/span> (edges are arrows) and you must check if it has a <span class=\"term\" data-t=\"cycle\">cycle<\/span>.<\/li>\n    <li>You want a DP on a directed graph: longest path, number of paths. First you need a good order.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — getting dressed<\/h3>\n    <p>Socks before shoes. Trousers before shoes and before the belt. Shirt before the belt and before the jacket. Belt before the jacket.<\/p>\n    <p>What can you put on <b>first<\/b>? Only a thing with no rule in front of it: socks, trousers or shirt. Put one on. Now cross out its rules. Maybe a new thing is free now. Repeat until you are dressed.<\/p>\n    <p>If the rules say \"a before b\" and also \"b before a\", nothing is ever free. Then no order exists.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — count the arrows that come in<\/h3>\n    <p>Draw each rule \"a before b\" as an arrow a → b.<\/p>\n    <svg viewBox=\"0 0 500 250\" width=\"500\" role=\"img\" aria-label=\"Directed graph with 6 vertices: 1 to 3, 2 to 3, 2 to 5, 4 to 5, 5 to 6, 4 to 6\">\n      <defs>\n        <marker id=\"ts-arrow\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto\">\n          <path d=\"M0,0 L10,5 L0,10 z\" fill=\"var(--muted)\"/>\n        <\/marker>\n      <\/defs>\n      <g fill=\"none\" stroke=\"var(--muted)\" stroke-width=\"1.5\" marker-end=\"url(#ts-arrow)\">\n        <line x1=\"90\" y1=\"43\" x2=\"246\" y2=\"66\"/>\n        <line x1=\"89\" y1=\"115\" x2=\"247\" y2=\"76\"/>\n        <line x1=\"89\" y1=\"125\" x2=\"247\" y2=\"164\"/>\n        <line x1=\"90\" y1=\"202\" x2=\"246\" y2=\"174\"/>\n        <line x1=\"290\" y1=\"170\" x2=\"426\" y2=\"170\"/>\n        <path d=\"M89,210 Q280,262 429,181\"/>\n      <\/g>\n      <g fill=\"var(--surface)\" stroke=\"var(--accent)\" stroke-width=\"2\">\n        <circle cx=\"70\" cy=\"40\" r=\"18\"/><circle cx=\"70\" cy=\"120\" r=\"18\"/><circle cx=\"70\" cy=\"205\" r=\"18\"/>\n        <circle cx=\"270\" cy=\"70\" r=\"18\"/><circle cx=\"270\" cy=\"170\" r=\"18\"/><circle cx=\"450\" cy=\"170\" r=\"18\"/>\n      <\/g>\n      <g fill=\"currentColor\" font-size=\"15\" font-weight=\"bold\" text-anchor=\"middle\">\n        <text x=\"70\" y=\"45\">1<\/text><text x=\"70\" y=\"125\">2<\/text><text x=\"70\" y=\"210\">4<\/text>\n        <text x=\"270\" y=\"75\">3<\/text><text x=\"270\" y=\"175\">5<\/text><text x=\"450\" y=\"175\">6<\/text>\n      <\/g>\n      <g fill=\"var(--muted)\" font-size=\"13\" text-anchor=\"middle\">\n        <text x=\"70\" y=\"76\">socks<\/text><text x=\"70\" y=\"156\">trousers<\/text><text x=\"70\" y=\"241\">shirt<\/text>\n        <text x=\"270\" y=\"42\">shoes<\/text><text x=\"270\" y=\"142\">belt<\/text><text x=\"450\" y=\"142\">jacket<\/text>\n      <\/g>\n    <\/svg>\n    <p>The <span class=\"term\" data-t=\"in-degree\">in-degree<\/span> of a vertex = how many arrows point to it = how many things must come before it. A vertex with in-degree 0 is free. Free vertices wait in a <span class=\"term\" data-t=\"queue\">queue<\/span>.<\/p>\n    <table>\n      <tr><th>step<\/th><th>take<\/th><th>arrows removed<\/th><th>in-degree of 1 2 3 4 5 6<\/th><th>queue after<\/th><\/tr>\n      <tr><td>start<\/td><td>–<\/td><td>–<\/td><td>0 0 2 0 2 2<\/td><td>1, 2, 4<\/td><\/tr>\n      <tr><td>1<\/td><td class=\"hi\">1<\/td><td>1→3<\/td><td>– 0 1 0 2 2<\/td><td>2, 4<\/td><\/tr>\n      <tr><td>2<\/td><td class=\"hi\">2<\/td><td>2→3, 2→5<\/td><td>– – 0 0 1 2<\/td><td>4, 3<\/td><\/tr>\n      <tr><td>3<\/td><td class=\"hi\">4<\/td><td>4→5, 4→6<\/td><td>– – 0 – 0 1<\/td><td>3, 5<\/td><\/tr>\n      <tr><td>4<\/td><td class=\"hi\">3<\/td><td>none<\/td><td>– – – – 0 1<\/td><td>5<\/td><\/tr>\n      <tr><td>5<\/td><td class=\"hi\">5<\/td><td>5→6<\/td><td>– – – – – 0<\/td><td>6<\/td><\/tr>\n      <tr><td>6<\/td><td class=\"hi\">6<\/td><td>none<\/td><td>– – – – – –<\/td><td>empty<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">The <span class=\"term\" data-t=\"topological-order\">topological order<\/span> is 1 2 4 3 5 6: socks, trousers, shirt, shoes, belt, jacket. Every arrow goes from left to right. Other correct orders exist too, for example 4 2 5 6 1 3.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — Kahn's algorithm<\/h3>\n    <p>Input: n tasks, m rules. Each rule is \"a b\" = a must come before b.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int n, m;\n    cin &gt;&gt; n &gt;&gt; m;\n    vector&lt;vector&lt;int&gt;&gt; adj(n + 1);         // adj[a] = all b with an arrow a -&gt; b\n    vector&lt;int&gt; indeg(n + 1, 0);            // indeg[b] = arrows that point to b\n    for (int i = 0; i &lt; m; i++) {\n        int a, b;\n        cin &gt;&gt; a &gt;&gt; b;\n        adj[a].push_back(b);\n        indeg[b]++;\n    }\n    queue&lt;int&gt; q;\n    for (int v = 1; v &lt;= n; v++)\n        if (indeg[v] == 0) q.push(v);       // free at the start\n    vector&lt;int&gt; order;\n    while (!q.empty()) {\n        int v = q.front(); q.pop();\n        order.push_back(v);                 // do task v now\n        for (int to : adj[v]) {             // remove the arrows that leave v\n            indeg[to]--;\n            if (indeg[to] == 0) q.push(to); // \"to\" is free now\n        }\n    }\n    if ((int)order.size() &lt; n) {            // some tasks never became free\n        cout &lt;&lt; \"IMPOSSIBLE\\n\";             // -&gt; there is a cycle\n    } else {\n        for (int v : order) cout &lt;&lt; v &lt;&lt; \" \";\n        cout &lt;&lt; \"\\n\";\n    }\n}\n<\/code><\/pre>\n    <p class=\"tip-box\">DP on the order: go through <code>order<\/code> from left to right. When you reach v, all vertices before v are finished. So <code>best[to] = max(best[to], best[v] + 1)<\/code> gives the longest path. Need the smallest order in the dictionary? Use a <code>priority_queue<\/code> with <code>greater&lt;int&gt;<\/code> in place of the queue.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: O(n + m). Every vertex enters the queue once, every arrow is removed once.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>The arrow in the wrong direction. \"b needs a\" means a → b. Read the statement twice.<\/li>\n    <li>No cycle check. Always compare <code>order.size()<\/code> with n before you print.<\/li>\n    <li>Using it on a graph without directions. Topological sort is only for directed graphs.<\/li>\n    <li>Thinking the order is unique. Often many orders are correct. If your output differs from the sample, it can still be right.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a href=\"https://cses.fi/problemset/task/1679\">CSES: Course Schedule<\/a><span class=\"r\">CSES<\/span> — start here. It is exactly the program above.<\/li>\n    <li><a class=\"cf\" data-p=\"1851E\">Nastya and Potions<\/a><span class=\"r\">1500<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"510C\">Fox And Names<\/a><span class=\"r\">1600<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1593E\">Gardener and Tree<\/a><span class=\"r\">1600<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"919D\">Substring<\/a><span class=\"r\">1700<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1572A\">Book<\/a><span class=\"r\">1800<\/span><\/li>\n    <li><a href=\"https://cses.fi/problemset/\">CSES: Longest Flight Route<\/a><span class=\"r\">CSES<\/span> — find it in the \"Graph Algorithms\" list. DP on the order.<\/li>\n  <\/ol>\n  <p class=\"note\">Gardener and Tree has no arrows. But it uses the same idea: a queue of vertices whose degree became small.<\/p>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/\">USACO Guide<\/a> — Gold section, \"Topological Sort\". Shows the DFS way too.<\/li>\n    <li><a href=\"https://cp-algorithms.com/\">cp-algorithms<\/a> — open Graphs → \"Topological Sorting\". Short text and code.<\/li>\n    <li><a href=\"#graphs-bfs-dfs\">Graphs: BFS and DFS<\/a> — read it first if <code>adj<\/code> and the queue are new for you.<\/li>\n  <\/ul>\n<\/section>\n","combinatorics":"<p class=\"idea\">Count the ways without listing them. Multiply for \"and\", add for \"or\", and use nCr to choose r things from n.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>\"How many ways…\", \"count the number of…\", and the answer is huge.<\/li>\n    <li>\"Print the answer <span class=\"term\" data-t=\"modulo\">modulo<\/span> 10<sup>9<\/sup>+7\" (or 998244353).<\/li>\n    <li>You choose some items from many, and the order of the chosen items does not matter.<\/li>\n    <li>You count pairs: n items give <code>n·(n−1)/2<\/code> pairs.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — clothes and pizza<\/h3>\n    <p><b>Rule of product (\"and\" → multiply).<\/b> You have 3 shirts and 2 trousers. You wear one shirt <b>and<\/b> one pair of trousers: 3 × 2 = 6 ways.<\/p>\n    <p><b>Rule of sum (\"or\" → add).<\/b> You go to school by one of 3 buses <b>or<\/b> one of 2 trains: 3 + 2 = 5 ways.<\/p>\n    <p><b><span class=\"term\" data-t=\"factorial\">Factorial<\/span>.<\/b> 3 friends stand in a line: 3 choices for the first place, then 2, then 1. So 3 × 2 × 1 = 6 ways. This is <code>3!<\/code>. In general <code>n! = 1 × 2 × … × n<\/code>, and <code>0! = 1<\/code>.<\/p>\n    <p><b>nCr.<\/b> A pizza shop has 4 toppings: Cheese, Olives, Mushrooms, Tomato. You choose 2. Order does not matter (CO is the same pizza as OC). List them: CO, CM, CT, OM, OT, MT → <b>6 ways<\/b>.<\/p>\n    <p>This number is called C(n, r) or nCr, a <span class=\"term\" data-t=\"combination\">combination<\/span>: <code>C(n, r) = n! / (r! · (n−r)!)<\/code>. Check: C(4, 2) = 24 / (2 · 2) = 6.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — Pascal's triangle<\/h3>\n    <p>Row n, column r holds C(n, r). Each number is the sum of two numbers in the row above: the one above it and the one above-left.<\/p>\n    <table>\n      <tr><th>n \\ r<\/th><th>0<\/th><th>1<\/th><th>2<\/th><th>3<\/th><th>4<\/th><th>5<\/th><\/tr>\n      <tr><th>0<\/th><td>1<\/td><td><\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n      <tr><th>1<\/th><td>1<\/td><td>1<\/td><td><\/td><td><\/td><td><\/td><td><\/td><\/tr>\n      <tr><th>2<\/th><td>1<\/td><td>2<\/td><td>1<\/td><td><\/td><td><\/td><td><\/td><\/tr>\n      <tr><th>3<\/th><td>1<\/td><td class=\"hi\">3<\/td><td class=\"hi\">3<\/td><td>1<\/td><td><\/td><td><\/td><\/tr>\n      <tr><th>4<\/th><td>1<\/td><td>4<\/td><td class=\"hi\">6<\/td><td>4<\/td><td>1<\/td><td><\/td><\/tr>\n      <tr><th>5<\/th><td>1<\/td><td>5<\/td><td>10<\/td><td>10<\/td><td>5<\/td><td>1<\/td><\/tr>\n    <\/table>\n    <p><code>C(n, r) = C(n−1, r−1) + C(n−1, r)<\/code>. Here C(4, 2) = 3 + 3 = 6.<\/p>\n    <p class=\"note\">Why? Look at the last item. Take it: choose r−1 more from the other n−1. Or leave it: choose all r from the other n−1. \"Or\" → add.<\/p>\n    <p>For n up to about 2000, fill this table. No division is needed:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\n// before main:  const int MOD = 1e9 + 7;  long long C[2001][2001];   (all zeros)\nfor (int n = 0; n &lt;= 2000; n++) {\n    C[n][0] = 1;                                         // choose nothing: 1 way\n    for (int r = 1; r &lt;= n; r++)\n        C[n][r] = (C[n - 1][r - 1] + C[n - 1][r]) % MOD;\n}\n<\/code><\/pre>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — nCr mod p for big n<\/h3>\n    <p>For n up to 10<sup>5<\/sup> or 10<sup>6<\/sup> the table is too big. Use the formula with factorials. But you cannot divide under mod. You multiply by the <span class=\"term\" data-t=\"modular-inverse\">modular inverse<\/span>.<\/p>\n    <p>When p is <span class=\"term\" data-t=\"prime\">prime<\/span>, the inverse of a is <code>a<sup>p−2<\/sup> mod p<\/code> (Fermat). Compute it with fast power from <a href=\"#modular\">Mod and fast power<\/a>.<\/p>\n    <p>So <span class=\"term\" data-t=\"precompute\">precompute<\/span> <code>fact[i] = i!<\/code> and <code>invfact[i]<\/code> = inverse of i!. Then <code>C(n, r) = fact[n] · invfact[r] · invfact[n−r]<\/code>.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nconst int MOD = 1e9 + 7;                    // a prime\nconst int MAXN = 200000;                    // the biggest n you need\nlong long fact[MAXN + 1], invfact[MAXN + 1];\n\nlong long power(long long a, long long b) { // a^b mod MOD, fast\n    long long res = 1;\n    a %= MOD;\n    while (b &gt; 0) {\n        if (b % 2 == 1) res = res * a % MOD;\n        a = a * a % MOD;\n        b /= 2;\n    }\n    return res;\n}\n\nlong long C(int n, int r) {                 // ways to choose r from n\n    if (r &lt; 0 || r &gt; n) return 0;           // impossible choice: 0 ways\n    return fact[n] * invfact[r] % MOD * invfact[n - r] % MOD;\n}\n\nint main() {\n    fact[0] = 1;\n    for (int i = 1; i &lt;= MAXN; i++) fact[i] = fact[i - 1] * i % MOD;\n    invfact[MAXN] = power(fact[MAXN], MOD - 2);          // one inverse by Fermat\n    for (int i = MAXN; i &gt;= 1; i--)                      // 1/(i-1)! = 1/i! * i\n        invfact[i - 1] = invfact[i] * i % MOD;\n\n    int q;\n    cin &gt;&gt; q;\n    while (q--) {\n        int n, r;\n        cin &gt;&gt; n &gt;&gt; r;\n        cout &lt;&lt; C(n, r) &lt;&lt; \"\\n\";            // \"5 2\" -&gt; 10,  \"10 3\" -&gt; 120\n    }\n}\n<\/code><\/pre>\n    <p class=\"tip-box\">Three numbers to remember. Pairs from n items: <code>n·(n−1)/2<\/code> (this is C(n, 2)). <span class=\"term\" data-t=\"subset\">Subsets<\/span> of n items: <code>2<sup>n<\/sup><\/code> (each item is in or out). Orders of n items: <code>n!<\/code>.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: O(MAXN) once to precompute, then O(1) for each C(n, r). Pascal's table: O(n²).<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>Dividing under mod: <code>fact[n] / fact[r] % MOD<\/code> is wrong. Multiply by the inverse.<\/li>\n    <li>Forgetting <code>% MOD<\/code> after <b>each<\/b> multiplication. Three numbers multiplied together <span class=\"term\" data-t=\"overflow\">overflow<\/span> <code>long long<\/code>.<\/li>\n    <li>No check for <code>r &lt; 0<\/code> or <code>r &gt; n<\/code>. Then you read outside the array.<\/li>\n    <li>Arrays too small, or <code>n·(n−1)/2<\/code> in <code>int<\/code>. For n = 200 000 the number of pairs is 2·10<sup>10<\/sup>: use <code>long long<\/code>.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"630C\">Lucky Numbers<\/a><span class=\"r\">1100<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1272C\">Yet Another Broken Keyboard<\/a><span class=\"r\">1200<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"459B\">Pashmak and Flowers<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1475C\">Ball in Berland<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1391C\">Cyclic Permutations<\/a><span class=\"r\">1500<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1475E\">Advertising Agency<\/a><span class=\"r\">1600<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1288C\">Two Arrays<\/a><span class=\"r\">1600<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"300C\">Beautiful Numbers<\/a><span class=\"r\">1800<\/span><\/li>\n    <li><a href=\"https://cses.fi/problemset/task/1079\">CSES: Binomial Coefficients<\/a><span class=\"r\">CSES<\/span> — the program above with <code>MAXN = 1000000<\/code>.<\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/\">USACO Guide<\/a> — Gold section, \"Combinatorics\". nCr, inverses and solved examples.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book, chapter 22 \"Combinatorics\".<\/li>\n    <li><a href=\"https://cp-algorithms.com/\">cp-algorithms<\/a> — open Combinatorics → \"Binomial Coefficients\".<\/li>\n    <li><a href=\"https://www.youtube.com/@ArabicCompetitiveProgramming\">Arabic videos<\/a> — lessons by Mostafa Saad, look for the counting videos.<\/li>\n  <\/ul>\n<\/section>\n","interactive":"<p class=\"idea\">Your program talks with the judge. You print a question, the judge answers, and you use the answer to choose the next question.<\/p>\n\n<section class=\"spot\">\n  <h2>Spot it<\/h2>\n  <ul>\n    <li>The statement says \"This is an <span class=\"term\" data-t=\"interactive\">interactive<\/span> problem\".<\/li>\n    <li>Something is hidden: a number, an array, a position. You do not get it in the input.<\/li>\n    <li>You may ask questions in a fixed format, like <code>? x<\/code>, and print the answer like <code>! x<\/code>.<\/li>\n    <li>There is a limit: \"at most 7 questions\", \"at most 20 <span class=\"term\" data-t=\"query\">queries<\/span>\".<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — the guessing game with a real person<\/h3>\n    <p>Remember the guessing game from <a href=\"#binary-search\">Binary search<\/a>. Now your friend really sits in front of you. You say a number. You <b>wait<\/b>. Your friend answers. Only then you say the next number.<\/p>\n    <p>One danger: you write your question on paper but keep the paper in your pocket. Your friend waits for you, you wait for your friend, for ever. In C++ the \"pocket\" is the output buffer. To <span class=\"term\" data-t=\"flush\">flush<\/span> = to give the paper to your friend now.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — one dialogue<\/h3>\n    <p>The judge hides a number from 1 to 100 (here: 37). You print <code>? q<\/code>. The judge answers <code>1<\/code> if the hidden number is ≥ q, and <code>0<\/code> if it is smaller. You have 7 questions.<\/p>\n    <table>\n      <tr><th>#<\/th><th>you print<\/th><th>judge answers<\/th><th>what you know now<\/th><\/tr>\n      <tr><td>1<\/td><td><code>? 51<\/code><\/td><td>0<\/td><td>1 … 50<\/td><\/tr>\n      <tr><td>2<\/td><td><code>? 26<\/code><\/td><td>1<\/td><td>26 … 50<\/td><\/tr>\n      <tr><td>3<\/td><td><code>? 38<\/code><\/td><td>0<\/td><td>26 … 37<\/td><\/tr>\n      <tr><td>4<\/td><td><code>? 32<\/code><\/td><td>1<\/td><td>32 … 37<\/td><\/tr>\n      <tr><td>5<\/td><td><code>? 35<\/code><\/td><td>1<\/td><td>35 … 37<\/td><\/tr>\n      <tr><td>6<\/td><td><code>? 36<\/code><\/td><td>1<\/td><td>36 … 37<\/td><\/tr>\n      <tr><td>7<\/td><td><code>? 37<\/code><\/td><td>1<\/td><td>37 … 37<\/td><\/tr>\n      <tr><td>end<\/td><td class=\"hi\"><code>! 37<\/code><\/td><td>–<\/td><td>finished; the last line is not a question<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">Each question cuts the range in half. 100 → 50 → 25 → 13 → 7 → 4 → 2 → 1: 7 questions are enough. In general you need about log<sub>2<\/sub>(range) questions. Count this <b>before<\/b> you code and compare with the limit.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — binary search that asks the judge<\/h3>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int lo = 1;                             // hidden &gt;= 1 is true for sure\n    int hi = 101;                           // hidden &gt;= 101 is false for sure\n    while (hi - lo &gt; 1) {\n        int mid = lo + (hi - lo) / 2;\n        cout &lt;&lt; \"? \" &lt;&lt; mid &lt;&lt; endl;        // endl = new line + flush\n        int reply;\n        cin &gt;&gt; reply;                       // wait for the judge\n        if (reply == -1) return 0;          // we broke a rule: stop at once\n        if (reply == 1) lo = mid;           // hidden &gt;= mid\n        else            hi = mid;           // hidden &lt; mid\n    }\n    cout &lt;&lt; \"! \" &lt;&lt; lo &lt;&lt; endl;             // the final answer, also with flush\n    return 0;\n}\n<\/code><\/pre>\n    <p>Test it yourself: run the program, think of a number, and type the replies by hand. You are the judge.<\/p>\n    <p class=\"tip-box\"><b>Four rules.<\/b> 1) Flush after every line you print: use <code>endl<\/code>. This is the one place where <code>endl<\/code> is better than <code>\"\\n\"<\/code>. 2) Read the reply before you print the next question. 3) Count your questions. One too many = Wrong answer. 4) If the judge replies <code>-1<\/code> (or what the statement says), exit at once.<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Speed: time is almost never the problem. The real limit is the number of questions.<\/p>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>No flush. The verdict is \"Idleness limit exceeded\": the judge waited for a question that never came.<\/li>\n    <li>Wrong format: <code>?51<\/code> without the space, or a missing <code>!<\/code> before the answer. Copy the format from the statement.<\/li>\n    <li>Many test cases: after <code>! x<\/code> some problems send one more reply to read. Check the statement.<\/li>\n    <li>Thinking the samples are a normal input file. They show a dialogue. Your program must work for any hidden value.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"1807E\">Interview<\/a><span class=\"r\">1300<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"679A\">Bear and Prime 100<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1167B\">Lost Numbers<\/a><span class=\"r\">1400<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1999G1\">Ruler (easy version)<\/a><span class=\"r\">1500<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1520F1\">Guess the K-th Zero (Easy version)<\/a><span class=\"r\">1600<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1486C1\">Guessing the Greatest (easy version)<\/a><span class=\"r\">1600<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://codeforces.com/blog/entry/45307\">Codeforces: guide for interactive problems<\/a> — the official short guide, with flush commands for every language.<\/li>\n    <li><a href=\"#binary-search\">Binary search<\/a> — most interactive problems at this level are a binary search.<\/li>\n  <\/ul>\n<\/section>\n","what-next":"<p class=\"idea\">You finished the guide. Here is a short map of the next topics. Learn one only when a problem asks for it.<\/p>\n\n<section>\n  <h2>The map<\/h2>\n  <p>Three good places to learn. The table says where to look for each topic.<\/p>\n  <ul>\n    <li><b>CPA<\/b> = <a href=\"https://cp-algorithms.com/\">cp-algorithms.com<\/a> — short text and code for almost every algorithm.<\/li>\n    <li><b>USACO<\/b> = <a href=\"https://usaco.guide/\">USACO Guide<\/a> — lessons in order (Silver, Gold, Platinum) with chosen problems.<\/li>\n    <li><b>EDU<\/b> = <a href=\"https://codeforces.com/edu/course/2\">Codeforces EDU<\/a> — free video lessons with practice problems.<\/li>\n  <\/ul>\n  <table>\n    <tr><th>Topic<\/th><th>What it solves<\/th><th>Where to learn<\/th><\/tr>\n    <tr><td><b>Segment tree<\/b><\/td><td>Sum / min / max of a <span class=\"term\" data-t=\"range\">range<\/span> when the array also changes. O(log n) for each operation.<\/td><td>EDU \"Segment Tree\" · CPA: Data Structures<\/td><\/tr>\n    <tr><td><b>Fenwick tree (BIT)<\/b><\/td><td>Prefix sums with updates. Less power than a segment tree, but only 10 lines of code.<\/td><td>CPA: Data Structures · USACO Gold<\/td><\/tr>\n    <tr><td><b>Sparse table<\/b><\/td><td>Min / max / gcd of a range in O(1) when the array never changes.<\/td><td>CPA: Data Structures<\/td><\/tr>\n    <tr><td><b>Bitmask DP<\/b><\/td><td>DP where the state is a set of items, for n ≤ 20. See <a href=\"#bits\">Bits<\/a> and <a href=\"#dp\">Dynamic programming<\/a>.<\/td><td>USACO Gold · AtCoder DP contest (task O)<\/td><\/tr>\n    <tr><td><b>DP on trees<\/b><\/td><td>The best answer for each <span class=\"term\" data-t=\"subtree\">subtree<\/span>, built from the children. See <a href=\"#trees\">Trees<\/a>.<\/td><td>USACO Gold · AtCoder DP contest (task P)<\/td><\/tr>\n    <tr><td><b>LCA / binary lifting<\/b><\/td><td>The lowest common ancestor of two vertices in a tree. Gives the distance between any two vertices in O(log n).<\/td><td>CPA: Graphs · USACO Platinum<\/td><\/tr>\n    <tr><td><b>Minimum spanning tree (Kruskal)<\/b><\/td><td>The cheapest set of edges that connects all vertices. Sort the edges, then use <a href=\"#dsu\">DSU<\/a>.<\/td><td>EDU \"Disjoint Sets Union\" · USACO Gold<\/td><\/tr>\n    <tr><td><b>Bellman-Ford / Floyd-Warshall<\/b><\/td><td>Shortest paths with negative edges / between all pairs when n ≤ 500. See <a href=\"#dijkstra\">Dijkstra<\/a> first.<\/td><td>CPA: Graphs · USACO Gold<\/td><\/tr>\n    <tr><td><b>String hashing<\/b><\/td><td>Compare two substrings in O(1): turn each one into a number.<\/td><td>CPA: String Processing · USACO Gold<\/td><\/tr>\n    <tr><td><b>KMP / Z-function<\/b><\/td><td>Find a pattern inside a long text in O(n). Find borders and periods of a string.<\/td><td>CPA: String Processing<\/td><\/tr>\n    <tr><td><b>Sqrt tricks<\/b><\/td><td>Cut the array into blocks of size √n. Each query costs about √n steps. Easy to code.<\/td><td>CPA: Data Structures (\"Sqrt Decomposition\")<\/td><\/tr>\n    <tr><td><b>Game theory basics<\/b><\/td><td>Two players play perfectly: who wins? Winning and losing positions, the game of Nim.<\/td><td>CPA: Game Theory · CSES book, chapter 25<\/td><\/tr>\n  <\/table>\n  <p class=\"note\">Do not learn this list from top to bottom. Segment tree and bitmask DP are the two you will meet first.<\/p>\n<\/section>\n\n<section>\n  <h2>How to keep growing<\/h2>\n  <ul>\n    <li>From now on, contests and <span class=\"term\" data-t=\"upsolving\">upsolving<\/span> matter more than new topics. Most 1600–1900 problems need a good idea, not a new algorithm.<\/li>\n    <li>After every contest, solve the first problem you could not solve. This one habit gives the most rating.<\/li>\n    <li>Practice problems 100–300 above your rating. Think for 30–60 minutes before you open the <span class=\"term\" data-t=\"editorial\">editorial<\/span>.<\/li>\n    <li>When a topic comes back again and again in editorials, that is the time to learn it. Then solve 5–10 problems on it.<\/li>\n    <li>Fast and correct on easy problems is half of your rating. Keep doing virtual contests.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Problem sets<\/h2>\n  <ul>\n    <li><a href=\"https://cses.fi/problemset/\">CSES Problem Set<\/a> — 300+ classic problems sorted by topic. The best place to train a new technique.<\/li>\n    <li><a href=\"https://atcoder.jp/contests/dp\">AtCoder DP contest<\/a> — 26 DP problems, A to Z, from easy to hard.<\/li>\n    <li><a href=\"https://codeforces.com/edu/course/2\">Codeforces EDU<\/a> — each lesson has its own problems with a checker.<\/li>\n    <li><a href=\"https://usaco.guide/\">USACO Guide<\/a> — a full path with a problem list for every topic.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book. Read the chapter when you meet the topic.<\/li>\n  <\/ul>\n<\/section>\n"},"cf":{"1999G1":[1500,15528],"1915G":[1800,11627],"1851E":[1500,13947],"1843D":[1200,23040],"1829E":[1100,28986],"1829D":[1000,36421],"1807E":[1300,17765],"1807D":[900,66053],"1742D":[1100,38064],"1692E":[1200,38011],"1691B":[1000,40113],"1690D":[1000,54321],"1676G":[1300,27609],"1669H":[1300,33072],"1669F":[1100,45367],"1594B":[1100,22763],"1593E":[1600,15597],"1572A":[1800,11024],"1559A":[900,51077],"1538C":[1300,37461],"1527A":[800,43757],"1520F1":[1600,15425],"1520D":[1200,72397],"1514B":[1200,38433],"1513B":[1400,21917],"1486C1":[1600,14690],"1475E":[1600,19244],"1475C":[1400,29478],"1475A":[900,96587],"1472C":[1100,37001],"1454B":[800,30449],"1454A":[800,45277],"1420B":[1200,39681],"1399A":[800,86189],"1391C":[1500,16315],"1391A":[800,25257],"1385D":[1500,23569],"1374C":[1000,70648],"1367B":[800,67316],"1360B":[800,55841],"1353B":[800,60865],"1352C":[1200,77073],"1352B":[1200,48029],"1352A":[800,112526],"1348B":[1400,28221],"1348A":[800,43749],"1343B":[800,67818],"1343A":[900,5 0,5549],"189A":[1300,87966],"160A":[900,155811],"158B":[1100,110865],"158A":[800,350265],"149A":[900,48019],"136A":[800,156467],"122A":[1000,158673],"116A":[800,189043],"115A":[900,47913],"112A":[800,310433],"110A":[800,216044],"96B":[1300,20360],"71A":[800,548380],"69A":[1000,214637],"59A":[800,247049],"50A":[800,348014],"41A":[800,204081],"26B":[1400,28835],"26A":[900,47234],"25D":[1900,17456],"20C":[1900,52056],"4C":[1300,119433],"4A":[800,755055],"1A":[1000,340552]}};

<script>
(function () {
  var D = window.CFG_DATA, $ = function (s, r) { return (r || document).querySelector(s); };
  var main = $('#main'), side = $('#nav'), tip = $('#tip');
  var flat = [];
  D.stages.forEach(function (st) { st.topics.forEach(function (t) { t.stage = st; flat.push(t); }); });
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  /* ----- progress (saved in this browser only) ----- */
  var done = {};
  try { done = JSON.parse(localStorage.getItem('cfg-done') || '{}') || {}; } catch (e) {}
  function setDone(slug, v) {
    if (v) done[slug] = 1; else delete done[slug];
    try { localStorage.setItem('cfg-done', JSON.stringify(done)); } catch (e) {}
  }

  /* ----- theme ----- */
  try { var th = localStorage.getItem('cfg-theme'); if (th) document.documentElement.setAttribute('data-theme', th); } catch (e) {}
  function toggleTheme() {
    var r = document.documentElement, cur = r.getAttribute('data-theme') ||
      (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    var nx = cur === 'dark' ? 'light' : 'dark';
    r.setAttribute('data-theme', nx);
    try { localStorage.setItem('cfg-theme', nx); } catch (e) {}
  }

  /* ----- sidebar ----- */
  function drawSide(cur) {
    var h = '';
    D.stages.forEach(function (st) {
      h += '<div class="s' + st.id + '"><div class="stage-h">' + esc(st.id + ' · ' + st.name) + '<span>' + esc(st.rating) + '</span></div><ul>';
      st.topics.forEach(function (t) {
        h += '<li class="' + (done[t.slug] ? 'done' : '') + '"><a href="#' + t.slug + '" class="' + (t.slug === cur ? 'on' : '') + '">' + esc(t.title) +
          '</a><input type="checkbox" id="ck-' + t.slug + '" data-slug="' + t.slug + '" aria-label="Done: ' + esc(t.title) + '"' + (done[t.slug] ? ' checked' : '') + '></li>';
      });
      h += '</ul></div>';
    });
    side.innerHTML = h;
  }

  /* ----- C++ highlighter (tiny) ----- */
  var KW = 'int|long|double|float|char|bool|void|auto|const|unsigned|signed|short|string|vector|pair|map|set|multiset|unordered_map|unordered_set|queue|deque|stack|priority_queue|array|bitset|tuple|if|else|for|while|do|return|break|continue|struct|class|using|namespace|typedef|template|typename|true|false|switch|case|default|static|sizeof|nullptr|std|cin|cout|endl|greater|less|public|private|ll';
  var RX = new RegExp('(\\/\\/[^\\n]*|\\/\\*[\\s\\S]*?\\*\\/)|("(?:\\\\.|[^"\\\\\\n])*"|\'(?:\\\\.|[^\'\\\\\\n])*\')|(#\\s*\\w+)|\\b(' + KW + ')\\b|\\b(\\d[\\w\'.]*)\\b', 'g');
  function hl(src) {
    var out = '', last = 0, m;
    RX.lastIndex = 0;
    while ((m = RX.exec(src))) {
      out += esc(src.slice(last, m.index));
      var c = m[1] ? 'com' : m[2] ? 'str' : m[3] ? 'pre' : m[4] ? 'kw' : 'num';
      out += '<span class="t-' + c + '">' + esc(m[0]) + '</span>';
      last = RX.lastIndex;
    }
    return out + esc(src.slice(last));
  }

  /* ----- make a page interactive ----- */
  function enhance(root) {
    var seen = {};
    root.querySelectorAll('.term').forEach(function (el) {
      var k = el.getAttribute('data-t'), g = D.glossary[k];
      if (!g) return;
      el.tabIndex = 0;
      if (!seen[k] && !el.closest('h1,h2,h3,th,.cc,svg')) {
        seen[k] = 1;
        var s = document.createElement('span');
        s.className = 'ar'; s.lang = 'ar'; s.dir = 'rtl'; s.textContent = '(' + g.ar.replace(/\s*[(（].*$/, '') + ')';
        el.after(' ', s);
      }
    });
    root.querySelectorAll('pre > code').forEach(function (c) {
      var src = c.textContent.replace(/^\n+|\s+$/g, '');
      c.innerHTML = hl(src);
      var pre = c.parentNode;
      if (pre.closest('.cc')) return;
      var box = document.createElement('div'); box.className = 'codebox';
      pre.replaceWith(box); box.appendChild(pre);
      var b = document.createElement('button'); b.className = 'btn copy'; b.type = 'button'; b.textContent = 'Copy';
      b.onclick = function () {
        var okf = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1200); };
        try { navigator.clipboard.writeText(src).then(okf, sel); } catch (e) { sel(); }
        function sel() { var r = document.createRange(); r.selectNodeContents(c); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }
      };
      box.appendChild(b);
    });
    root.querySelectorAll('a.cf').forEach(function (a) {
      var p = a.getAttribute('data-p'), m = /^(\d+)([A-Z]\d?)$/.exec(p || '');
      if (!m) return;
      a.href = 'https://codeforces.com/problemset/problem/' + m[1] + '/' + m[2];
      var id = document.createElement('span'); id.className = 'id'; id.textContent = p;
      a.before(id);
    });
    /* order every ladder by real difficulty: official rating, then most-solved first.
       Links to other judges keep the place the author gave them. */
    root.querySelectorAll('.practice ol').forEach(function (ol) {
      var items = [].slice.call(ol.children);
      var info = function (li) { var a = li.querySelector(':scope > a.cf'); return a && D.cf && D.cf[a.getAttribute('data-p')]; };
      var cfItems = items.filter(info).map(function (li, i) { return { li: li, d: info(li), i: i }; })
        .sort(function (x, y) { return (x.d[0] || 9999) - (y.d[0] || 9999) || y.d[1] - x.d[1] || x.i - y.i; });
      var k = 0;
      items.map(function (li) { return info(li) ? cfItems[k++].li : li; }).forEach(function (li) {
        var d = info(li);
        if (d) {
          var r = li.querySelector('.r'); if (!r) { r = document.createElement('span'); r.className = 'r'; li.appendChild(r); }
          r.textContent = d[0] || '—';
          var sv = document.createElement('span'); sv.className = 'solved';
          sv.textContent = d[1] >= 1000 ? Math.round(d[1] / 1000) + 'k solved' : d[1] + ' solved';
          sv.title = d[1] + ' people solved this problem. More solvers usually means easier.';
          li.insertBefore(sv, r);
        }
        ol.appendChild(li);
      });
    });
    root.querySelectorAll('a[href^="http"]').forEach(function (a) { a.target = '_blank'; a.rel = 'noopener'; });
    root.querySelectorAll('.cc').forEach(function (c) { c.tabIndex = 0; });
    root.querySelectorAll('table').forEach(function (t) {
      if (t.parentNode.classList.contains('tablewrap') || t.closest('.cc')) return;
      var w = document.createElement('div'); w.className = 'tablewrap'; t.replaceWith(w); w.appendChild(t);
    });
  }

  /* ----- pages ----- */
  function home() {
    var total = flat.length, n = flat.filter(function (t) { return done[t.slug]; }).length;
    var h = '<div class="col">' + D.pages.home +
      '<div><div class="note">Your progress: ' + n + ' / ' + total + ' lessons</div><div class="meter"><i style="width:' + (100 * n / total) + '%"></i></div></div><div class="path">';
    D.stages.forEach(function (st) {
      h += '<div class="stage s' + st.id + '"><div class="num">' + st.id + '</div><div class="body"><div class="meta">' + esc(st.rating) + '</div><h2>' + esc(st.name) + '</h2><p>' + esc(st.goal) + '</p><ul class="chips">';
      st.topics.forEach(function (t) { h += '<li><a href="#' + t.slug + '" class="' + (done[t.slug] ? 'done' : '') + '">' + esc(t.title) + '</a></li>'; });
      h += '</ul><p class="ready"><b>Move on when:</b> ' + esc(st.ready) + '</p></div></div>';
    });
    return h + '</div><p><a class="btn" href="#cheatsheet">Open the cheat sheet</a> <a class="btn" href="#glossary">English → Arabic word list</a></p></div>';
  }
  function glossary() {
    var keys = Object.keys(D.glossary).sort(function (a, b) { return D.glossary[a].en.localeCompare(D.glossary[b].en); });
    var h = '<div class="col"><div class="page-h"><div class="eyebrow">Word list</div><h1>English → Arabic</h1></div>' +
      '<input class="search" id="gq" type="search" placeholder="Search a word…" aria-label="Search a word">' +
      '<table class="gloss"><thead><tr><th>English</th><th>العربية</th><th>Simple meaning</th></tr></thead><tbody>';
    keys.forEach(function (k) { var g = D.glossary[k]; h += '<tr><td>' + esc(g.en) + '</td><td lang="ar">' + esc(g.ar) + '</td><td>' + esc(g.note || '') + '</td></tr>'; });
    return h + '</tbody></table></div>';
  }
  function topic(t) {
    var i = flat.indexOf(t), pv = flat[i - 1], nx = flat[i + 1];
    return '<article class="col s' + t.stage.id + '"><div class="page-h"><div class="eyebrow">Stage ' + t.stage.id + ' · ' + esc(t.stage.name) + ' · ' + esc(t.stage.rating) +
      '</div><h1>' + esc(t.title) + '</h1></div>' + (D.pages[t.slug] || '<p>This lesson is not written yet.</p>') +
      '<div class="pager">' + (pv ? '<a href="#' + pv.slug + '">← ' + esc(pv.title) + '</a>' : '<span></span>') +
      '<button type="button" class="btn done-btn' + (done[t.slug] ? ' is' : '') + '" id="done-btn" data-slug="' + t.slug + '">' + (done[t.slug] ? '✓ Done' : 'Mark as done') + '</button>' +
      (nx ? '<a href="#' + nx.slug + '">' + esc(nx.title) + ' →</a>' : '<a href="#cheatsheet">Cheat sheet →</a>') + '</div></article>';
  }
  function render() {
    var slug = (location.hash || '').slice(1) || 'home';
    var t = flat.filter(function (x) { return x.slug === slug; })[0];
    hideTip(); document.body.classList.remove('open');
    if (t) main.innerHTML = topic(t);
    else if (slug === 'cheatsheet') main.innerHTML = '<div class="col wide cheat"><div class="page-h"><div class="eyebrow">Everything on one page</div><h1>Cheat sheet</h1><p class="note">Point at a card (or tap it) to see what it does and open its lesson.</p></div>' + D.pages.cheatsheet + '</div>';
    else if (slug === 'glossary') main.innerHTML = glossary();
    else { slug = 'home'; main.innerHTML = home(); }
    enhance(main); drawSide(slug);
    document.querySelectorAll('.quick a').forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#' + slug); });
    window.scrollTo(0, 0);
  }

  /* ----- tooltip ----- */
  var tipFor = null, hideT = 0;
  function showTip(el) {
    clearTimeout(hideT);
    if (tipFor === el) return;
    var html, rtl = false;
    if (el.classList.contains('term')) {
      var g = D.glossary[el.getAttribute('data-t')]; if (!g) return;
      html = esc(g.ar) + (g.note ? '<span class="en">' + esc(g.note) + '</span>' : ''); rtl = true;
    } else {
      var to = el.getAttribute('data-to'), tt = flat.filter(function (x) { return x.slug === to; })[0];
      html = esc(el.getAttribute('data-tip') || '') + (tt ? '<br><a href="#' + to + '">Open lesson: ' + esc(tt.title) + ' →</a>' : '');
    }
    tipFor = el; tip.innerHTML = html; tip.className = rtl ? 'rtl' : ''; tip.hidden = false;
    var r = el.getBoundingClientRect(), w = tip.offsetWidth, hh = tip.offsetHeight, vw = document.documentElement.clientWidth;
    var x = Math.max(12, Math.min(r.left + r.width / 2 - w / 2, vw - w - 12));
    var y = r.bottom + 6; if (y + hh > innerHeight - 8 && r.top - hh - 6 > 0) y = r.top - hh - 6;
    tip.style.left = (x + scrollX) + 'px'; tip.style.top = (y + scrollY) + 'px';
  }
  function hideTip() { tipFor = null; tip.hidden = true; }
  function later() { clearTimeout(hideT); hideT = setTimeout(hideTip, 220); }
  function target(e) { return e.target.closest && e.target.closest('.term, .cc[data-tip]'); }
  document.addEventListener('mouseover', function (e) { var t = target(e); if (t) showTip(t); else if (e.target.closest && e.target.closest('#tip')) clearTimeout(hideT); });
  document.addEventListener('mouseout', function (e) { if (target(e) || (e.target.closest && e.target.closest('#tip'))) later(); });
  document.addEventListener('focusin', function (e) { var t = target(e); if (t) showTip(t); });
  document.addEventListener('focusout', function (e) { if (target(e)) later(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { hideTip(); document.body.classList.remove('open'); } });

  document.addEventListener('click', function (e) {
    var t = target(e);
    if (t) { if (tipFor === t && e.detail === 0) hideTip(); else showTip(t); }
    else if (!e.target.closest('#tip')) hideTip();
    if (e.target.closest('#menu')) document.body.classList.toggle('open');
    else if (document.body.classList.contains('open') && !e.target.closest('.side')) document.body.classList.remove('open');
    if (e.target.closest('.theme')) toggleTheme();
    var d = e.target.closest('#done-btn');
    if (d) { setDone(d.dataset.slug, !done[d.dataset.slug]); d.classList.toggle('is', !!done[d.dataset.slug]); d.textContent = done[d.dataset.slug] ? '✓ Done' : 'Mark as done'; drawSide(d.dataset.slug); }
  });
  document.addEventListener('change', function (e) {
    if (e.target.matches('.side input[type=checkbox]')) { setDone(e.target.dataset.slug, e.target.checked); render(); }
  });
  document.addEventListener('input', function (e) {
    if (e.target.id !== 'gq') return;
    var q = e.target.value.toLowerCase();
    document.querySelectorAll('.gloss tbody tr').forEach(function (tr) { tr.hidden = tr.textContent.toLowerCase().indexOf(q) < 0; });
  });
  window.addEventListener('hashchange', render);
  render();
})();


</script>
</body>
</html>
