<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Zero to Codeforces</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
/* Layout: fixed lesson list on the left (the path), one narrow reading column on the right.
   Stage colours follow Codeforces rank colours: gray newbie, green pupil, cyan specialist, blue expert. */
:root {
  --bg: #f5f6f9; --surface: #ffffff; --sunken: #eceef4;
  --fg: #1a2233; --muted: #5b667a; --line: #d9dde7;
  --accent: #2456c8; --accent-soft: #e4ebfb;
  --warn: #a8480a; --warn-soft: #fdeede; --ok: #17794a;
  --s0: #5b667a; --s1: #7a7f87; --s2: #17823b; --s3: #0b8f88; --s4: #2f4fe0;
  --code-bg: #f0f2f7; --c-com: #6b7688; --c-str: #9a4a12; --c-kw: #2456c8; --c-num: #7a3fb5; --c-pre: #0b8f88;
  --tip-bg: #1a2233; --tip-fg: #f5f6f9;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-head: "Space Grotesk", "Inter", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --f-ar: "IBM Plex Sans Arabic", "Noto Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --side: 290px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #12151c; --surface: #1a1e28; --sunken: #0e1117;
  --fg: #e4e8f1; --muted: #98a2b6; --line: #2c3342;
  --accent: #7fa4ff; --accent-soft: #1f2a47;
  --warn: #f0a868; --warn-soft: #33241a; --ok: #5fcf95;
  --s0: #98a2b6; --s1: #a3a8b0; --s2: #5fcf7e; --s3: #45cfc6; --s4: #8ea2ff;
  --code-bg: #0e1117; --c-com: #7d889c; --c-str: #e8a56c; --c-kw: #7fa4ff; --c-num: #c79bf2; --c-pre: #45cfc6;
  --tip-bg: #e4e8f1; --tip-fg: #12151c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1a1e28; --sunken: #0e1117;
  --fg: #e4e8f1; --muted: #98a2b6; --line: #2c3342;
  --accent: #7fa4ff; --accent-soft: #1f2a47;
  --warn: #f0a868; --warn-soft: #33241a; --ok: #5fcf95;
  --s0: #98a2b6; --s1: #a3a8b0; --s2: #5fcf7e; --s3: #45cfc6; --s4: #8ea2ff;
  --code-bg: #0e1117; --c-com: #7d889c; --c-str: #e8a56c; --c-kw: #7fa4ff; --c-num: #c79bf2; --c-pre: #45cfc6;
  --tip-bg: #e4e8f1; --tip-fg: #12151c; color-scheme: dark }

* { box-sizing: border-box }
html { scroll-behavior: smooth }
body { background: var(--bg); color: var(--fg); font: 16px/1.65 var(--f-body); margin: 0 }
a { color: var(--accent) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 3px }
h1, h2, h3 { font-family: var(--f-head); line-height: 1.2; text-wrap: balance; margin: 0 }
code, pre, kbd, .fx, .complexity { font-family: var(--f-mono); font-variant-ligatures: none; font-feature-settings: "liga" 0, "calt" 0 }
code, pre, kbd { font-size: .88em }
:not(pre) > code { background: var(--code-bg); padding: .1em .35em; border-radius: 4px }

/* ---------- top bar (phone) + sidebar ---------- */
.bar { display: none; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface);
  border-bottom: 1px solid var(--line); align-items: center; gap: 12px; padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface) }
.brand { font: 700 1.05rem var(--f-head); color: var(--fg); text-decoration: none; letter-spacing: -.01em }
.brand b { color: var(--accent) }
.btn { font: 600 .85rem var(--f-body); color: var(--fg); background: var(--surface); border: 1px solid var(--line);
  border-radius: 6px; padding: 6px 10px; cursor: pointer }
.btn:hover { border-color: var(--accent); color: var(--accent) }
.side { position: fixed; top: 0; bottom: 0; left: 0; width: var(--side); overflow-y: auto; background: var(--surface);
  border-right: 1px solid var(--line); padding: 20px 14px 40px; display: flex; flex-direction: column; gap: 14px; z-index: 25 }
.side-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 6px }
.side nav { display: flex; flex-direction: column; gap: 14px }
.side .quick { display: flex; gap: 6px; padding: 0 6px }
.side .quick a { flex: 1; text-align: center; text-decoration: none }
.stage-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 0 6px 4px;
  font: 700 .72rem var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--sc) }
.stage-h span { font-weight: 500; letter-spacing: 0; font-variant-numeric: tabular-nums; text-transform: none; color: var(--muted) }
.side ul { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--sc) ; margin-left: 6px }
.side li { display: flex; align-items: center; gap: 4px }
.side li a { flex: 1; min-width: 0; display: block; padding: 4px 8px; border-radius: 5px; color: var(--fg); text-decoration: none; font-size: .9rem }
.side li a:hover { background: var(--sunken) }
.side li a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600 }
.side li input { accent-color: var(--ok); margin: 0 4px 0 0 }
.side li.done a { color: var(--muted) }
.s0 { --sc: var(--s0) } .s1 { --sc: var(--s1) } .s2 { --sc: var(--s2) } .s3 { --sc: var(--s3) } .s4 { --sc: var(--s4) }

main { margin-left: var(--side); padding-block: 40px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
.col { max-width: 46rem; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; min-width: 0 }
.col.wide { max-width: 72rem }
.col > * { min-width: 0 }

@media (max-width: 900px) {
  .bar { display: flex }
  .side { transform: translateX(-100%); transition: transform .2s; width: min(var(--side), 86vw);
    padding-top: calc(20px + env(safe-area-inset-top, 0px)); padding-left: max(14px, env(safe-area-inset-left, 0px)) }
  body.open .side { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.45) }
  main { margin-left: 0; padding-block: 24px 64px }
}
@media (prefers-reduced-motion: reduce) { .side { transition: none } html { scroll-behavior: auto } }

/* ---------- lesson page ---------- */
.eyebrow { font: 700 .72rem var(--f-head); letter-spacing: .08em; text-transform: uppercase; color: var(--sc) }
.page-h h1 { font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -.02em; margin-top: 4px }
.idea { font-size: 1.15rem; line-height: 1.5; margin: 0; padding-left: 14px; border-left: 3px solid var(--sc, var(--accent)) }
section { display: flex; flex-direction: column; gap: 10px }
section > *, .way > * { margin: 0; min-width: 0 }
h2 { font-size: 1.2rem; margin-top: 8px }
h3 { font-size: .95rem }
p { margin: 0 }
ul, ol { margin: 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 4px }
.way { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px }
.way h3 { color: var(--muted); font-weight: 600; letter-spacing: .02em }
.way h3 b { color: var(--sc, var(--accent)) }
.complexity { font-family: var(--f-mono); font-size: .88rem; background: var(--sunken); border-radius: 6px; padding: 8px 12px }
.mistakes ul { list-style: none; padding: 0 }
.mistakes li { background: var(--warn-soft); border-radius: 6px; padding: 7px 12px 7px 34px; position: relative }
.mistakes li::before { content: "!"; position: absolute; left: 12px; font-weight: 800; color: var(--warn) }
.practice ol { list-style: none; padding: 0; gap: 0; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
.practice li { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; padding: 7px 14px; border-top: 1px solid var(--line) }
.practice li:first-child { border-top: 0 }
.practice li a.cf { flex: 1; min-width: 0 }
.practice .id { font: 500 .8rem var(--f-mono); color: var(--muted); min-width: 4.2em }
.r { font: 600 .78rem var(--f-mono); font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap }

.solved { font: 500 .74rem var(--f-mono); color: var(--muted); white-space: nowrap }
.practice .r { min-width: 2.6em; text-align: right; color: var(--fg) }
.note { font-size: .88rem; color: var(--muted) }
.tip-box { background: var(--accent-soft); border-radius: 8px; padding: 10px 14px }
.tablewrap { overflow-x: auto }
table { border-collapse: collapse; font-size: .9rem; font-variant-numeric: tabular-nums }
th, td { border: 1px solid var(--line); padding: 5px 10px; text-align: left }
th { background: var(--sunken); font-family: var(--f-head); font-weight: 600 }
td.hi, th.hi { background: var(--accent-soft); color: var(--accent); font-weight: 700 }
td.dim { color: var(--muted); opacity: .55 }
svg { max-width: 100%; height: auto }
svg text { fill: var(--fg); font-family: var(--f-mono); font-size: 13px }

/* code */
.codebox { position: relative }
pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; overflow-x: auto; line-height: 1.5; tab-size: 4 }
.copy { position: absolute; top: 6px; right: 6px; font-size: .72rem; padding: 3px 8px; opacity: .75 }
.copy:hover { opacity: 1 }
.t-com { color: var(--c-com); font-style: italic } .t-str { color: var(--c-str) } .t-kw { color: var(--c-kw) }
.t-num { color: var(--c-num) } .t-pre { color: var(--c-pre) }

/* Arabic terms */
.term { text-decoration: underline dotted var(--accent); text-underline-offset: 3px; cursor: help }
.ar { font-family: var(--f-ar); color: var(--muted); font-size: .92em; unicode-bidi: isolate }
#tip { position: absolute; z-index: 50; max-width: min(320px, calc(100vw - 24px)); background: var(--tip-bg); color: var(--tip-fg);
  border-radius: 7px; padding: 8px 12px; font-size: .88rem; line-height: 1.45; box-shadow: 0 6px 20px rgba(0,0,0,.25) }
#tip.rtl { font-family: var(--f-ar); font-size: 1rem; direction: rtl; text-align: right }
#tip a { color: inherit; font-weight: 600; display: inline-block; margin-top: 4px }
#tip .en { display: block; font-family: var(--f-body); font-size: .8rem; direction: ltr; text-align: left; opacity: .8; margin-top: 2px }

/* footer nav */
.pager { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 18px; margin-top: 10px }
.pager a { text-decoration: none; font-weight: 600 }
.done-btn.is { background: var(--ok); border-color: var(--ok); color: var(--bg) }

/* ---------- home ---------- */
.hero h1 { font-size: clamp(2rem, 6vw, 3.2rem); letter-spacing: -.03em }
.hero p { font-size: 1.1rem; color: var(--muted); max-width: 38rem; margin-top: 10px }
.path { display: flex; flex-direction: column; gap: 0 }
.stage { display: grid; grid-template-columns: 54px 1fr; gap: 0 16px; padding-bottom: 26px; position: relative }
.stage::before { content: ""; position: absolute; left: 26px; top: 54px; bottom: 0; width: 2px; background: var(--sc); opacity: .45 }
.stage:last-child::before { display: none }
.stage .num { width: 54px; height: 54px; border-radius: 50%; border: 2px solid var(--sc); color: var(--sc); background: var(--surface);
  display: grid; place-items: center; font: 700 1.3rem var(--f-head) }
.stage .body { display: flex; flex-direction: column; gap: 8px; min-width: 0; padding-top: 4px }
.stage h2 { margin: 0; font-size: 1.3rem }
.stage .meta { font: 500 .82rem var(--f-mono); color: var(--sc) }
.stage .ready { font-size: .9rem; color: var(--muted) }
.chips { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; flex-direction: row }
.chips a { display: block; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 3px 12px; font-size: .88rem; text-decoration: none; color: var(--fg) }
.chips a:hover { border-color: var(--sc); color: var(--sc) }
.chips a.done { border-color: var(--ok); color: var(--ok) }
.chips a.done::before { content: "✓ " }
.meter { height: 6px; background: var(--sunken); border-radius: 3px; overflow: hidden }
.meter i { display: block; height: 100%; background: var(--ok) }

/* ---------- cheat sheet ---------- */
.cheat h2 { color: var(--sc); font-size: .8rem; letter-spacing: .1em; text-transform: uppercase; border-bottom: 2px solid var(--sc); padding-bottom: 4px; margin-top: 14px }
.cgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 10px; align-items: start }
.cc { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 9px 11px; cursor: help; min-width: 0 }
.cc:hover, .cc:focus-visible { border-color: var(--sc, var(--accent)) }
.cc pre { border: 0; padding: 0; background: none; font-size: .78rem; line-height: 1.45 }
.cc .fx { font: 500 .88rem/1.5 var(--f-mono); overflow-wrap: anywhere; padding-left: 1em; text-indent: -1em }
.cc .fx + .fx { margin-top: 2px }
.cc table { font-size: .8rem; width: 100% }
.cc.span2 { grid-column: span 2 }
@media (max-width: 700px) { .cc.span2 { grid-column: auto } }

/* glossary */
.gloss td:nth-child(2) { font-family: var(--f-ar); direction: rtl; text-align: right; font-size: 1.05rem }
.gloss { width: 100% }
.search { font: inherit; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); width: 100% }

@media print {
  .side, .bar, .pager, .copy, #tip { display: none !important }
  main { margin: 0; padding: 0 } body { background: #fff; font-size: 11px }
  .col.wide { max-width: none } .cgrid { grid-template-columns: repeat(3, 1fr); gap: 6px } .cc { break-inside: avoid }
}


</style>
<header class="bar">
  <button class="btn" id="menu" type="button" aria-label="Open lesson list">☰ Lessons</button>
  <a class="brand" href="#home">Zero to <b>Codeforces</b></a>
</header>
<aside class="side" aria-label="Lessons">
  <div class="side-top">
    <a class="brand" href="#home">Zero to <b>Codeforces</b></a>
    <button class="btn theme" type="button" aria-label="Switch light and dark">◐</button>
  </div>
  <div class="quick">
    <a class="btn" href="#cheatsheet">Cheat sheet</a>
    <a class="btn" href="#glossary">Words</a>
  </div>
  <nav id="nav"></nav>
</aside>
<main id="main"></main>
<div id="tip" role="tooltip" hidden></div>

queue","ar":"طابور (أوّل ما يدخل أوّل ما يخرج)","note":"you add at the back and remove from the front"},"key":{"en":"key","ar":"مفتاح","note":"the thing you search by in a map, like a name in a phone book"},"duplicate":{"en":"duplicate","ar":"مكرَّر","note":"a value that appears more than once"},"comparator":{"en":"comparator","ar":"دالّة المقارنة","note":"a function that says which of two elements comes first"},"ascending":{"en":"ascending","ar":"تصاعدي (من الأصغر إلى الأكبر)","note":"from small to big"},"descending":{"en":"descending","ar":"تنازلي (من الأكبر إلى الأصغر)","note":"from big to small"},"pair":{"en":"pair","ar":"زوج (عنصران معًا)","note":"two things together, like (i, j)"},"range":{"en":"range / segment","ar":"نطاق (من l إلى r)","note":"all positions from l to r"},"running-sum":{"en":"running sum","ar":"المجموع التراكمي","note":"the sum of everything up to now"},"difference-array":{"en":"difference array","ar":"مصفوفة الفروق","note":"stores only where a change starts and where it ends"},"pointer":{"en":"pointer (index)","ar":"مؤشّر (يدلّ على موضع في المصفوفة)","note":"here: just an index that walks along the array"},"sliding-window":{"en":"sliding window","ar":"النافذة المنزلقة","note":"a subarray [l, r] that moves to the right step by step"},"merge":{"en":"merge","ar":"دمج","note":"join two sorted lists into one sorted list"},"gcd":{"en":"GCD (greatest common divisor)","ar":"القاسم المشترك الأكبر","note":"the biggest number that divides both a and b"},"lcm":{"en":"LCM (least common multiple)","ar":"المضاعف المشترك الأصغر","note":"the smallest number divisible by both a and b"},"multiple":{"en":"multiple","ar":"مضاعَف","note":"the multiples of 3 are 3, 6, 9, 12…"},"sieve":{"en":"sieve","ar":"غربال (غربال إراتوستينس)","note":"a fast way to find all primes up to n by crossing out multiples"},"factorisation":{"en":"prime factorisation","ar":"التحليل إلى العوامل الأوّلية","note":"writing n as a product of primes: 60 = 2·2·3·5"},"square-root":{"en":"square  drawing of which call makes which calls"},"dynamic-programming":{"en":"dynamic programming (DP)","ar":"البرمجة الديناميكية","note":"solve small problems once, store the answers, build big answers from them"},"subproblem":{"en":"subproblem","ar":"مسألة جزئية (نسخة أصغر من المسألة)","note":"a smaller copy of the same problem"},"state":{"en":"state","ar":"حالة","note":"the numbers that describe one subproblem, like i in dp[i]"},"transition":{"en":"transition","ar":"علاقة الانتقال (بين الحالات)","note":"the formula that builds dp[i] from smaller answers"},"memoisation":{"en":"memoisation","ar":"حفظ النتائج المحسوبة لإعادة استخدامها","note":"store the answer of a call so you never compute it twice"},"knapsack":{"en":"knapsack","ar":"مسألة حقيبة الظهر","note":"choose items with the best total value so the total weight fits in the bag"},"adjacency-list":{"en":"adjacency list","ar":"قائمة التجاور (قائمة جيران كل رأس)","note":"for every vertex, the list of its neighbours"},"neighbour":{"en":"neighbour","ar":"جار","note":"a vertex joined to this vertex by one edge"},"visited":{"en":"visited","ar":"تمّت زيارته","note":"a mark that says: I was already here"},"connected":{"en":"connected","ar":"متّصل","note":"you can walk from any vertex to any other vertex"},"connected-component":{"en":"connected component","ar":"مكوِّن متّصل","note":"a group of vertices that can all reach each other"},"dfs":{"en":"DFS (depth-first search)","ar":"البحث بالعمق أوّلًا","note":"go as deep as you can, then come back"},"bfs":{"en":"BFS (breadth-first search)","ar":"البحث بالعرض أوّلًا","note":"visit level by level: first distance 1, then 2, then 3…"},"undirected":{"en":"undirected","ar":"غير موجَّه (يُعبَر في الاتجاهين)","note":"you can use the edge in both directions"},"directed":{"en":"directed","ar":"موجَّه (في اتجاه واحد)","note":"the edge goes one way only, from a to b"},"path":{"en":"path","ar":"مسار","note":"a walk from one vertex to another along edges"},"shortest-path":{"en":"shortest path ute":{"en":"precompute","ar":"حساب مُسبق","note":"calculate once at the start, then reuse many times"},"interactive":{"en":"interactive","ar":"تفاعلي","note":"your program and the judge send messages to each other"},"flush":{"en":"flush","ar":"تفريغ المخزن المؤقّت (إرسال المخرجات فورًا)","note":"send the printed text now, do not keep it in memory"}},"pages":{"home":"<div class=\"hero\">\n  <h1>From your first C++ program to Codeforces 1600.<\/h1>\n  <p>A short path with a fixed order. Each lesson takes 10–15 minutes to read. Then you practice. Hard words have a dotted line: point at them to see the Arabic meaning.<\/p>\n<\/div>\n<section>\n  <h2>How to use this guide<\/h2>\n  <ol>\n    <li><b>Go in order.<\/b> Each lesson uses the lessons before it.<\/li>\n    <li><b>Read, then solve.<\/b> After each lesson, solve the problems in its practice ladder. Reading alone does not work.<\/li>\n    <li><b>Think 20–40 minutes<\/b> before you open a solution. Then write the code yourself, without looking.<\/li>\n    <li><b>Mark it done<\/b> and move on. Do not wait until you feel perfect.<\/li>\n  <\/ol>\n  <p class=\"note\">Each lesson explains one idea in three ways: a story, a picture, and code. Use the one that works for you.<\/p>\n<\/section>\n<h2>The path<\/h2>\n","cheatsheet":"<section class=\"s0\">\n<h2>Limits and types<\/h2>\n<div class=\"cgrid\">\n  <div class=\"cc\" data-to=\"complexity\" data-tip=\"About 10^8 simple steps run in 1 second. Read n from the limits, then pick the speed you need.\">\n    <table>\n      <tr><th>n ≤<\/th><th>speed<\/th><\/tr>\n      <tr><td>10<\/td><td>O(n!)<\/td><\/tr>\n      <tr><td>20<\/td><td>O(2ⁿ)<\/td><\/tr>\n      <tr><td>500<\/td><td>O(n³)<\/td><\/tr>\n      <tr><td>5000<\/td><td>O(n²)<\/td><\/tr>\n      <tr><td>2·10⁵ – 10⁶<\/td><td>O(n log n), O(n)<\/td><\/tr>\n      <tr><td>10¹²<\/td><td>O(√n)<\/td><\/tr>\n      <tr><td>10¹⁸<\/td><td>O(log n), O(1)<\/td><\/tr>\n    <\/table>\n  <\/div>\n  <div class=\"cc\" data-to=\"overflow\" data-tip=\"How big a number each type can hold. If a sum or product can pass 2·10^9, use long long.\">\n    <div class=\"fx\">int ≈ ±2·10⁹ (2³¹−1)<\/div>\n    <div class=\"fx\">long long ≈ ±9·10¹⁸ (2⁶³−1)<\/div>\n    <div class=\"fx\">1 second ≈ 10⁸ steps<\/div>\n    <div class=\"fx\">256 MB ≈ 6·10⁷ ints<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"overflow\" data-tip=\"Multiply two ints safely: start with 1LL so the whole product is computed as long long.\">\n<pre data-part=\"main\"><code class=\"cpp\">\nlong long p = 1LL * a * b;\nlong long big = 1e18;   const int MOD = 1e9 + 7;\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc span2\" data-to=\"cpp-template\" data-tip=\"The start of every solution: fast input/output and a loop over the test cases.\">\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nvoid solve() {\n    int n; cin &gt;&gt; n;\n    vector&lt;long long&gt; a(n);\n    for (auto &amp;x : a) cin &gt;&gt; x;\n    cout &lt;&lt; (n &gt; 0 ? \"YES\" : \"NO\") &lt;&lt; \"\\n\";\n}\n\nint main() {\n    ios::sync_with_stdio(false); cin.tie(nullptr);\n    int t; cin &gt;&gt; t;\n    while (t--) solve();\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"debugging\" data-tip=\"Check these first when you get Wrong Answer.\">\n    <div class=\"fx\">n = 1 · all equal · max values<\/div>\n    <div class=\"fx\">overflow? · index out of range?<\/div>\n    <div class=\"fx\">reset between test cases?<\/div>\n    <div class=\"fx\">output format · YES/NO<\/div>\n  <\/div>\n<\/div>\n<\/section>\n\n<section class=\"s1\">\n<h2>Math<\/h2>\n<div class=\"cgrid\">\n  <div class=\"cc\" data-to=\"basic-math\" data-tip=\"Sums you should know by heart. Use long long.\">\n    <div class=\"fx\">1 + 2 + … + n = n(n+1)/2<\/div>\n    <div class=\"fx\">1 + 3 + … + (2n−1) = n²<\/div>\n    <div class=\"fx\">1² + … + n² = n(n+1)(2n+1)/6<\/div>\n    <div class=\"fx\">a + (a+d) + … (n terms) = n(first+last)/2<\/div>\n    <div class=\"fx\">1 + 2 + 4 + … + 2ᵏ = 2ᵏ⁺¹ − 1<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"basic-math\" data-tip=\"Integer division tricks: round up, count multiples in a range, even/odd test.\">\n    <div class=\"fx\">ceil(a / b) = (a + b − 1) / b<\/div>\n    <div class=\"fx\">multiples of k in [1..n] = n / k<\/div>\n    <div class=\"fx\">in [l..r] = r/k − (l−1)/k<\/div>\n    <div class=\"fx\">odd: x % 2 != 0 &nbsp; even: x % 2 == 0<\/div>\n    <div class=\"fx\">numbers in [l..r] = r − l + 1<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"basic-math\" data-tip=\"Walk over the digits of a number from the last digit to the first.\">\n<pre data-part=\"main\"><code class=\"cpp\">\nwhile (x &gt; 0) { int d = x % 10; x /= 10; }\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"number-theory\" data-tip=\"Greatest common divisor and least common multiple. Divide before you multiply to avoid overflow.\">\n    <div class=\"fx\">gcd(a, b) = gcd(b, a % b), gcd(a, 0) = a<\/div>\n    <div class=\"fx\">lcm(a, b) = a / gcd(a, b) · b<\/div>\n    <div class=\"fx\">C++: gcd(a, b), lcm(a, b), __gcd(a, b)<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"number-theory\" data-tip=\"Is n prime? Try divisors up to the square root. O(√n).\">\n<pre data-part=\"global\"><code class=\"cpp\">\nbool isPrime(long long n) {\n    if (n &lt; 2) return false;\n    for (long long i = 2; i * i &lt;= n; i++)\n        if (n % i == 0) return false;\n    return true;\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"number-theory\" data-tip=\"All divisors of n in O(√n): they come in pairs (i, n / i).\">\n<pre data-part=\"main\"><code class=\"cpp\">\nfor (long long i = 1; i * i &lt;= n; i++)\n    if (n % i == 0) {\n        d.push_back(i);\n        if (i != n / i) d.push_back(n / i);\n    }\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"number-theory\" data-tip=\"Sieve: find all primes up to N at once. O(N log log N). Good for N up to about 10^7.\">\n<pre data-part=\"global\"><code class=\"cpp\">\nconst int N = 1000000;\nvector&lt;bool&gt; prime(N + 1, true);\nvoid sieve() {\n    prime[0] = prime[1] = false;\n    for (int i = 2; 1LL * i * i &lt;= N; i++)\n        if (prime[i])\n            for (int j = i * i; j &lt;= N; j += i)\n                prime[j] = false;\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"modular\" data-tip=\"Rules for answers 'modulo 10^9+7'. Take % after every step. Never divide normally under mod.\">\n    <div class=\"fx\">(a + b) % m<\/div>\n    <div class=\"fx\">((a − b) % m + m) % m<\/div>\n    <div class=\"fx\">(1LL * a * b) % m<\/div>\n    <div class=\"fx\">a / b → a · b^(m−2) % m &nbsp;(m prime)<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"modular\" data-tip=\"Fast power: a^b mod m in O(log b) steps by squaring.\">\n<pre data-part=\"global\"><code class=\"cpp\">\nlong long power(long long a, long long b, long long m) {\n    long long r = 1; a %= m;\n    while (b &gt; 0) {\n        if (b &amp; 1) r = r * a % m;\n        a = a * a % m;\n        b &gt;&gt;= 1;\n    }\n    return r;\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"combinatorics\" data-tip=\"Counting formulas: ways to order, ways to choose, number of pairs, number of subsets.\">\n    <div class=\"fx\">n! = 1·2·…·n<\/div>\n    <div class=\"fx\">C(n, r) = n! / (r! · (n−r)!)<\/div>\n    <div class=\"fx\">C(n, r) = C(n−1, r−1) + C(n−1, r)<\/div>\n    <div class=\"fx\">pairs = n(n−1)/2 &nbsp; subsets = 2ⁿ<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"combinatorics\" data-tip=\"nCr mod a prime, many times: precompute factorials and inverse factorials once, then each answer is O(1).\">\n<pre data-part=\"global\"><code class=\"cpp\">\nconst int MOD = 1e9 + 7, MAXN = 200005;\nlong long fact[MAXN], inv[MAXN];\nlong long pw(long long a, long long b) {\n    long long r = 1; a %= MOD;\n    for (; b &gt; 0; b &gt;&gt;= 1, a = a * a % MOD)\n        if (b &amp; 1) r = r * a % MOD;\n    return r;\n}\nvoid init() {\n    fact[0] = 1;\n    for (int i = 1; i &lt; MAXN; i++) fact[i] = fact[i-1] * i % MOD;\n    inv[MAXN-1] = pw(fact[MAXN-1], MOD - 2);\n    for (int i = MAXN - 1; i &gt; 0; i--) inv[i-1] = inv[i] * i % MOD;\n}\nlong long C(int n, int r) {\n    if (r &lt; 0 || r &gt; n) return 0;\n    return fact[n] * inv[r] % MOD * inv[n-r] % MOD;\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"bits\" data-tip=\"Bit tricks. Use 1LL &lt;&lt; k when k can be 31 or more. Always put brackets around &amp; | ^.\">\n    <div class=\"fx\">bit k on? &nbsp;(x &gt;&gt; k) &amp; 1<\/div>\n    <div class=\"fx\">set: x | (1 &lt;&lt; k) &nbsp; clear: x &amp; ~(1 &lt;&lt; k)<\/div>\n    <div class=\"fx\">flip: x ^ (1 &lt;&lt; k)<\/div>\n    <div class=\"fx\">power of 2? &nbsp;x &gt; 0 &amp;&amp; (x &amp; (x−1)) == 0<\/div>\n    <div class=\"fx\">count ones: __builtin_popcountll(x)<\/div>\n    <div class=\"fx\">a ^ a = 0 &nbsp; a ^ 0 = a<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"bits\" data-tip=\"Try every subset of n items (n ≤ 20). Bit i of mask says if item i is taken.\">\n<pre data-part=\"main\"><code class=\"cpp\">\nfor (int mask = 0; mask &lt; (1 &lt;&lt; n); mask++)\n    for (int i = 0; i &lt; n; i++)\n        if (mask &gt;&gt; i &amp; 1) { /* item i is in */ }\n<\/code><\/pre>\n  <\/div>\n<\/div>\n<\/section>\n\n<section class=\"s2\">\n<h2>STL and core tools<\/h2>\n<div class=\"cgrid\">\n  <div class=\"cc\" data-to=\"stl-basics\" data-tip=\"Everyday tools on a vector: sort, reverse, biggest, smallest, sum, remove duplicates.\">\n<pre data-part=\"main\"><code class=\"cpp\">\nsort(a.begin(), a.end());\nsort(a.rbegin(), a.rend());            // big to small\nreverse(a.begin(), a.end());\nint mx = *max_element(a.begin(), a.end());\nint mn = *min_element(a.begin(), a.end());\nlong long s = accumulate(a.begin(), a.end(), 0LL);\na.erase(unique(a.begin(), a.end()), a.end());  // after sort\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"sorting\" data-tip=\"Sort by your own rule. The rule must use strict &lt; and never &lt;=.\">\n<pre data-part=\"main\"><code class=\"cpp\">\nsort(v.begin(), v.end(), [](const pair&lt;int,int&gt; &amp;x,\n                            const pair&lt;int,int&gt; &amp;y) {\n    if (x.second != y.second) return x.second &lt; y.second;\n    return x.first &gt; y.first;\n});\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"stl-containers\" data-tip=\"Which container for which job. set/map cost O(log n) per step; stack/queue cost O(1).\">\n    <table>\n      <tr><td>unique + sorted<\/td><td>set<\/td><\/tr>\n      <tr><td>sorted, repeats<\/td><td>multiset<\/td><\/tr>\n      <tr><td>key → value<\/td><td>map<\/td><\/tr>\n      <tr><td>last in, first out<\/td><td>stack<\/td><\/tr>\n      <tr><td>first in, first out<\/td><td>queue<\/td><\/tr>\n      <tr><td>both ends<\/td><td>deque<\/td><\/tr>\n      <tr><td>always the max / min<\/td><td>priority_queue<\/td><\/tr>\n    <\/table>\n  <\/div>\n  <div class=\"cc\" data-to=\"stl-containers\" data-tip=\"The most used lines for set, map, multiset and priority_queue.\">\n<pre data-part=\"main\"><code class=\"cpp\">\nset&lt;int&gt; s; s.insert(x); s.count(x); s.erase(x);\nauto it = s.lower_bound(x);        // first &gt;= x\nmap&lt;int,int&gt; m; m[x]++;\nfor (auto [key, val] : m) { }\nmultiset&lt;int&gt; ms; ms.erase(ms.find(x));   // one copy\npriority_queue&lt;int&gt; pq;            // max on top\npriority_queue&lt;int, vector&lt;int&gt;, greater&lt;int&gt;&gt; mn;\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"counting\" data-tip=\"Count how many times each value appears. Array for small values, map for big values.\">\n<pre data-part=\"main\"><code class=\"cpp\">\nint cnt[26] = {};\nfor (char c : s) cnt[c - 'a']++;\nmap&lt;long long, long long&gt; f;\nfor (auto x : a) f[x]++;\n// pairs among k equal items: k * (k - 1) / 2\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"prefix-sums\" data-tip=\"Sum of any part of an array in O(1) after one O(n) pass.\">\n    <div class=\"fx\">pre[0] = 0, pre[i+1] = pre[i] + a[i]<\/div>\n    <div class=\"fx\">sum a[l..r] = pre[r+1] − pre[l]<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"prefix-sums\" data-tip=\"Difference array: add v to a whole range [l..r] in O(1), many times. One prefix sum at the end gives the real values.\">\n    <div class=\"fx\">d[l] += v, d[r+1] −= v<\/div>\n    <div class=\"fx\">then a[i] = d[0] + … + d[i]<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"prefix-sums\" data-tip=\"2D prefix sums: sum of any rectangle in O(1). Rows and columns are 1-indexed.\">\n    <div class=\"fx\">P[i][j] = a[i][j] + P[i−1][j] + P[i][j−1] − P[i−1][j−1]<\/div>\n    <div class=\"fx\">sum = P[r2][c2] − P[r1−1][c2] − P[r2][c1−1] + P[r1−1][c1−1]<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"two-pointers\" data-tip=\"Sliding window: longest part with sum ≤ S (positive numbers). Each pointer only moves forward, so it is O(n).\">\n<pre data-part=\"main\"><code class=\"cpp\">\nlong long sum = 0; int best = 0;\nfor (int l = 0, r = 0; r &lt; n; r++) {\n    sum += a[r];\n    while (sum &gt; S) sum -= a[l++];\n    best = max(best, r - l + 1);\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"binary-search\" data-tip=\"Binary search for the first value where ok() is true. lo must be a 'no', hi must be a 'yes'.\">\n<pre data-part=\"main\"><code class=\"cpp\">\n// ok: no no no YES YES YES\nwhile (hi - lo &gt; 1) {\n    long long mid = lo + (hi - lo) / 2;\n    if (ok(mid)) hi = mid; else lo = mid;\n}\n// answer = hi\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"binary-search\" data-tip=\"Ready-made binary search on a sorted vector.\">\n<pre data-part=\"main\"><code class=\"cpp\">\nint i = lower_bound(a.begin(), a.end(), x) - a.begin(); // &gt;= x\nint j = upper_bound(a.begin(), a.end(), x) - a.begin(); // &gt;  x\nbool has = binary_search(a.begin(), a.end(), x);\n<\/code><\/pre>\n  <\/div>\n<\/div>\n<\/section>\n\n<section class=\"s3\">\n<h2>Algorithms<\/h2>\n<div class=\"cgrid\">\n  <div class=\"cc\" data-to=\"recursion\" data-tip=\"Recursion: try 'take' and 'skip' for every item. Visits all 2^n subsets.\">\n<pre data-part=\"global\"><code class=\"cpp\">\nint n; vector&lt;int&gt; a, cur;\nvoid go(int i) {\n    if (i == n) { /* use cur */ return; }\n    go(i + 1);                 // skip a[i]\n    cur.push_back(a[i]);\n    go(i + 1);                 // take a[i]\n    cur.pop_back();            // undo\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"recursion\" data-tip=\"Every order of the elements (n ≤ 10). Sort first.\">\n<pre data-part=\"main\"><code class=\"cpp\">\nsort(a.begin(), a.end());\ndo { /* use a */ } while (next_permutation(a.begin(), a.end()));\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"dp\" data-tip=\"The four questions for every DP problem.\">\n    <div class=\"fx\">1. dp[i] means … (in words)<\/div>\n    <div class=\"fx\">2. dp[i] = formula from smaller ones<\/div>\n    <div class=\"fx\">3. base cases<\/div>\n    <div class=\"fx\">4. order of filling, where is the answer<\/div>\n  <\/div>\n  <div class=\"cc span2\" data-to=\"dp\" data-tip=\"Classic DP formulas: stairs, min coins, grid paths, knapsack, longest increasing subsequence, longest common subsequence.\">\n    <div class=\"fx\">stairs: dp[i] = dp[i−1] + dp[i−2]<\/div>\n    <div class=\"fx\">coins: dp[x] = min(dp[x − c] + 1) for each coin c<\/div>\n    <div class=\"fx\">grid: dp[i][j] = dp[i−1][j] + dp[i][j−1]<\/div>\n    <div class=\"fx\">knapsack: for w = W..wt: dp[w] = max(dp[w], dp[w − wt] + val)<\/div>\n    <div class=\"fx\">LIS: dp[i] = 1 + max(dp[j]) for j &lt; i, a[j] &lt; a[i]<\/div>\n    <div class=\"fx\">LCS: a[i]==b[j] ? dp[i−1][j−1] + 1 : max(dp[i−1][j], dp[i][j−1])<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"graphs-bfs-dfs\" data-tip=\"Read a graph with n vertices and m edges into an adjacency list (1-indexed, two-way edges).\">\n<pre data-part=\"main\"><code class=\"cpp\">\nvector&lt;vector&lt;int&gt;&gt; g(n + 1);\nfor (int i = 0; i &lt; m; i++) {\n    int u, v; cin &gt;&gt; u &gt;&gt; v;\n    g[u].push_back(v);\n    g[v].push_back(u);\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"graphs-bfs-dfs\" data-tip=\"DFS: visit everything you can reach from v. Call it once per unvisited vertex to count connected components.\">\n<pre data-part=\"global\"><code class=\"cpp\">\nvector&lt;vector&lt;int&gt;&gt; g; vector&lt;bool&gt; vis;\nvoid dfs(int v) {\n    vis[v] = true;\n    for (int u : g[v]) if (!vis[u]) dfs(u);\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"graphs-bfs-dfs\" data-tip=\"BFS: shortest distance (number of edges) from s to every vertex. −1 means not reachable.\">\n<pre data-part=\"global\"><code class=\"cpp\">\nvector&lt;int&gt; bfs(int s, const vector&lt;vector&lt;int&gt;&gt; &amp;g) {\n    vector&lt;int&gt; dist(g.size(), -1);\n    queue&lt;int&gt; q; q.push(s); dist[s] = 0;\n    while (!q.empty()) {\n        int v = q.front(); q.pop();\n        for (int u : g[v]) if (dist[u] == -1) {\n            dist[u] = dist[v] + 1;\n            q.push(u);\n        }\n    }\n    return dist;\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"graphs-bfs-dfs\" data-tip=\"Moving on a grid: the four neighbours of cell (x, y) and the check that a cell is inside.\">\n<pre data-part=\"main\"><code class=\"cpp\">\nint dx[4] = {1, -1, 0, 0}, dy[4] = {0, 0, 1, -1};\nfor (int d = 0; d &lt; 4; d++) {\n    int nx = x + dx[d], ny = y + dy[d];\n    if (nx &lt; 0 || ny &lt; 0 || nx &gt;= n || ny &gt;= m) continue;\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"dijkstra\" data-tip=\"Dijkstra: shortest path when edges have weights ≥ 0. O((n + m) log n).\">\n<pre data-part=\"global\"><code class=\"cpp\">\nconst long long INF = 1e18;\nvector&lt;long long&gt; dijkstra(int s,\n        const vector&lt;vector&lt;pair&lt;int,long long&gt;&gt;&gt; &amp;g) {\n    vector&lt;long long&gt; dist(g.size(), INF);\n    priority_queue&lt;pair&lt;long long,int&gt;,\n        vector&lt;pair&lt;long long,int&gt;&gt;, greater&lt;&gt;&gt; pq;\n    dist[s] = 0; pq.push({0, s});\n    while (!pq.empty()) {\n        auto [d, v] = pq.top(); pq.pop();\n        if (d &gt; dist[v]) continue;\n        for (auto [u, w] : g[v])\n            if (dist[v] + w &lt; dist[u]) {\n                dist[u] = dist[v] + w;\n                pq.push({dist[u], u});\n            }\n    }\n    return dist;\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"dijkstra\" data-tip=\"Which shortest-path tool to use.\">\n    <table>\n      <tr><td>no weights<\/td><td>BFS<\/td><\/tr>\n      <tr><td>weights ≥ 0<\/td><td>Dijkstra<\/td><\/tr>\n      <tr><td>negative weights<\/td><td>Bellman-Ford<\/td><\/tr>\n      <tr><td>all pairs, n ≤ 500<\/td><td>Floyd-Warshall<\/td><\/tr>\n    <\/table>\n  <\/div>\n  <div class=\"cc\" data-to=\"trees\" data-tip=\"One DFS on a tree: depth goes down from the parent, subtree size comes up from the children.\">\n<pre data-part=\"global\"><code class=\"cpp\">\nvector&lt;vector&lt;int&gt;&gt; g; vector&lt;int&gt; depth, sz;\nvoid dfs(int v, int p) {\n    sz[v] = 1;\n    for (int u : g[v]) if (u != p) {\n        depth[u] = depth[v] + 1;\n        dfs(u, v);\n        sz[v] += sz[u];\n    }\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"trees\" data-tip=\"Facts about every tree.\">\n    <div class=\"fx\">n vertices, n − 1 edges<\/div>\n    <div class=\"fx\">connected, no cycle<\/div>\n    <div class=\"fx\">one path between any two vertices<\/div>\n  <\/div>\n  <div class=\"cc\" data-to=\"dsu\" data-tip=\"DSU: merge groups and ask 'are these two in the same group?'. Almost O(1) per call.\">\n<pre data-part=\"global\"><code class=\"cpp\">\nstruct DSU {\n    vector&lt;int&gt; p, sz;\n    DSU(int n) : p(n + 1), sz(n + 1, 1) {\n        iota(p.begin(), p.end(), 0);\n    }\n    int find(int x) { return p[x] == x ? x : p[x] = find(p[x]); }\n    bool unite(int a, int b) {\n        a = find(a); b = find(b);\n        if (a == b) return false;\n        if (sz[a] &lt; sz[b]) swap(a, b);\n        p[b] = a; sz[a] += sz[b];\n        return true;\n    }\n};\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"toposort\" data-tip=\"Topological sort (Kahn): an order where every edge goes forward. If the order has fewer than n vertices, there is a cycle.\">\n<pre data-part=\"global\"><code class=\"cpp\">\nvector&lt;int&gt; topo(int n, const vector&lt;vector&lt;int&gt;&gt; &amp;g) {\n    vector&lt;int&gt; in(n + 1, 0), order;\n    for (int v = 1; v &lt;= n; v++) for (int u : g[v]) in[u]++;\n    queue&lt;int&gt; q;\n    for (int v = 1; v &lt;= n; v++) if (in[v] == 0) q.push(v);\n    while (!q.empty()) {\n        int v = q.front(); q.pop();\n        order.push_back(v);\n        for (int u : g[v]) if (--in[u] == 0) q.push(u);\n    }\n    return order;          // size &lt; n  =&gt;  cycle\n}\n<\/code><\/pre>\n  <\/div>\n  <div class=\"cc\" data-to=\"interactive\" data-tip=\"Interactive problems: print a question, flush (endl does it), then read the reply.\">\n<pre data-part=\"main\"><code class=\"cpp\">\ncout &lt;&lt; \"? \" &lt;&lt; mid &lt;&lt; endl;   // endl = flush\nstring reply; cin &gt;&gt; reply;\ncout &lt;&lt; \"! \" &lt;&lt; answer &lt;&lt; endl;\n<\/code><\/pre>\n  <\/div>\n<\/div>\n<\/section>\n","how-codeforces-works":"<p class=\"idea\">Codeforces gives you problems. You send code. A <span class=\"term\" data-t=\"judge\">judge<\/span> runs it on hidden tests and answers in a few seconds.<\/p>\n\n<section>\n  <h2>Start in 10 minutes<\/h2>\n  <ol>\n    <li>Open <a href=\"https://codeforces.com/\">codeforces.com<\/a> and press <b>Register<\/b>. Pick a handle (your name on the site).<\/li>\n    <li>Open <b>Problemset<\/b> and find problem <a class=\"cf\" data-p=\"4A\">Watermelon<\/a>.<\/li>\n    <li>Write the code on your computer. Test it with the <span class=\"term\" data-t=\"sample\">samples<\/span>.<\/li>\n    <li>Press <b>Submit<\/b>. Choose the language <b>GNU G++17<\/b> or a newer one (G++20, G++23). Paste your code.<\/li>\n    <li>Watch <b>My submissions<\/b>. You want the green word <b>Accepted<\/b>.<\/li>\n  <\/ol>\n<\/section>\n\n<section>\n  <h2>Two places to solve<\/h2>\n  <table>\n    <tr><th>Place<\/th><th>What it is<\/th><th>Use it for<\/th><\/tr>\n    <tr><td><b>Problemset<\/b><\/td><td>All old problems. No timer. You can filter by <span class=\"term\" data-t=\"rating\">rating<\/span> and topic.<\/td><td>Daily practice.<\/td><\/tr>\n    <tr><td><b>Contests<\/b><\/td><td>A <span class=\"term\" data-t=\"contest\">contest<\/span> has 5–8 new problems and lasts about 2 hours.<\/td><td>Testing yourself. Your rating changes here.<\/td><\/tr>\n  <\/table>\n  <p>Problems in a contest have letters: <b>A, B, C, D…<\/b> A is the easiest. Each next letter is harder.<\/p>\n  <p class=\"note\">A problem name like <b>4A<\/b> means contest 4, problem A. A problem rating like 800 shows how hard it is. 800 is the easiest.<\/p>\n<\/section>\n\n<section>\n  <h2>Which contests to join<\/h2>\n  <p>Each contest has a <span class=\"term\" data-t=\"division\">division<\/span>. It shows the level.<\/p>\n  <table>\n    <tr><th>Contest<\/th><th>Level<\/th><th>For you now?<\/th><\/tr>\n    <tr><td class=\"hi\">Div. 4<\/td><td>The easiest<\/td><td class=\"hi\">Yes. Start here.<\/td><\/tr>\n    <tr><td class=\"hi\">Div. 3<\/td><td>Easy<\/td><td class=\"hi\">Yes.<\/td><\/tr>\n    <tr><td class=\"hi\">Educational Round<\/td><td>Like Div. 2, with classic ideas<\/td><td class=\"hi\">Yes. Solve A and B.<\/td><\/tr>\n    <tr><td>Div. 2<\/td><td>Medium<\/td><td>Yes, after a few contests. Problem A is still easy.<\/td><\/tr>\n    <tr><td>Div. 1<\/td><td>Hard, for rating 1900+<\/td><td>Not yet.<\/td><\/tr>\n  <\/table>\n  <p class=\"tip-box\">You must <b>register<\/b> for a contest before it starts. The button is on the Contests page.<\/p>\n<\/section>\n\n<section>\n  <h2>Rating and colours<\/h2>\n  <p>After each contest your rating goes up or down. Your handle gets a colour.<\/p>\n  <table>\n    <tr><th>Rating<\/th><th>Rank<\/th><th>Colour<\/th><\/tr>\n    <tr><td>below 1200<\/td><td>Newbie<\/td><td>gray<\/td><\/tr>\n    <tr><td>1200 – 1399<\/td><td>Pupil<\/td><td>green<\/td><\/tr>\n    <tr><td>1400 – 1599<\/td><td>Specialist<\/td><td>cyan<\/td><\/tr>\n    <tr><td class=\"hi\">1600 – 1899<\/td><td class=\"hi\">Expert<\/td><td class=\"hi\">blue — the goal of this guide<\/td><\/tr>\n  <\/table>\n<\/section>\n\n<section>\n  <h2>What the judge tells you<\/h2>\n  <p>The answer of the judge is called a <span class=\"term\" data-t=\"verdict\">verdict<\/span>. \"Wrong answer on test 3\" means tests 1 and 2 passed.<\/p>\n  <table>\n    <tr><th>Verdict<\/th><th>What it means<\/th><th>What to do first<\/th><\/tr>\n    <tr><td class=\"hi\"><b>Accepted<\/b><\/td><td>All tests passed.<\/td><td>Go to the next problem.<\/td><\/tr>\n    <tr><td><b>Wrong answer<\/b> (WA)<\/td><td>Your program printed a wrong <span class=\"term\" data-t=\"output\">output<\/span>.<\/td><td>Read the statement again. Test small special inputs.<\/td><\/tr>\n    <tr><td><b>Time limit exceeded<\/b> (TLE)<\/td><td>Your program is too slow, or it never stops.<\/td><td>Count your steps from the limits. See <a href=\"#complexity\">Limits → speed<\/a>.<\/td><\/tr>\n    <tr><td><b>Memory limit exceeded<\/b> (MLE)<\/td><td>Your program uses too much memory.<\/td><td>Check the size of your arrays.<\/td><\/tr>\n    <tr><td><b>Runtime error<\/b> (RE)<\/td><td>Your program crashed.<\/td><td>Look for an index outside the array or a division by zero.<\/td><\/tr>\n    <tr><td><b>Compilation error<\/b> (CE)<\/td><td>The code does not <span class=\"term\" data-t=\"compile\">compile<\/span>.<\/td><td>Click the verdict to read the error. Check the language you chose.<\/td><\/tr>\n  <\/table>\n  <p class=\"note\">More help for each verdict: <a href=\"#debugging\">How to find your bug<\/a>.<\/p>\n<\/section>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>You submit without running the samples on your computer first.<\/li>\n    <li>You print extra text like \"Enter n:\". The judge wants only the answer.<\/li>\n    <li>You start with Div. 2 problem D. Start with A and B.<\/li>\n    <li>You are afraid to lose rating, so you do not join contests. Join them. See <a href=\"#how-to-practice\">How to practice<\/a>.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Your first problem<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"4A\">Watermelon<\/a><span class=\"r\">800<\/span><\/li>\n  <\/ol>\n<\/section>\n","read-a-problem":"<p class=\"idea\">Most wrong answers come from reading too fast. Use the same reading steps for every problem.<\/p>\n\n<section>\n  <h2>The routine<\/h2>\n  <ol>\n    <li><b>Read the limits first.<\/b> Look at the <span class=\"term\" data-t=\"constraints\">constraints<\/span>, the <span class=\"term\" data-t=\"time-limit\">time limit<\/span> and the memory limit. They tell you how fast your code must be.<\/li>\n    <li><b>Read the story.<\/b> Then say the task in <b>one sentence<\/b>, in your own words.<\/li>\n    <li><b>Read the Input and Output parts.<\/b> What do you read? What exactly do you print?<\/li>\n    <li><b>Run the <span class=\"term\" data-t=\"sample\">samples<\/span> by hand.<\/b> Use paper. Get the same answers as the statement.<\/li>\n    <li><b>Read the Note.<\/b> It is at the end. It often explains the samples.<\/li>\n    <li><b>Look for trap words.<\/b> See the table below.<\/li>\n  <\/ol>\n  <p class=\"tip-box\">Do not write code before step 4 works. If your hand answer is different, you did not understand the task yet.<\/p>\n<\/section>\n\n<section>\n  <h2>Example: problem 4A<\/h2>\n  <div class=\"way\">\n    <h3><b>The task in short<\/b><\/h3>\n    <p>Two friends have one watermelon. It weighs <code>w<\/code> kilos (1 ≤ w ≤ 100). They cut it into two parts. Each part must weigh an <span class=\"term\" data-t=\"even\">even<\/span> number of kilos. The parts can be different. Print YES if this is possible, else NO.<\/p>\n    <table>\n      <tr><th>Step<\/th><th>What you find<\/th><\/tr>\n      <tr><td>Limits<\/td><td>w ≤ 100. Very small. Any solution is fast enough.<\/td><\/tr>\n      <tr><td>One sentence<\/td><td>\"Can I write w as even + even?\"<\/td><\/tr>\n      <tr><td>Sample by hand<\/td><td>w = 8 → 2 + 6 → YES.<\/td><\/tr>\n      <tr><td>Trap<\/td><td>Each part must be more than 0. So w = 2 is only 1 + 1 → NO.<\/td><\/tr>\n      <tr><td>Output<\/td><td>The word YES or NO.<\/td><\/tr>\n    <\/table>\n    <p>Now the answer is easy: YES when w is even <b>and<\/b> w &gt; 2.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2>Trap words<\/h2>\n  <table>\n    <tr><th>Word<\/th><th>Meaning<\/th><\/tr>\n    <tr><td><span class=\"term\" data-t=\"distinct\">distinct<\/span><\/td><td>All different. No two are equal.<\/td><\/tr>\n    <tr><td>at least k / at most k<\/td><td>≥ k / ≤ k. Not &gt; and not &lt;.<\/td><\/tr>\n    <tr><td><span class=\"term\" data-t=\"subarray\">subarray<\/span>, <span class=\"term\" data-t=\"substring\">substring<\/span><\/td><td>A part with <b>no gaps<\/b>: [3, 4, 5] inside [2, 3, 4, 5, 6].<\/td><\/tr>\n    <tr><td><span class=\"term\" data-t=\"subsequence\">subsequence<\/span><\/td><td>Same order, but <b>gaps are allowed<\/b>: [2, 4, 6] inside [2, 3, 4, 5, 6].<\/td><\/tr>\n    <tr><td><span class=\"term\" data-t=\"permutation\">permutation<\/span><\/td><td>The numbers 1…n, each one time: [3, 1, 2].<\/td><\/tr>\n    <tr><td>\"print any valid answer\"<\/td><td>Many answers are correct. Yours can differ from the sample.<\/td><\/tr>\n    <tr><td>1-indexed<\/td><td>The statement counts from 1. Your C++ array counts from 0.<\/td><\/tr>\n    <tr><td>non-negative / positive<\/td><td>≥ 0 / &gt; 0. Zero is not positive.<\/td><\/tr>\n  <\/table>\n<\/section>\n\n<section>\n  <h2>Many test cases<\/h2>\n  <p>Many problems begin with a number <code>t<\/code>. It is the number of <span class=\"term\" data-t=\"test-case\">test cases<\/span> in one input. You solve the task <code>t<\/code> times and print <code>t<\/code> answers.<\/p>\n  <p>Then you often see this line: <b>\"the sum of n over all test cases does not exceed 2·10<sup>5<\/sup>\"<\/b>.<\/p>\n  <p>It means: add the <code>n<\/code> of every test case. The total is at most 2·10<sup>5<\/sup>. So all the tests together are like <b>one<\/b> test with n = 2·10<sup>5<\/sup>. You do not multiply by <code>t<\/code>.<\/p>\n  <p class=\"note\">If this line is missing, the worst case is t × n. Count your steps with that number.<\/p>\n<\/section>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>You skip the limits. Then you write a solution that is too slow.<\/li>\n    <li>You print \"Yes\" when the statement asks for \"YES\". Copy the word from the statement.<\/li>\n    <li>You forget to read <code>t<\/code>, or you forget to clear your variables between test cases.<\/li>\n    <li>You see a different answer in the sample and think you are wrong. Check for \"print any\".<\/li>\n  <\/ul>\n<\/section>\n","cpp-template":"<p class=\"idea\">Start every problem from the same small file. Then you think about the problem, not about the setup.<\/p>\n\n<section>\n  <h2>The template<\/h2>\n  <p>This <span class=\"term\" data-t=\"template\">template<\/span> is a full program. Here <code>solve()<\/code> reads an array and prints YES if its sum is even. For a new problem you change only <code>solve()<\/code>.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nvoid solve() {\n    int n;\n    cin &gt;&gt; n;\n    vector&lt;int&gt; a(n);\n    for (int i = 0; i &lt; n; i++) cin &gt;&gt; a[i];\n\n    long long sum = 0;\n    for (int x : a) sum += x;\n\n    if (sum % 2 == 0) cout &lt;&lt; \"YES\\n\";\n    else              cout &lt;&lt; \"NO\\n\";\n}\n\nint main() {\n    ios::sync_with_stdio(false);\n    cin.tie(nullptr);\n\n    int t;\n    cin &gt;&gt; t;\n    while (t--) solve();\n}\n<\/code><\/pre>\n  <p class=\"note\">Input <code>2 / 3 / 1 2 3 / 2 / 1 2<\/code> (two test cases) gives <code>YES<\/code> then <code>NO<\/code>.<\/p>\n<\/section>\n\n<section>\n  <h2>Line by line<\/h2>\n  <table>\n    <tr><th>Line<\/th><th>What it does<\/th><\/tr>\n    <tr><td><code>#include &lt;bits/stdc++.h&gt;<\/code><\/td><td>Brings in all of standard C++ with one line.<\/td><\/tr>\n    <tr><td><code>using namespace std;<\/code><\/td><td>You write <code>cin<\/code>, not <code>std::cin<\/code>.<\/td><\/tr>\n    <tr><td><code>void solve()<\/code><\/td><td>Solves <b>one<\/b> test case. Its variables are new each time.<\/td><\/tr>\n    <tr><td><code>vector&lt;int&gt; a(n);<\/code><\/td><td>An <span class=\"term\" data-t=\"array\">array<\/span> of n numbers, positions 0 … n−1.<\/td><\/tr>\n    <tr><td><code>ios::sync_with_stdio(false);<\/code><br><code>cin.tie(nullptr);<\/code><\/td><td>Makes <code>cin<\/code> and <code>cout<\/code> fast. Needed for big <span class=\"term\" data-t=\"input\">input<\/span>.<\/td><\/tr>\n    <tr><td><code>while (t--) solve();<\/code><\/td><td>Runs <code>solve()<\/code> once for each test case.<\/td><\/tr>\n    <tr><td><code>\"\\n\"<\/code><\/td><td>A new line. Fast.<\/td><\/tr>\n  <\/table>\n  <p class=\"tip-box\">The problem has no <code>t<\/code>? Delete <code>cin &gt;&gt; t;<\/code> and write <code>int t = 1;<\/code>.<\/p>\n<\/section>\n\n<section>\n  <h2>Small pieces you use every day<\/h2>\n  <p>Read an array, the short way:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nint n;\ncin &gt;&gt; n;\nvector&lt;long long&gt; a(n);\nfor (auto &amp;x : a) cin &gt;&gt; x;      // the &amp; is needed: it writes into the array\n<\/code><\/pre>\n  <p>Print YES or NO from a <code>bool<\/code>:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nbool ok = (n % 2 == 0);\ncout &lt;&lt; (ok ? \"YES\" : \"NO\") &lt;&lt; \"\\n\";\n<\/code><\/pre>\n  <p>Print an array on one line:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nfor (int i = 0; i &lt; n; i++) cout &lt;&lt; a[i] &lt;&lt; \" \";\ncout &lt;&lt; \"\\n\";\n<\/code><\/pre>\n<\/section>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>You use <code>endl<\/code>. It is slow when you print many lines. Use <code>\"\\n\"<\/code>.<\/li>\n    <li>You mix <code>scanf<\/code>/<code>printf<\/code> with <code>cin<\/code>/<code>cout<\/code> after <code>sync_with_stdio(false)<\/code>. The order of the input and output can break. Use only <code>cin<\/code> and <code>cout<\/code>.<\/li>\n    <li>You make a global array and forget to clear it for the next test case. Keep variables inside <code>solve()<\/code>.<\/li>\n    <li>You write <code>for (auto x : a) cin &gt;&gt; x;<\/code> without <code>&amp;<\/code>. The array stays empty.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/\">USACO Guide<\/a> — open \"General\" for input, output and setup help.<\/li>\n    <li><a href=\"https://en.cppreference.com/w/cpp/container\">cppreference: containers<\/a> — the full list of what <code>vector<\/code> and friends can do.<\/li>\n  <\/ul>\n<\/section>\n","complexity":"<p class=\"idea\">The judge does about 10<sup>8<\/sup> simple steps in one second. Read the limits, count your steps, and you know if your idea is fast enough.<\/p>\n\n<section class=\"spot\">\n  <h2>Use it on every problem<\/h2>\n  <ul>\n    <li>Before you write code: look at the biggest <code>n<\/code> in the <span class=\"term\" data-t=\"constraints\">constraints<\/span>.<\/li>\n    <li>Count the steps of your idea for that <code>n<\/code>.<\/li>\n    <li>About 10<sup>8<\/sup> or less → fine. 10<sup>9<\/sup> or more → too slow. Find a better idea.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>The key table<\/h2>\n  <p>O(…) is a short way to write \"how many steps\". It is called <span class=\"term\" data-t=\"complexity\">complexity<\/span>. This table tells you which one the problem wants.<\/p>\n  <table>\n    <tr><th>Biggest n<\/th><th>Speed that fits<\/th><th>Usual idea<\/th><\/tr>\n    <tr><td>n ≤ 10 – 11<\/td><td>O(n!)<\/td><td>Try every order.<\/td><\/tr>\n    <tr><td>n ≤ 20<\/td><td>O(2<sup>n<\/sup>)<\/td><td>Try every \"take it or not\".<\/td><\/tr>\n    <tr><td>n ≤ 500<\/td><td>O(n<sup>3<\/sup>)<\/td><td>Three loops.<\/td><\/tr>\n    <tr><td>n ≤ 5000<\/td><td>O(n<sup>2<\/sup>)<\/td><td>Two loops: all pairs.<\/td><\/tr>\n    <tr><td class=\"hi\">n ≤ 2·10<sup>5<\/sup> (or 10<sup>6<\/sup>)<\/td><td class=\"hi\">O(n log n) or O(n)<\/td><td class=\"hi\">Sort, one loop, binary search, map.<\/td><\/tr>\n    <tr><td>n ≤ 10<sup>9<\/sup> – 10<sup>12<\/sup><\/td><td>O(√n)<\/td><td>Loop while i·i ≤ n.<\/td><\/tr>\n    <tr><td>n ≤ 10<sup>9<\/sup> – 10<sup>18<\/sup><\/td><td>O(log n) or O(1)<\/td><td>A formula, or halving.<\/td><\/tr>\n  <\/table>\n  <p class=\"tip-box\">The row n ≤ 2·10<sup>5<\/sup> is the most common one. It means: <b>two loops over n are too slow.<\/b><\/p>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — walk or fly<\/h3>\n    <p>You must travel 1000 km and you have one day. You can walk, drive or fly. You do not start walking and hope. You look at the distance first, then you choose.<\/p>\n    <p>The limits are the distance. The time limit is your one day. O(n<sup>2<\/sup>) is walking. O(n log n) is driving. O(log n) is flying.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — how many steps<\/h3>\n    <table>\n      <tr><th>n<\/th><th>log n<\/th><th>n<\/th><th>n log n<\/th><th>n<sup>2<\/sup><\/th><\/tr>\n      <tr><td>10<\/td><td>about 3<\/td><td>10<\/td><td>about 33<\/td><td>100<\/td><\/tr>\n      <tr><td>1000<\/td><td>about 10<\/td><td>1000<\/td><td>about 10 000<\/td><td>10<sup>6<\/sup><\/td><\/tr>\n      <tr><td>10<sup>5<\/sup><\/td><td>about 17<\/td><td>10<sup>5<\/sup><\/td><td>about 1.7·10<sup>6<\/sup><\/td><td class=\"hi\">10<sup>10<\/sup> — about 100 seconds<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">For small n everything is fast. For n = 10<sup>5<\/sup> the n<sup>2<\/sup> idea gets Time limit exceeded.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — count the loops<\/h3>\n    <p><b>O(n)<\/b> — one loop:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nlong long sum = 0;\nfor (int i = 0; i &lt; n; i++) sum += a[i];          // n steps\n<\/code><\/pre>\n    <p><b>O(n<sup>2<\/sup>)<\/b> — a <span class=\"term\" data-t=\"nested-loop\">nested loop<\/span>:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nint pairs = 0;\nfor (int i = 0; i &lt; n; i++)\n    for (int j = i + 1; j &lt; n; j++)               // about n * n / 2 steps\n        if (a[i] == a[j]) pairs++;\n<\/code><\/pre>\n    <p><b>O(log n)<\/b> — the number is cut in half each time:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nint steps = 0;\nwhile (n &gt; 1) {                                   // 10^9 -&gt; 1 in about 30 steps\n    n /= 2;\n    steps++;\n}\n<\/code><\/pre>\n    <p class=\"note\"><code>sort<\/code> is O(n log n). One <code>map<\/code> or <code>set<\/code> operation is O(log n).<\/p>\n  <\/div>\n<\/section>\n\n<p class=\"complexity\">Rule: put the biggest n into your O(…). Result ≤ about 10<sup>8<\/sup> → OK for 1 second.<\/p>\n\n<section>\n  <h2>With t test cases<\/h2>\n  <p>If the statement says \"the sum of n over all test cases ≤ 2·10<sup>5<\/sup>\", use that <b>sum<\/b> as your n. An O(n) solution for each test is fine.<\/p>\n  <p>If it does not say this, multiply: steps = t × (steps for one test).<\/p>\n<\/section>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>You write two loops for n = 2·10<sup>5<\/sup>. That is 4·10<sup>10<\/sup> steps.<\/li>\n    <li>A hidden loop: <code>a.erase(a.begin())<\/code>, <code>count(...)<\/code> or <code>s.substr(...)<\/code> inside a loop is O(n) each time.<\/li>\n    <li>You clear a big array of size 10<sup>6<\/sup> in <b>every<\/b> test case. With t = 10<sup>4<\/sup> this is 10<sup>10<\/sup> steps.<\/li>\n    <li>You make a fast, hard solution when n ≤ 100. Small limits mean: the simple way is enough.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/bronze/time-comp\">USACO Guide: Time Complexity<\/a> — the same idea with more examples.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book, chapter 2 \"Time complexity\".<\/li>\n  <\/ul>\n<\/section>\n","overflow":"<p class=\"idea\">An <code>int<\/code> holds only about 2·10<sup>9<\/sup>. If a value, a sum or a product can be bigger, use <code>long long<\/code>.<\/p>\n\n<section class=\"spot\">\n  <h2>Ask this on every problem<\/h2>\n  <ul>\n    <li>What is the <b>biggest number<\/b> my program can make? Not only the input: also every sum and every <span class=\"term\" data-t=\"product\">product<\/span>.<\/li>\n    <li>Bigger than 2·10<sup>9<\/sup>? Then that variable must be <code>long long<\/code>.<\/li>\n    <li>If it does not fit, you get <span class=\"term\" data-t=\"overflow\">overflow<\/span>: no error, no warning, only a wrong number.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>The types and their limits<\/h2>\n  <p>Each <span class=\"term\" data-t=\"data-type\">type<\/span> has a biggest value. Remember the \"about\" column.<\/p>\n  <table>\n    <tr><th>Type<\/th><th>Biggest value<\/th><th>About<\/th><th>Use it for<\/th><\/tr>\n    <tr><td><code>int<\/code><\/td><td>2 147 483 647 (2<sup>31<\/sup> − 1)<\/td><td class=\"hi\">2·10<sup>9<\/sup><\/td><td>n, indexes, small values<\/td><\/tr>\n    <tr><td><code>long long<\/code><\/td><td>9 223 372 036 854 775 807 (2<sup>63<\/sup> − 1)<\/td><td class=\"hi\">9·10<sup>18<\/sup><\/td><td>sums, products, big answers<\/td><\/tr>\n    <tr><td><code>double<\/code><\/td><td>very big, but not exact<\/td><td>15–16 correct digits<\/td><td>only answers with a decimal point<\/td><\/tr>\n  <\/table>\n  <p class=\"note\">Negative numbers have the same limits with a minus sign.<\/p>\n<\/section>\n\n<section>\n  <h2>The classic traps<\/h2>\n  <table>\n    <tr><th>You compute<\/th><th>Limits<\/th><th>Biggest result<\/th><th>Fits in int?<\/th><\/tr>\n    <tr><td>a × b<\/td><td>a, b ≤ 10<sup>5<\/sup><\/td><td>10<sup>10<\/sup><\/td><td class=\"hi\">no<\/td><\/tr>\n    <tr><td>a × b<\/td><td>a, b ≤ 10<sup>9<\/sup><\/td><td>10<sup>18<\/sup><\/td><td class=\"hi\">no<\/td><\/tr>\n    <tr><td>sum of n numbers<\/td><td>n ≤ 2·10<sup>5<\/sup>, each ≤ 10<sup>9<\/sup><\/td><td>2·10<sup>14<\/sup><\/td><td class=\"hi\">no<\/td><\/tr>\n    <tr><td>n × (n + 1) / 2<\/td><td>n ≤ 10<sup>5<\/sup><\/td><td>about 5·10<sup>9<\/sup><\/td><td class=\"hi\">no<\/td><\/tr>\n    <tr><td>a + b<\/td><td>a, b ≤ 10<sup>9<\/sup><\/td><td>2·10<sup>9<\/sup><\/td><td>yes, but only just<\/td><\/tr>\n  <\/table>\n<\/section>\n\n<section>\n  <h2>Three ways to understand it<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — the car counter<\/h3>\n    <p>An old car shows its kilometres with 6 digits. After 999 999 it shows 000 000 again. The car did not break. The counter just has no more room.<\/p>\n    <p>An <code>int<\/code> is the same. After 2 147 483 647 it jumps to a wrong number, often a negative one.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — where the product is made<\/h3>\n    <p>C++ computes the right side first, <b>then<\/b> stores it. The type of the right side comes from the numbers in it, not from the variable on the left.<\/p>\n    <table>\n      <tr><th>Line<\/th><th>Right side is computed as<\/th><th>Result for a = b = 100000<\/th><\/tr>\n      <tr><td><code>long long c = a * b;<\/code><\/td><td>int × int → int<\/td><td class=\"hi\">1410065408 (wrong)<\/td><\/tr>\n      <tr><td><code>long long c = 1LL * a * b;<\/code><\/td><td>long long × int → long long<\/td><td>10000000000 (right)<\/td><\/tr>\n    <\/table>\n    <p class=\"note\"><code>1LL<\/code> is the number 1 as a <code>long long<\/code>. Put it <b>first<\/b>, so everything after it is computed in <code>long long<\/code>.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — see it yourself<\/h3>\n    <p>Run this with the input <code>100000 100000<\/code>.<\/p>\n<pre><code class=\"cpp\">\n#include &lt;bits/stdc++.h&gt;\nusing namespace std;\n\nint main() {\n    int a, b;\n    cin &gt;&gt; a &gt;&gt; b;\n\n    long long wrong = a * b;          // int * int: overflows BEFORE it is stored\n    long long right = 1LL * a * b;    // long long * int: no overflow\n\n    cout &lt;&lt; \"wrong: \" &lt;&lt; wrong &lt;&lt; \"\\n\";   // some garbage, often 1410065408\n    cout &lt;&lt; \"right: \" &lt;&lt; right &lt;&lt; \"\\n\";   // 10000000000\n}\n<\/code><\/pre>\n    <p>The same fix for a sum: make the <b>sum<\/b> variable <code>long long<\/code>.<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nlong long sum = 0;                        // not int!\nfor (int i = 0; i &lt; n; i++) sum += a[i];  // a[i] can stay int\n\nlong long total = 1LL * n * (n + 1) / 2;  // 1 + 2 + ... + n\n<\/code><\/pre>\n  <\/div>\n<\/section>\n\n<p class=\"tip-box\">Not sure? Make it <code>long long<\/code>. It is almost never too slow. A wrong answer from overflow costs you much more.<\/p>\n\n<section>\n  <h2>double is not exact<\/h2>\n  <p>A <span class=\"term\" data-t=\"floating-point\">floating-point number<\/span> keeps only 15–16 digits. A <code>long long<\/code> can have 19. So functions that work with <code>double<\/code> can give a slightly wrong result for big integers.<\/p>\n  <table>\n    <tr><th>Do not write<\/th><th>Why<\/th><th>Write<\/th><\/tr>\n    <tr><td><code>pow(a, b)<\/code><\/td><td>returns a double, may be off by 1<\/td><td>a loop that multiplies<\/td><\/tr>\n    <tr><td><code>ceil(a / b)<\/code> with integers<\/td><td><code>a / b<\/code> is already rounded down<\/td><td><code>(a + b - 1) / b<\/code><\/td><\/tr>\n    <tr><td><code>sqrt(x)<\/code> for big x<\/td><td>may be off by 1<\/td><td>check <code>r * r<\/code> and fix r by ±1<\/td><\/tr>\n    <tr><td><code>a / b == c<\/code> with doubles<\/td><td>not <span class=\"term\" data-t=\"exact\">exact<\/span><\/td><td><code>a == b * c<\/code> with integers<\/td><\/tr>\n  <\/table>\n  <p>To <span class=\"term\" data-t=\"round-up\">round up<\/span> a division of positive integers, stay in integers:<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nlong long n, m, a;                     // problem 1A: n, m, a up to 10^9\ncin &gt;&gt; n &gt;&gt; m &gt;&gt; a;\nlong long rows = (n + a - 1) / a;      // n / a rounded up\nlong long cols = (m + a - 1) / a;      // m / a rounded up\ncout &lt;&lt; rows * cols &lt;&lt; \"\\n\";           // up to 10^18: needs long long\n<\/code><\/pre>\n<\/section>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li><code>long long c = a * b;<\/code> with <code>int a, b<\/code>. The left side does not help. Write <code>1LL * a * b<\/code>.<\/li>\n    <li>You read a number up to 10<sup>12<\/sup> into an <code>int<\/code>. Check the limits of the <b>input<\/b> too.<\/li>\n    <li><code>for (int i = 1; i * i &lt;= n; i++)<\/code> with big <code>n<\/code>: <code>i * i<\/code> overflows. Make <code>i<\/code> a <code>long long<\/code>.<\/li>\n    <li><code>long long<\/code> also has a limit. 10<sup>18<\/sup> × 10 does not fit. Three numbers up to 10<sup>9<\/sup> cannot be multiplied directly.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"practice\">\n  <h2>Practice ladder<\/h2>\n  <ol>\n    <li><a class=\"cf\" data-p=\"617A\">Elephant<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"546A\">Soldier and Bananas<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"486A\">Calculating Function<\/a><span class=\"r\">800<\/span><\/li>\n    <li><a class=\"cf\" data-p=\"1A\">Theatre Square<\/a><span class=\"r\">1000<\/span><\/li>\n  <\/ol>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://usaco.guide/general/data-types\">USACO Guide: Data Types<\/a> — the same limits, with more words on double.<\/li>\n    <li><a href=\"https://cses.fi/book/book.pdf\">Competitive Programmer's Handbook<\/a> — free book, chapter 1 \"Working with numbers\".<\/li>\n  <\/ul>\n<\/section>\n","how-to-practice":"<p class=\"idea\">Solve a few problems a little above your level, every day. Think first, read the solution late, then write the code yourself.<\/p>\n\n<section class=\"spot\">\n  <h2>The practice loop<\/h2>\n  <ol>\n    <li><b>Pick<\/b> a problem at your <span class=\"term\" data-t=\"rating\">rating<\/span>, or up to 200 above it. No rating yet? Start with 800.<\/li>\n    <li><b>Think<\/b> for 20–40 minutes. Use paper. Try small examples by hand.<\/li>\n    <li><b>Stuck?<\/b> Open the <span class=\"term\" data-t=\"editorial\">editorial<\/span>. Read only until you get the idea. Then close it.<\/li>\n    <li><b>Write the code yourself<\/b> and get Accepted. Reading a solution is not solving.<\/li>\n    <li><b>Write one line<\/b> in your notebook: the trick you learned.<\/li>\n  <\/ol>\n<\/section>\n\n<section>\n  <h2>How to pick problems<\/h2>\n  <p>Open the <a href=\"https://codeforces.com/problemset\">Problemset<\/a> on Codeforces. Set the rating filter, for example 800 to 1000. Then sort by the number of people who solved each problem.<\/p>\n  <table>\n    <tr><th>The problem feels…<\/th><th>What it means<\/th><th>What to do<\/th><\/tr>\n    <tr><td>easy, solved in 5 minutes<\/td><td>you learn little<\/td><td>go up by 100<\/td><\/tr>\n    <tr><td class=\"hi\">hard, but you solve about half alone<\/td><td class=\"hi\">the best level<\/td><td class=\"hi\">stay here<\/td><\/tr>\n    <tr><td>impossible, even with the editorial<\/td><td>too far for now<\/td><td>go down by 100–200<\/td><\/tr>\n  <\/table>\n  <p class=\"tip-box\">More solvers = a fairer problem for its rating. Start with the most-solved problems. Leave the strange ones for later.<\/p>\n  <p>The practice ladders in this guide are built the same way. They are sorted by the official rating, then by how many people solved each problem.<\/p>\n<\/section>\n\n<section>\n  <h2>Three rules that matter most<\/h2>\n\n  <div class=\"way\">\n    <h3><b>1 · A little every day<\/b><\/h3>\n    <p>3–5 problems a day is better than 30 problems on one day. Your brain learns while you sleep. Make practice a <span class=\"term\" data-t=\"habit\">habit<\/span>, like brushing your teeth.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Upsolve after every contest<\/b><\/h3>\n    <p><span class=\"term\" data-t=\"upsolving\">Upsolving<\/span> means: after the <span class=\"term\" data-t=\"contest\">contest<\/span>, solve the <b>next<\/b> problem, the first one you could not solve. This one problem teaches you more than ten easy ones. It is exactly at the edge of your level.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Never copy a solution<\/b><\/h3>\n    <p>If you copy code, you get a green \"Accepted\" and learn nothing. Understand the idea, close the page, and type every line yourself. If you cannot, you did not understand it yet.<\/p>\n  <\/div>\n<\/section>\n\n<section>\n  <h2>Contests<\/h2>\n  <ul>\n    <li>Join every <b>Div. 4<\/b>, <b>Div. 3<\/b> and <b>Educational<\/b> round. They are made for learning. Join Div. 2 rounds too when you have time.<\/li>\n    <li>No contest at a good time for you? Use <span class=\"term\" data-t=\"virtual\">virtual participation<\/span>: an old contest with a real timer. It does not change your rating.<\/li>\n    <li>In a contest, solve in order: A, then B, then C. Do not stay on one problem for the whole time.<\/li>\n    <li>Your rating goes up and down. This is normal. <b>Ignore it for your first 20 contests.<\/b> Count solved problems, not rating points.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>A simple weekly plan<\/h2>\n  <p>About 1–2 hours a day. Move the days to fit your week.<\/p>\n  <table>\n    <tr><th>Day<\/th><th>What you do<\/th><th>Time<\/th><\/tr>\n    <tr><td>1<\/td><td>One new page of this guide + the first problems of its ladder<\/td><td>90 min<\/td><\/tr>\n    <tr><td>2<\/td><td>3–4 problems at your rating, up to +200<\/td><td>60–90 min<\/td><\/tr>\n    <tr><td>3<\/td><td>Finish the ladder of this week's page<\/td><td>60–90 min<\/td><\/tr>\n    <tr><td>4<\/td><td>3–4 problems at your rating, up to +200<\/td><td>60–90 min<\/td><\/tr>\n    <tr><td class=\"hi\">5<\/td><td class=\"hi\">A contest: live, or virtual<\/td><td class=\"hi\">2 hours<\/td><\/tr>\n    <tr><td>6<\/td><td>Upsolve 1–2 problems of that contest. Write the tricks in your notebook.<\/td><td>60 min<\/td><\/tr>\n    <tr><td>7<\/td><td>Rest, or read your notebook again<\/td><td>10 min<\/td><\/tr>\n  <\/table>\n<\/section>\n\n<section>\n  <h2>Your notebook of tricks<\/h2>\n  <p>Keep a small notebook or a text file. After each problem that taught you something, write one or two lines. Read it again before a contest.<\/p>\n  <table>\n    <tr><th>Problem<\/th><th>Trick I learned<\/th><\/tr>\n    <tr><td>1A<\/td><td>Round up without double: (a + b − 1) / b.<\/td><\/tr>\n    <tr><td>160A<\/td><td>\"Fewest items to pass half of the sum\" → sort from big to small, take from the front.<\/td><\/tr>\n    <tr><td>(my bug)<\/td><td>The sum was int. Sum of many numbers → long long.<\/td><\/tr>\n  <\/table>\n<\/section>\n\n<section class=\"mistakes\">\n  <h2>Common mistakes<\/h2>\n  <ul>\n    <li>You solve only easy problems because green feels good. You stop growing.<\/li>\n    <li>You open the editorial after 5 minutes. The thinking time is the training.<\/li>\n    <li>You read the editorial and say \"I understand\", but you do not write the code.<\/li>\n    <li>You watch lessons for weeks and solve nothing. One lesson, then problems.<\/li>\n  <\/ul>\n<\/section>\n\n<section class=\"more\">\n  <h2>Learn more<\/h2>\n  <ul>\n    <li><a href=\"https://codeforces.com/group/MWSDmqGsZm/contests\">Assiut newcomers sheets<\/a> — hundreds of very easy problems, sorted by topic. Good before your first 800.<\/li>\n    <li><a href=\"https://cses.fi/problemset/\">CSES Problem Set<\/a> — 300+ classic problems, sorted by topic. No ratings, no contests, only practice.<\/li>\n    <li><a href=\"https://codeforces.com/edu/course/2\">Codeforces EDU<\/a> — free lessons with video, text and problems for each step.<\/li>\n  <\/ul>\n<\/section>\n","debugging":"<p class=\"idea\">Do not change code and hope. Look at the verdict, follow a checklist in order, and test your code against a slow, simple solution.<\/p>\n\n<section class=\"spot\">\n  <h2>First: read the verdict<\/h2>\n  <p>The <span class=\"term\" data-t=\"verdict\">verdict<\/span> tells you where to look. Each one has its own <span class=\"term\" data-t=\"checklist\">checklist<\/span> below.<\/p>\n  <table>\n    <tr><th>Verdict<\/th><th>Short<\/th><th>It means<\/th><\/tr>\n    <tr><td>Wrong answer<\/td><td>WA<\/td><td>The program ran, but printed something wrong.<\/td><\/tr>\n    <tr><td>Time limit exceeded<\/td><td>TLE<\/td><td>The program is too slow, or it never stops.<\/td><\/tr>\n    <tr><td>Runtime error<\/td><td>RE<\/td><td>The program crashed.<\/td><\/tr>\n  <\/table>\n<\/section>\n\n<section>\n  <h2>Wrong answer: check in this order<\/h2>\n  <ol>\n    <li><b>Read the statement again<\/b>, slowly. Also read the output format. Most bugs are here.<\/li>\n    <li><b>Test <span class=\"term\" data-t=\"edge-case\">edge cases<\/span> by hand:<\/b> n = 1, all numbers equal, already sorted, the maximum values, an answer of 0.<\/li>\n    <li><b>Overflow:<\/b> can a sum or a product pass 2·10<sup>9<\/sup>? Use <code>long long<\/code>. See <a href=\"#overflow\">int or long long?<\/a><\/li>\n    <li><b>Array bounds:<\/b> is every index from 0 to n − 1? Look at <code>a[i + 1]<\/code> and <code>a[i - 1]<\/code>.<\/li>\n    <li><b><span class=\"term\" data-t=\"uninitialised\">Uninitialised<\/span> variables:<\/b> <code>int sum;<\/code> holds garbage. Write <code>int sum = 0;<\/code><\/li>\n    <li><b>Many test cases:<\/b> do you reset every array and counter before each test case?<\/li>\n    <li><b>Spelling:<\/b> <code>YES<\/code> or <code>Yes<\/code>? A space or a new line between the numbers?<\/li>\n  <\/ol>\n  <p class=\"tip-box\">Explain your code line by line to a friend, or to an empty chair. When you must say what each line does, you often see the bug.<\/p>\n<\/section>\n\n<section>\n  <h2>Time limit exceeded<\/h2>\n  <ul>\n    <li><b>Count the steps<\/b> from the limits. More than about 10<sup>8<\/sup>? You need a faster idea, not a faster keyboard. See <a href=\"#complexity\">Limits → speed<\/a>.<\/li>\n    <li><b><code>endl<\/code><\/b> is slow when you print many lines. Print <code>\"\\n\"<\/code>.<\/li>\n    <li><b>A vector passed by value<\/b> is copied on every call. Write <code>const vector&lt;int&gt; &amp;a<\/code>.<\/li>\n    <li><b>A loop that never ends:<\/b> does the loop variable really change? Is it <code>i++<\/code> in the inner loop, or <code>j++<\/code>?<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Runtime error<\/h2>\n  <ul>\n    <li><b>Index <span class=\"term\" data-t=\"out-of-range\">out of range<\/span>:<\/b> an array that is too small, <code>a[n]<\/code>, or <code>a[-1]<\/code>.<\/li>\n    <li><b>Division by zero:<\/b> <code>x / 0<\/code> and <code>x % 0<\/code> both crash.<\/li>\n    <li><b>Empty container:<\/b> <code>v.back()<\/code>, <code>s.top()<\/code> or <code>q.front()<\/code> when nothing is inside.<\/li>\n    <li><b>Recursion that is too deep<\/b>, or that never stops because the stop condition is missing.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Print what your program thinks<\/h2>\n  <p>Print the variables inside the loop and compare them with your hand <span class=\"term\" data-t=\"trace\">trace<\/span>. Use <code>cerr<\/code>, not <code>cout<\/code>. The judge ignores <code>cerr<\/code>, so a forgotten line does not give Wrong answer.<\/p>\n<pre data-part=\"main\"><code class=\"cpp\">\nfor (int i = 0; i &lt; n; i++) {\n    sum += a[i];\n    cerr &lt;&lt; \"i=\" &lt;&lt; i &lt;&lt; \" a[i]=\" &lt;&lt; a[i] &lt;&lt; \" sum=\" &lt;&lt; sum &lt;&lt; \"\\n\";   // debug line\n}\n<\/code><\/pre>\n  <p class=\"note\">Still delete these lines before you submit. Printing a lot to <code>cerr<\/code> takes time.<\/p>\n<\/section>\n\n<section>\n  <h2>The strongest trick: stress testing<\/h2>\n  <p>All samples pass, but the judge says Wrong answer on test 7. You cannot see test 7. So you make your own tests. This is <span class=\"term\" data-t=\"stress-test\">stress testing<\/span>.<\/p>\n\n  <div class=\"way\">\n    <h3><b>1 · Story<\/b> — two students<\/h3>\n    <p>One student is fast but makes mistakes. The other is very slow but always right. Give both the same small questions. When their answers differ, you found a question where the fast student is wrong.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>2 · Picture<\/b> — the three parts<\/h3>\n    <table>\n      <tr><th>Part<\/th><th>What it is<\/th><\/tr>\n      <tr><td><code>fast(...)<\/code><\/td><td>Your real solution. Maybe it has a bug.<\/td><\/tr>\n      <tr><td><code>slow(...)<\/code><\/td><td>A <span class=\"term\" data-t=\"brute-force\">brute force<\/span>: simple loops that are clearly correct. Speed does not matter.<\/td><\/tr>\n      <tr><td>generator<\/td><td>Makes small <span class=\"term\" data-t=\"random\">random<\/span> inputs: n ≤ 6, values from −5 to 5.<\/td><\/tr>\n    <\/table>\n    <p class=\"note\">Small inputs are the point. A wrong case with 4 numbers is easy to check by hand. A wrong case with 1000 numbers is useless.<\/p>\n  <\/div>\n\n  <div class=\"way\">\n    <h3><b>3 · Code<\/b> — everything in one file<\/h3>\n    <p>Toy task: find the maximum sum of a <span class=\"term\" data-t=\"subarray\">subarray<\/span> (at least one
